# Publishes the built app (dist/) to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run-tests.mjs
      - run: node tests/engine-tests.mjs
      - run: node tools/build.mjs
      # Browser tests (docs/test-cases.md): drive the built app in Chromium before anything is published.
      - run: npm install --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tests/app-tests.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
