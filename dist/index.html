<title>Math 1 Practice</title>
<meta name="description" content="Adaptive NC Math 1 practice sets for an 8th grader, built on the WCPSS units.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: graph-paper notebook. Header + content column on wide screens; the set player puts the
   question beside a tools panel and stacks them on phones. */
:root {
  --bg: #f3f6f8; --surface: #ffffff; --surface-2: #eef2f6; --ink: #17212c; --muted: #586474;
  --line: #d6dde5; --grid: #e2e8ee; --accent: #2356d6; --accent-soft: #e4ecfd; --on-accent: #ffffff;
  --mark: #f2c230; --good: #1d7f55; --good-soft: #dff2e8; --bad: #be3a2b; --bad-soft: #fbe5e2;
  --t0: #c46a12; --t1: #2a7bbf; --t2: #6b4fc9; --ach: #1d7f55;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #151c24; --surface-2: #1b2430; --ink: #e5ebf1; --muted: #9aa6b4;
    --line: #2a3542; --grid: #212b36; --accent: #7ea4ff; --accent-soft: #1d2a45; --on-accent: #0e1319;
    --mark: #f2c230; --good: #5cc795; --good-soft: #15302a; --bad: #f08473; --bad-soft: #3a1f1c;
    --t0: #f0a050; --t1: #6fb2ec; --t2: #a891f2; --ach: #5cc795; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1b2430; --ink: #e5ebf1; --muted: #9aa6b4;
  --line: #2a3542; --grid: #212b36; --accent: #7ea4ff; --accent-soft: #1d2a45; --on-accent: #0e1319;
  --mark: #f2c230; --good: #5cc795; --good-soft: #15302a; --bad: #f08473; --bad-soft: #3a1f1c;
  --t0: #f0a050; --t1: #6fb2ec; --t2: #a891f2; --ach: #5cc795; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
#app { min-height: 100%; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
math { font-size: 1.08em; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px;
  border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.big { min-height: 50px; padding: 0 26px; font-size: 1.05rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.btn-quiet { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.9rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.center { justify-content: center; margin-block: 8px; }

/* Pills */
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.sm { font-size: 0.68rem; padding: 0 6px; }
.pill.ach { background: var(--good-soft); color: var(--ach); border-color: transparent; }
.pill.t0, .pill.lvl-basic { color: var(--t0); border-color: currentColor; background: transparent; }
.pill.t1, .pill.lvl-intermediate { color: var(--t1); border-color: currentColor; background: transparent; }
.pill.t2, .pill.lvl-hard { color: var(--t2); border-color: currentColor; background: transparent; }
.pill.lvl-challenge { color: var(--on-accent); background: var(--t2); border-color: var(--t2); }
.pill.calc-ok { color: var(--good); border-color: currentColor; background: transparent; }
.pill.calc-no { color: var(--bad); border-color: currentColor; background: transparent; }
.pill.think { color: var(--accent); border-color: currentColor; background: var(--accent-soft); }
.pill.done { color: var(--good); border-color: currentColor; background: transparent; }
.pill.lock { color: var(--muted); }
.lock-note { color: var(--muted); }
.parents .row { margin: 10px 0; }
.big-check { font-size: 1rem; margin: 8px 0; }
.file-btn { cursor: pointer; }
.flags { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
.flags li { border-top: 1px solid var(--line); padding-top: 8px; }
.btn-link.flag { margin-top: 8px; color: var(--muted); font-size: 0.85rem; }
.btn-link.flag.on { color: var(--bad); font-weight: 700; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 40px; height: 40px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark svg { width: 26px; height: 26px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; }
.brand-sub { font-size: 0.8rem; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 9px; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--muted); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.save-chip { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.save-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.save-chip.browser::before { background: var(--mark); }

.page { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 22px; }
.intro { display: flex; flex-direction: column; gap: 8px; max-width: 68ch; }
.intro p { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
.loading { padding: 80px 16px; text-align: center; color: var(--muted); font-size: 1.1rem; }

/* Resume banner */
.resume { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 18px; border-radius: var(--radius);
  background: var(--accent-soft); border: 1.5px solid var(--accent); }
.resume-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }

/* Units */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.unit-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.unit-card.planned { background: transparent; border-style: dashed; }
.unit-card.planned h3, .unit-card.planned .unit-num { color: var(--muted); }
.unit-card.mastered { border-color: var(--ach); }
.unit-head { display: flex; justify-content: space-between; align-items: center; }
.unit-num { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 700; color: var(--accent); }
.unit-meta, .unit-stats { font-size: 0.88rem; color: var(--muted); }
.unit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.skill-meter { display: flex; gap: 4px; }
.sm { flex: 1; height: 8px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.sm.t0 { background: var(--t0); border-color: var(--t0); opacity: 0.45; }
.sm.t1 { background: var(--t1); border-color: var(--t1); opacity: 0.7; }
.sm.t2 { background: var(--t2); border-color: var(--t2); }
.sm.ach { background: var(--ach); border-color: var(--ach); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
thead th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.88rem; white-space: nowrap; }
.score { font-weight: 700; }
.score.shi { color: var(--good); } .score.smid { color: var(--t0); } .score.slo { color: var(--bad); }
.qtable { width: auto; min-width: 280px; background: var(--surface); border: 1px solid var(--line); }
.qtable th, .qtable td { border: 1px solid var(--line); text-align: center; font-family: var(--font-mono); padding: 8px 14px; }
.qtable tbody th { background: var(--surface-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; min-width: 80px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.ladder td:not(:first-child):not(.num) { text-align: center; }
.rung { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.rung.done { background: var(--ach); border-color: var(--ach); }
.rung.now { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
.picker { flex-direction: row; flex-wrap: wrap; align-items: center; }
.picker select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* Set player */
body[data-view="set"] { background-image: none; }
.set-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.set-title { display: flex; flex-direction: column; line-height: 1.25; margin-right: auto; min-width: 0; }
.set-title .muted { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer { font-family: var(--font-mono); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.timer-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mark); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .timer-dot { animation: none; } }
.dots { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; max-width: 1280px; margin: 0 auto; }
.dot { width: 34px; height: 34px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; color: var(--muted); }
.dot.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.dot.here { outline: 3px solid var(--mark); outline-offset: 1px; color: var(--ink); }
.player { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding-inline: 16px; padding-block: 4px 110px; max-width: 1280px; margin: 0 auto; align-items: start; }
@media (max-width: 900px) { .player { grid-template-columns: minmax(0, 1fr); } }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qnum { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; margin-right: 4px; }
.qskill { font-size: 0.85rem; color: var(--muted); margin-top: -8px; }
.prompt { font-size: 1.12rem; line-height: 1.65; }
.qgraph { max-width: 460px; width: 100%; }
.qgraph.small { max-width: 340px; }
.legend { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lg-c, .lg-s, .lg-ring { display: inline-block; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; margin-left: 8px; }
.lg-s { border-radius: 2px; background: var(--t0); }
.lg-ring { background: transparent; border: 2px solid var(--good); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 14px; min-height: 52px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.choice:hover { border-color: var(--accent); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.letter { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--font-mono); font-size: 0.85rem; border: 1.5px solid var(--line); }
.choice.on .letter { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.box { flex: none; width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--line); }
.choice.on .box { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.ctext { min-width: 0; overflow-x: auto; }
.num-entry { display: flex; flex-direction: column; gap: 6px; font-weight: 700; max-width: 320px; }
.num-entry input { font: 600 1.25rem var(--font-mono); padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.num-entry input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.num-help { font-size: 0.85rem; color: var(--muted); }
.num-help.warn { color: var(--bad); }
.plot-wrap { display: flex; flex-direction: column; gap: 8px; max-width: 480px; }
.hint-row { border-top: 1px dashed var(--line); padding-top: 10px; }
.hint { background: color-mix(in srgb, var(--mark) 18%, var(--surface)); border-radius: 8px; padding: 10px 12px; }
.set-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.foot-mid { margin-right: auto; color: var(--muted); font-size: 0.9rem; flex: 1 1 160px; text-align: center; }
@media (max-width: 560px) { .dots { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; } .dot { flex: none; } .foot-mid { order: -1; flex-basis: 100%; } .player { padding-bottom: 150px; } }

/* Tools */
.tools { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 76px; min-width: 0; }
@media (max-width: 900px) { .tools { position: static; } }
.tool-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 8px; }
.ttab { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 7px 4px; cursor: pointer; font-weight: 700; color: var(--muted); }
.ttab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.tool-pane { display: flex; flex-direction: column; gap: 8px; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tool-row.small { font-size: 0.8rem; color: var(--muted); }
.tool-row.small input { width: 54px; font: inherit; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg-btn { border: 0; background: var(--surface); padding: 6px 10px; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--muted); border-right: 1px solid var(--line); }
.seg-btn:last-child { border-right: 0; }
.seg-btn.on { background: var(--accent); color: var(--on-accent); }
.check { font-size: 0.85rem; display: flex; gap: 4px; align-items: center; }
.pad { width: 100%; height: auto; aspect-ratio: 720 / 560; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); touch-action: none; cursor: crosshair; }

/* SVG grid */
.grid-svg { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; touch-action: manipulation; }
.grid-svg.interactive { cursor: crosshair; }
.grid-svg .minor { stroke: var(--grid); stroke-width: 1; }
.grid-svg .axis { stroke: var(--muted); stroke-width: 1.6; }
.grid-svg .tick { fill: var(--muted); font: 10px var(--font-mono); }
.grid-svg .axis-label { fill: var(--muted); font: 11px var(--font-body); }
.grid-svg .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.grid-svg .pt2 { fill: var(--t0); }
.grid-svg .pt-hover { fill: var(--accent); opacity: 0.3; pointer-events: none; }
.grid-svg .pt-answer { fill: none; stroke: var(--good); stroke-width: 2.5; }
.grid-svg .user-line { stroke: var(--accent); stroke-width: 2; }
.grid-svg .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; }
.grid-svg .curve.alt { stroke: var(--t0); }
.grid-svg .curve.dashed { stroke-dasharray: 7 5; }
.grid-svg .shade { fill: var(--accent); opacity: 0.16; }
.grid-svg .end-closed { fill: var(--accent); }
.grid-svg .end-open { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.grid-svg .curve-label { fill: var(--ink, currentColor); font: 600 12px var(--font-body); }

/* Calculator */
.calc-blocked { padding: 18px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-weight: 700; text-align: center; }
.calc-body { display: flex; flex-direction: column; gap: 8px; }
.calc-input { font: 600 1.1rem var(--font-mono); padding: 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); }
.calc-out { font: 700 1.2rem var(--font-mono); text-align: right; min-height: 1.6em; }
.calc-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ck { min-height: 42px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 1rem var(--font-mono); }
.ck-op { background: var(--surface-2); }
.ck-eq { background: var(--accent); color: var(--on-accent); border-color: var(--accent); grid-column: span 2; }
.calc-tape { list-style: none; margin: 0; padding: 0; font: 0.82rem var(--font-mono); color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

/* Results */
.score-hero { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.score-hero.mastered { border-color: var(--ach); border-width: 2px; }
.big-score { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 8vw, 4rem); line-height: 1; color: var(--muted); }
.big-score span { color: var(--ink); }
.big-score small { font-size: 0.4em; margin-left: 10px; color: var(--accent); }
.time-stats { display: grid; grid-template-columns: repeat(2, minmax(120px, auto)); gap: 10px 26px; margin: 0; }
.time-stats dt { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.time-stats dd { margin: 0; font: 700 1.05rem var(--font-mono); }
.mastered-panel { background: var(--good-soft); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.mastered-panel h2 { color: var(--ach); }
.events { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.review-filter { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; align-self: flex-start; }
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.ritem { border: 1px solid var(--line); border-left: 5px solid var(--good); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ritem.bad { border-left-color: var(--bad); }
.rhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; }
.rhead .muted { font-weight: 400; font-size: 0.85rem; }
.mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--good-soft); color: var(--good); }
.ritem.bad .mark { background: var(--bad-soft); color: var(--bad); }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.ans-grid > div { background: var(--surface-2); border-radius: 7px; padding: 10px; min-width: 0; overflow-x: auto; }
.lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
.why { font-size: 0.93rem; background: var(--bad-soft); border-radius: 7px; padding: 8px 10px; }
details summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.solution { padding: 8px 2px 2px; line-height: 1.8; overflow-x: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; max-width: calc(100% - 32px); }

/* Skill checklist: only shown by designs that style it */
.skill-list { display: none; }

/* fonts: https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Courier+Prime:wght@400;700&display=swap */
/* Theme "Study Desk": a green cutting mat with real paper on it.
   Units are manila folders, a set is a stack of index cards, the question is the card on top,
   tools are a calculator and a graph pad, results come back on a clipboard marked in red pen.
   One meaning per visual: ✓ = skill got it / answer right, • = skill in progress, face-up card = answered,
   card back (striped) = not answered yet, yellow edge = the card you are on. */
:root {
  --bg: #2E5E4E; --surface: #FFFDF6; --surface-2: #F3EFE4; --ink: #1F2430; --muted: #4A4F5A;
  --line: #D8D2C2; --grid: #C7DBEE; --accent: #2E4A7A; --accent-soft: #E3E9F3; --on-accent: #FFFFFF;
  --mark: #FFE45C; --good: #2F7A4F; --good-soft: #E1EFE5; --bad: #C8243A; --bad-soft: #F8E1E3;
  --t0: #9A5413; --t1: #2E4A7A; --t2: #5B3C7A; --ach: #2F7A4F;
  --on-mat: #F2F0EA; --manila: #E8C783; --manila-tab: #DDB76C; --folder: #D9BE87; --folder-tab: #CDB07A;
  --rule: #C7DBEE; --margin: #E58C8C; --pen: #2E4A7A; --redpen: #C8243A; --clip: #8A5A33;
  --shadow: 0 8px 14px rgba(0, 0, 0, 0.32);
  --font-display: "Kalam", "Comic Sans MS", cursive;
  --font-body: "Courier Prime", "Courier New", ui-monospace, monospace;
  --font-mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  --radius: 3px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1E3E34; --surface: #F6F1E4; --surface-2: #ECE6D6; --shadow: 0 8px 16px rgba(0, 0, 0, 0.5); color-scheme: light; }
}
:root[data-theme="dark"] { --bg: #1E3E34; --surface: #F6F1E4; --surface-2: #ECE6D6; --shadow: 0 8px 16px rgba(0, 0, 0, 0.5); color-scheme: light; }

/* The mat: a fine and a coarse grid, and a ruler along the top edge */
body { font-size: 18px; line-height: 1.5; background-color: var(--bg); background-attachment: scroll;
  background-image: linear-gradient(rgba(255,255,255,0.13) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.13) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
body[data-view="set"] { background-image: linear-gradient(rgba(255,255,255,0.13) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.13) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px); }
#app::before { content: ""; display: block; height: 22px; background-color: rgba(0,0,0,0.18);
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.55) 0 1px, transparent 1px 24px), repeating-linear-gradient(90deg, rgba(255,255,255,0.8) 0 2px, transparent 2px 120px);
  background-size: 100% 9px, 100% 18px; background-repeat: no-repeat; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }
.muted { color: var(--muted); }

/* Header: sits on the mat */
.top { background: transparent; border: 0; padding: 18px 24px 6px; color: var(--on-mat); }
.brand-mark { display: none; }
.brand-name { display: inline-block; padding: 4px 22px 0; background: #EFE6CF; color: var(--ink); transform: rotate(-2deg); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.9rem; line-height: 1.25; }
.brand-sub { color: var(--on-mat); margin-top: 8px; }
.tabs { background: transparent; padding: 0; gap: 10px; }
.tab { min-height: 46px; padding: 0 20px; border-radius: 8px 8px 0 0; background: var(--folder); color: var(--ink); font-family: var(--font-display); font-size: 1.15rem; box-shadow: var(--shadow); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.save-chip { color: var(--on-mat); }
.save-chip::before { display: none; }

.page { gap: 40px; padding-top: 28px; }
.intro h1 { display: inline-block; align-self: flex-start; padding: 2px 22px 0; background: #EFE6CF; transform: rotate(-1.5deg); box-shadow: var(--shadow); font-size: 2.2rem; }
.intro p { color: var(--on-mat); }
.eyebrow { font-family: var(--font-body); letter-spacing: 0.04em; }

/* Buttons: printed labels */
.btn { min-height: 52px; padding: 0 24px; border-radius: var(--radius); border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 1.05rem; }
.btn:hover:not(:disabled) { border-color: var(--ink); background: var(--surface-2); }
.btn.primary { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.btn.primary:hover:not(:disabled) { background: #000; filter: none; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--on-mat); text-decoration: underline; text-underline-offset: 4px; }
.btn.big { min-height: 58px; }
.btn:disabled { opacity: 0.55; }
.btn-link { color: var(--pen); }
.pill { border-radius: var(--radius); border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); font-family: var(--font-body); }
.pill.t0, .pill.t1, .pill.t2, .pill.lvl-basic, .pill.lvl-intermediate, .pill.lvl-hard { color: var(--ink); border-color: var(--ink); background: var(--surface); }
.pill.lvl-challenge { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.pill.calc-ok, .pill.calc-no { background: transparent; border-width: 2.5px; transform: rotate(-5deg); font-weight: 700; }
.pill.calc-ok { color: var(--good); border-color: var(--good); }
.pill.calc-no { color: #4A4D55; border-color: #4A4D55; }
.pill.ach { background: var(--surface); color: var(--pen); border-color: var(--pen); font-family: var(--font-display); }

/* Paper */
.panel, .score-hero, .tools .tool-pane[data-pane="draw"] { background: var(--surface); border: 0; border-radius: 0; box-shadow: var(--shadow); }
.panel h2 { font-size: 1.6rem; }
table { font-size: 1rem; }
thead th { letter-spacing: 0.04em; }

/* "Where you left off": a small stack of cards */
.resume { position: relative; background-color: var(--surface); border: 0; border-radius: 0; color: var(--ink); transform: rotate(-0.8deg); box-shadow: var(--shadow), 6px 6px 0 -1px #F3EFE4, 10px 11px 0 -1px #E9E4D6;
  background-image: linear-gradient(transparent 46px, var(--margin) 46px 48px, transparent 48px), repeating-linear-gradient(transparent 0 33px, var(--rule) 33px 34px); background-position: 0 0, 0 48px; padding: 12px 22px; }
.resume-title { font-family: var(--font-display); font-size: 1.5rem; }
.resume .btn.primary { background: var(--mark); color: var(--ink); border-color: var(--mark); box-shadow: var(--shadow); }

/* Units: manila folders. The open unit is a big folder with lined paper inside; the rest are small folders on the mat */
.unit-grid { display: flex; flex-wrap: wrap; gap: 26px 20px; align-items: flex-start; }
.unit-card { position: relative; border-radius: 0 10px 10px 10px; }
.unit-card:not(.planned) { flex: 1 1 100%; max-width: 820px; margin-top: 40px; padding: 26px 30px 28px; gap: 6px;
  border: 18px solid var(--manila); box-shadow: var(--shadow); transform: rotate(-0.5deg);
  background-color: var(--surface); background-image: repeating-linear-gradient(transparent 0 33px, var(--rule) 33px 34px); background-position: 0 30px; }
.unit-card:not(.planned) .unit-head { position: absolute; top: -58px; left: 10px; padding: 4px 24px 2px; background: var(--manila-tab); border-radius: 10px 10px 0 0; gap: 10px; }
.unit-card:not(.planned) .unit-num { font-family: var(--font-display); font-size: 1.35rem; color: var(--ink); }
.unit-card:not(.planned) h3 { font-family: var(--font-body); font-size: 1.9rem; }
.unit-card.mastered .unit-head .pill { transform: rotate(-4deg); }
.unit-meta, .unit-stats { color: var(--muted); font-size: 0.95rem; }
.unit-stats { font-family: var(--font-display); color: var(--pen); font-size: 1.2rem; }
.skill-meter { display: none; }
.unit-actions { padding-top: 14px; }

.skill-list { display: flex; flex-direction: column; list-style: none; margin: 8px 0 0; padding: 0; }
.sk { display: flex; align-items: center; gap: 14px; min-height: 34px; }
.sk-box { flex: none; width: 24px; height: 24px; border: 2px solid #3B3E45; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1; color: var(--pen); }
.sk-name { flex: 1; }
.sk-note { font-family: var(--font-display); color: var(--pen); font-size: 1.1rem; white-space: nowrap; }

.unit-card.planned { flex: 0 1 170px; margin-top: 30px; padding: 10px 12px 12px; min-height: 108px; border: 0; background: var(--folder); box-shadow: var(--shadow); gap: 4px; }
.unit-card.planned:nth-child(odd) { transform: rotate(-1.5deg); }
.unit-card.planned:nth-child(even) { transform: rotate(1.2deg); }
.unit-card.planned .unit-head { position: absolute; top: -30px; left: 0; padding: 2px 14px; background: var(--folder-tab); border-radius: 8px 8px 0 0; }
.unit-card.planned .unit-num { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); }
.unit-card.planned h3 { font-family: var(--font-body); font-size: 0.95rem; font-weight: 400; color: var(--ink); line-height: 1.3; }
.unit-card.planned .unit-meta { display: none; }
.unit-card.planned .pill { position: absolute; left: 10px; bottom: 10px; font-family: var(--font-display); font-weight: 400; border: 0; border-radius: 10px; padding: 0 8px; }

/* Progress page: the skill ladder uses the same marks as the checklist */
.rung { width: 24px; height: 24px; border-radius: 0; border: 2px solid #3B3E45; background: transparent; display: inline-grid; place-items: center; }
.rung.done { background: transparent; border-color: #3B3E45; }
.rung.done::after { content: "✓"; font: 700 1.4rem/1 var(--font-display); color: var(--pen); }
.rung.now { background: transparent; border-color: #3B3E45; box-shadow: none; }
.rung.now::after { content: "•"; font: 700 1.4rem/1 var(--font-display); color: var(--pen); }
.bar { height: 10px; border-radius: 0; background: var(--surface-2); }
.bar span { background: var(--pen); }
.picker label, .picker { color: var(--ink); }

/* ── Set: a pile of cards on the left, the card on top in the middle, tools on the right ── */
body[data-view="set"] #app { display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-areas: "ruler ruler" "bar bar" "quilt player" "foot foot"; align-items: start; }
body[data-view="set"] #app::before { grid-area: ruler; }
body[data-view="set"] .set-bar { grid-area: bar; }
body[data-view="set"] .dots { grid-area: quilt; }
body[data-view="set"] .player { grid-area: player; }
body[data-view="set"] .set-foot { grid-area: foot; }
.set-bar { position: static; background: transparent; border: 0; padding: 16px 24px 4px; color: var(--on-mat); flex-wrap: wrap; }
.set-bar .btn.quiet { color: var(--on-mat); padding: 0 6px; min-height: 44px; }
.set-title { margin-right: auto; }
.set-title .muted { color: var(--on-mat); }
.set-title strong { display: inline-block; align-self: flex-start; padding: 2px 18px 0; background: #EFE6CF; color: var(--ink); transform: rotate(-1.5deg); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.35rem; }
.timer { background: var(--surface); color: var(--ink); padding: 4px 14px; transform: rotate(1deg); box-shadow: var(--shadow); font-size: 1.3rem; }
.timer-dot { display: none; }

.dots { position: sticky; top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; margin: 22px 0 0 22px; padding: 0; align-self: start; }
.dots::before { content: "Your cards"; grid-column: 1 / -1; font: 700 1.4rem var(--font-display); color: var(--on-mat); }
.dot { width: auto; height: 46px; border: 0; border-radius: 0; font: 700 0.95rem var(--font-mono); color: var(--ink); box-shadow: 0 3px 6px rgba(0,0,0,0.35);
  background-color: var(--surface); background-image: repeating-linear-gradient(45deg, rgba(46,74,122,0.13) 0 5px, transparent 5px 10px); }
.dot:nth-child(odd) { transform: rotate(-2deg); }
.dot:nth-child(even) { transform: rotate(1.5deg); }
.dot.done { background-image: none; background-color: var(--surface); color: var(--pen); }
.dot.here { outline: 4px solid var(--mark); outline-offset: 0; transform: rotate(0) scale(1.08); z-index: 1; color: var(--ink); }

.player { grid-template-columns: minmax(0, 1fr) 300px; gap: 34px; padding: 24px 24px 130px; }
.qcard { position: relative; border: 0; border-radius: 0; padding: 14px 34px 40px; gap: 16px; transform: rotate(-0.5deg); box-shadow: 0 18px 30px rgba(0,0,0,0.4);
  background-color: var(--surface); background-image: linear-gradient(transparent 76px, var(--margin) 76px 78px, transparent 78px), repeating-linear-gradient(transparent 0 33px, var(--rule) 33px 34px); background-position: 0 0, 0 78px; }
.qmeta { min-height: 62px; gap: 14px; }
.qnum { font-family: var(--font-display); font-size: 2rem; line-height: 1; }
.qskill { margin-top: 0; color: var(--muted); font-size: 0.95rem; }
.prompt { font-size: 1.3rem; line-height: 34px; font-weight: 700; }
.choices { gap: 4px; }
.choice { min-height: 64px; border: 0; border-radius: 0; background: transparent; gap: 20px; font-size: 1.25rem; padding: 6px 4px; }
.choice:hover { border: 0; background: rgba(46,74,122,0.07); }
.choice.on { background: transparent; border: 0; font-weight: 700; }
.letter { width: 52px; height: 34px; border-radius: 50%; border: 2.5px solid #3B3E45; background: transparent; font-family: var(--font-body); font-size: 1rem; }
.choice.on .letter { background: #3B3E45; border-color: #2B2E35; color: #FFFFFF; }
.box { width: 26px; height: 26px; border-radius: 0; border: 2.5px solid #3B3E45; }
.choice.on .box { background: #3B3E45; border-color: #3B3E45; box-shadow: inset 0 0 0 4px var(--surface); }
.num-entry { max-width: 360px; }
.num-entry input { font: 700 1.9rem var(--font-display); color: var(--pen); background: transparent; border: 0; border-bottom: 3px solid #3B3E45; border-radius: 0; padding: 4px 6px; }
.num-entry input:focus { box-shadow: none; border-bottom-color: var(--pen); outline: 3px solid var(--mark); outline-offset: 2px; }
.qtable, .qtable tbody th { background: var(--surface); }
.hint-row { border-top: 0; padding-top: 6px; }
[data-act="hint"] { width: 176px; min-height: 120px; padding: 16px 14px; background: var(--mark); border: 0; transform: rotate(4deg); box-shadow: var(--shadow); color: var(--ink);
  font: 400 1.3rem/1.25 var(--font-display); text-decoration: none; text-align: left; }
[data-act="hint"]::after { content: " (tap me)"; }
.hint { background: var(--mark); border-radius: 0; padding: 16px 18px; transform: rotate(1deg); box-shadow: var(--shadow); font-family: var(--font-display); font-size: 1.2rem; max-width: 520px; }

.set-foot { background: rgba(20, 40, 33, 0.92); border-top: 0; padding-block: 12px; }
.foot-mid { color: var(--on-mat); }
.set-foot [data-act="prev"] { background: var(--surface); border-color: var(--surface); }
.set-foot [data-act="next"] { background: var(--ink); color: #FFFFFF; border-color: #FFFFFF; }
.set-foot [data-act="prev"]::before { content: "←"; }
.set-foot [data-act="next"]::after { content: "→"; }
#submit-btn { background: var(--mark); color: var(--ink); border-color: var(--mark); }

/* Tools: a calculator and a graph pad on the desk */
.tools { position: sticky; top: 12px; background: transparent; border: 0; padding: 0; gap: 14px; }
.tool-tabs { background: transparent; padding: 0; gap: 6px; }
.ttab { min-height: 44px; border-radius: 8px 8px 0 0; background: var(--folder); color: var(--ink); font-family: var(--font-display); font-size: 1.1rem; }
.ttab.on { background: var(--surface); color: var(--ink); box-shadow: none; }
.tool-pane { background: var(--surface); padding: 12px; box-shadow: var(--shadow); }
.tool-pane[data-pane="calc"] { background: #2A2C31; border-radius: 20px 20px 28px 28px; padding: 18px 16px 22px; color: #F2F0EA; transform: rotate(1.5deg); }
.calc-input { background: #BFCBA8; color: #23301E; border: 0; border-radius: 6px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.35); }
.calc-out { color: #F2F0EA; }
.calc-tape { color: #C9CCD2; }
.ck { min-height: 46px; border: 0; border-radius: 8px; background: #44474F; color: #FFFFFF; box-shadow: 0 3px 0 rgba(0,0,0,0.45); }
.ck-op { background: #5A5E68; }
.ck-eq { background: var(--mark); color: var(--ink); border: 0; }
.calc-blocked { background: #2A2C31; color: var(--mark); border-radius: 12px; font-family: var(--font-display); font-size: 1.2rem; }
.tool-row.small { color: var(--muted); }
.seg { border-color: var(--ink); border-radius: 0; }
.seg-btn { color: var(--ink); background: var(--surface); }
.seg-btn.on { background: var(--ink); color: #FFFFFF; }
.grid-svg { border: 0; border-top: 20px solid #3B3E45; border-radius: 0; background: #FFFFFF; }
.qcard .grid-svg { border-top-width: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
.grid-svg .pt { fill: var(--pen); }
.pad { border: 0; border-radius: 0; background: #FFFFFF; }

/* Results: handed back on a clipboard, marked in red pen */
.page.results { gap: 34px; }
.score-hero { position: relative; border: 22px solid var(--clip); border-top-width: 54px; border-radius: 16px; transform: rotate(-0.6deg);
  background-color: var(--surface); background-image: repeating-linear-gradient(transparent 0 33px, var(--rule) 33px 34px); background-position: 0 20px; }
.score-hero::before { content: ""; position: absolute; top: -66px; left: 50%; transform: translateX(-50%); width: 170px; height: 50px; background: #B8BCC4; border-radius: 10px 10px 4px 4px; box-shadow: 0 6px 8px rgba(0,0,0,0.35); }
.big-score { display: inline-block; margin-top: 10px; padding: 12px 26px 4px; border: 4px solid var(--redpen); border-radius: 50%; transform: rotate(-7deg); font-family: var(--font-display); color: var(--redpen); }
.big-score span { color: var(--redpen); }
.big-score small { color: var(--redpen); }
.time-stats dt { letter-spacing: 0.04em; }
.time-stats dd { font-family: var(--font-body); }
.mastered-panel { background: var(--surface); border-radius: 0; box-shadow: var(--shadow); }
.mastered-panel h2 { color: var(--pen); font-size: 2rem; transform: rotate(-1.5deg); }
.events li { font-family: var(--font-display); color: var(--redpen); font-size: 1.15rem; }
.review { gap: 22px; }
.ritem { border: 0; border-radius: 0; padding: 10px 24px 22px; box-shadow: var(--shadow);
  background-color: var(--surface); background-image: linear-gradient(transparent 56px, var(--margin) 56px 58px, transparent 58px), repeating-linear-gradient(transparent 0 33px, var(--rule) 33px 34px); background-position: 0 0, 0 58px; }
.ritem:nth-child(odd) { transform: rotate(0.5deg); }
.ritem:nth-child(even) { transform: rotate(-0.5deg); }
.ritem.bad { border: 0; }
.rhead { min-height: 46px; font-family: var(--font-display); font-size: 1.3rem; }
.mark, .ritem.bad .mark { background: transparent; color: var(--redpen); font: 700 1.9rem/1 var(--font-display); }
.ans-grid > div { background: transparent; border: 1.5px dashed var(--line); border-radius: 0; }
.why { background: transparent; font-family: var(--font-display); color: var(--redpen); font-size: 1.15rem; }
.solution { font-family: var(--font-body); }
details summary { color: var(--pen); }
.review-filter { border-color: var(--ink); border-radius: 0; }
.row.center .btn:not(.primary) { background: var(--surface); }
.page.results > .row.center .btn.primary { background: var(--mark); color: var(--ink); border-color: var(--mark); }
.loading { color: var(--on-mat); }
.toast { background: var(--mark); color: var(--ink); border-radius: 0; font-family: var(--font-display); }

@media (max-width: 1100px) { .player { grid-template-columns: minmax(0, 1fr); } .tools { position: static; max-width: 520px; } }
@media (max-width: 760px) {
  body[data-view="set"] #app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "ruler" "bar" "quilt" "player" "foot"; }
  .dots { position: static; grid-template-columns: repeat(25, 46px); margin: 12px 12px 0; padding: 6px 4px 10px; overflow-x: auto; }
  .dots::before { display: none; }
  .player { padding: 18px 12px 110px; }

<script>/* app/src/qlib.js */
/* Question-building helpers shared by every unit's generators.
   Plain script: attaches to globalThis.M1 so it runs in the browser and in node tests. */
(function (G) {
  const M1 = (G.M1 = G.M1 || {});

  // Seeded random numbers (mulberry32) so any question can be rebuilt from its seed.
  function rng(seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const r = {
      next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      sign: () => (next() < 0.5 ? -1 : 1),
      chance: (p) => next() < p,
      shuffle: (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      },
      intNot: (lo, hi, bad) => {
        for (let k = 0; k < 100; k++) {
          const v = lo + Math.floor(next() * (hi - lo + 1));
          if (!bad.includes(v)) return v;
        }
        return lo;
      },
    };
    return r;
  }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a, b] = [b, a % b];
    return a || 1;
  }

  // Format a number for display: integers plainly, simple fractions as a/b, else up to 4 decimals.
  function fmt(x) {
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    for (const d of [2, 3, 4, 5, 6, 8, 9, 10, 12, 16, 25, 27, 32, 64, 81, 100, 125, 243, 256]) {
      const n = x * d;
      if (Math.abs(n - Math.round(n)) < 1e-9) {
        const g = gcd(Math.round(n), d);
        return `${Math.round(n) / g}/${d / g}`;
      }
    }
    return String(Math.round(x * 10000) / 10000);
  }

  // Same, as KaTeX (fractions stacked).
  function tex(x) {
    const s = fmt(x);
    if (s.includes("/")) {
      const neg = s.startsWith("-");
      const [n, d] = s.replace("-", "").split("/");
      return `${neg ? "-" : ""}\\frac{${n}}{${d}}`;
    }
    return s;
  }

  // "+ 3" / "- 3" for writing equations.
  function signed(x, texMode = true) {
    const v = texMode ? tex(Math.abs(x)) : fmt(Math.abs(x));
    return x < 0 ? `- ${v}` : `+ ${v}`;
  }

  // Build a 4-option multiple choice from the correct text and named mistakes.
  // distractors: [{text, why}] — duplicates and copies of the answer are dropped;
  // fillers ({text, why}) top it up to 4 if needed.
  function mcq(correct, distractors, r, fillers = [], correctWhy = "Correct.") {
    const seen = new Set([norm(correct)]);
    const wrong = [];
    for (const d of distractors.concat(fillers)) {
      const k = norm(d.text);
      if (seen.has(k)) continue;
      seen.add(k);
      wrong.push(d);
      if (wrong.length === 3) break;
    }
    if (wrong.length < 3) throw new Error("mcq: not enough distinct distractors for " + correct);
    const all = r.shuffle([{ text: correct, why: correctWhy, ok: true }].concat(wrong));
    return {
      choices: all.map((c) => c.text),
      answer: all.findIndex((c) => c.ok),
      why: all.map((c) => c.why),
    };
  }

  // Multi-select: items [{text, ok, why}] shuffled; answer = sorted indices of ok items.
  function multi(items, r) {
    const all = r.shuffle(items);
    return {
      choices: all.map((c) => c.text),
      answer: all.map((c, i) => (c.ok ? i : -1)).filter((i) => i >= 0),
      why: all.map((c) => c.why || ""),
    };
  }

  function norm(s) {
    return String(s).replace(/\s+/g, "").toLowerCase();
  }

  // Parse a typed number: integers, decimals, fractions (3/4, -2 1/2), commas allowed.
  function parseNum(s) {
    if (s == null) return NaN;
    s = String(s).trim().replace(/,/g, "").replace(/−/g, "-").replace(/^\$/, "");

  const terms = (f, count, start = 1) => Array.from({ length: count }, (_, i) => f(start + i));
  const list = (arr) => arr.map((x) => fmt(x)).join(", ");

  // Equation strings in function notation
  const eqArithExplicit = (a, d, name = "f") => `${name}(n) = ${tex(a)} ${signed(d)}(n - 1)`;
  const eqGeomExplicit = (a, r, name = "f") => `${name}(n) = ${tex(a)} \\cdot ${paren(r)}^{n - 1}`;
  const eqArithRecursive = (a, d, name = "f") => `${name}(1) = ${tex(a)},\\ ${name}(n) = ${name}(n - 1) ${signed(d)}`;
  const eqGeomRecursive = (a, r, name = "f") => `${name}(1) = ${tex(a)},\\ ${name}(n) = ${paren(r)} \\cdot ${name}(n - 1)`;
  function paren(x) {

    return x < 0 || t.includes("frac") ? `\\left(${t}\\right)` : t;
  }

  function windowFor(points, opts = {}) {
    const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
    const xmax = Math.max(opts.minX || 0, ...xs) + 1;
    let ymin = Math.min(0, ...ys), ymax = Math.max(0, ...ys);
    const span = ymax - ymin || 1;
    const step = niceStep(span / 8);
    ymin = Math.floor(ymin / step) * step - (ymin < 0 ? step : 0);
    ymax = Math.ceil(ymax / step) * step + step;
    return { xmin: 0, xmax: Math.max(6, xmax), ymin, ymax, xstep: 1, ystep: step };
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p;
    return 10 * p;
  }

  // ── Shared by the later units ──
  // Linear expression mx + b in KaTeX (handles m = ±1, b = 0, fractions).
  function lin(m, b, v = "x") {
    if (m === 0) return tex(b);
    const mt = m === 1 ? "" : m === -1 ? "-" : tex(m);
    return `${mt}${v}${b === 0 ? "" : " " + signed(b)}`;
  }
  // a/b reduced, as KaTeX.
  function frac(n, d) {
    const g = gcd(n, d), s = (n < 0) !== (d < 0) && n !== 0 ? "-" : "";
    const N = Math.abs(n) / g, D = Math.abs(d) / g;
    return D === 1 ? `${s}${N}` : `${s}\\frac{${N}}{${D}}`;
  }

  // Sample y = f(x) on [x0, x1] as a polyline, cut where it leaves [ylo, yhi] by a margin.
  function sample(f, x0, x1, n = 80) {
    const out = [];
    for (let i = 0; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / n, y = f(x); if (Number.isFinite(y)) out.push([clean(x), clean(y)]); }

  }

  const box = (lo, hi, step = 1, ylo = lo, yhi = hi, ystep = step) => ({ xmin: lo, xmax: hi, ymin: ylo, ymax: yhi, xstep: step, ystep });

  function terms2(a, b, x = "x", y = "y") {
    const t1 = a === 0 ? "" : `${a === 1 ? "" : a === -1 ? "-" : a}${x}`;
    if (b === 0) return t1 || "0";
    const bb = Math.abs(b) === 1 ? "" : Math.abs(b);
    return t1 ? `${t1} ${b < 0 ? "-" : "+"} ${bb}${y}` : `${b < 0 ? "-" : ""}${bb}${y}`;
  }

  function quad(a, b, c, v = "x") {
    let s = a === 1 ? `${v}^2` : a === -1 ? `-${v}^2` : `${tex(a)}${v}^2`;
    if (b) s += ` ${b < 0 ? "-" : "+"} ${Math.abs(b) === 1 ? "" : tex(Math.abs(b))}${v}`;
    if (c) s += ` ${signed(c)}`;
    return s;
  }

  // "Find the mistake": steps shown in order, the student picks the first wrong one (or none).
  // bad = index of the wrong step, or -1 when the work is right.
  function findStep(steps, bad, whyWrong) {
    const choices = steps.map((_, i) => `Step ${i + 1}`).concat(["There is no mistake"]);
    const answer = bad < 0 ? steps.length : bad;
    const why = choices.map((_, i) => (i === answer ? "Correct." : i < steps.length && i !== bad ? `Step ${i + 1} is right.` : bad < 0 ? "Every step checks out." : whyWrong));

/* Unit 1 Sequences: question generators.
   Each generator: { id, skill, level, type, calc, make(r) } where make returns
   { key, prompt, ... } and every answer is computed here, never typed by hand. */
(function (G) {
  const M1 = G.M1;
  const { fmt, tex, signed, mcq, multi, arith, geom, terms, list, texList, paren,
    eqArithExplicit, eqGeomExplicit, eqArithRecursive, eqGeomRecursive, windowFor } = M1.qlib;

  const L = { B: "basic", I: "intermediate", H: "hard", C: "challenge" };
  const gens = [];
  const add = (g) => gens.push(g);
  const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));

  // ───────────────────────── Growing patterns and expressions ─────────────────────────
  add({ id: "u1.pat.evaluate", skill: "u1.patterns", level: L.B, type: "numeric", calc: false,
    make(r) {
      const d = r.int(2, 6), c = r.int(1, 9), n = r.int(5, 12);
      return { key: [d, c, n],
        prompt: `A tile pattern has $${d}n + ${c}$ tiles in figure $n$. How many tiles are in figure ${n}?`,
        answer: d * n + c,
        hint: `Replace $n$ with ${n}.`,
        solution: `$${d}(${n}) + ${c} = ${d * n} + ${c} = \\mathbf{${d * n + c}}$` };
    } });

  add({ id: "u1.pat.table-expr", skill: "u1.patterns", level: L.I, type: "mcq", calc: false,
    make(r) {
      const d = r.int(2, 9), a = r.intNot(1, 15, [d]);
      const t = terms((n) => arith(a, d, n), 4);
      const c = a - d; // f(n) = dn + c
      const ex = (k) => (k === 0 ? `$${d}n$` : `$${d}n ${signed(k)}$`);
      const m = mcq(ex(c), [
        { text: ex(a), why: `This gives figure 1 = ${d + a}. The constant must make figure 1 equal ${a}.` },
        { text: `$${a}n ${signed(d)}$`, why: "This swaps the starting amount and the amount added each time." },
        { text: `$n ${signed(d)}$`, why: `The pattern grows by ${d} each figure, so the coefficient of $n$ is ${d}.` },
      ], r, [{ text: `$${d + 1}n ${signed(c - 1)}$`, why: `Check figure 2: this does not give ${t[1]}.` }]);
      return { key: [a, d], ...m,
        prompt: `The table shows the number of tiles in each figure of a pattern. Which expression gives the number of tiles in figure $n$?`,
        table: { headers: ["Figure n", "1", "2", "3", "4"], rows: [["Tiles", ...t.map(fmt)]] },
        hint: "How many tiles are added each time? That number multiplies $n$.",
        solution: `Tiles go up by ${d} each figure, so start with $${d}n$. For figure 1, $${d}(1) = ${d}$ but we need ${a}, so add ${c}.<br>Expression: $\\mathbf{${d}n ${c === 0 ? "" : signed(c)}}$` };
    } });

  add({ id: "u1.pat.border-multi", skill: "u1.patterns", level: L.H, type: "multi", calc: false,
    make(r) {
      const n = r.int(4, 9);
      const items = [
        { text: "$4n + 4$", ok: true },
        { text: "$4(n + 1)$", ok: true },
        { text: "$(n + 2)^2 - n^2$", ok: true },
        { text: "$2n + 2(n + 2)$", ok: true },
        { text: "$4n$", ok: false, why: "This misses the 4 corner tiles." },
        { text: "$(n + 2)^2$", ok: false, why: "This counts the inside squares too." },
        { text: "$4(n + 2)$", ok: false, why: "This counts each corner twice." },
      ];
      const pick = r.shuffle(items.filter((i) => i.ok)).slice(0, r.int(2, 3)).concat(r.shuffle(items.filter((i) => !i.ok)).slice(0, 2));
      const m = multi(pick, r);
      return { key: [n, m.choices.join("|")], ...m,
        prompt: `A square garden is $n$ by $n$ tiles. One row of border tiles goes all the way around it, including the corners. Select **all** expressions that give the number of border tiles.`,
        hint: `Try it with $n = ${n}$: draw it or count. Then test each expression.`,
        solution: `For $n = ${n}$ there are $4(${n}) + 4 = ${4 * n + 4}$ border tiles (4 sides of ${n} plus 4 corners). Each correct expression simplifies to $4n + 4$: $4(n+1)$, $(n+2)^2 - n^2 = 4n + 4$, $2n + 2(n+2) = 4n + 4$.` };
    } });

  add({ id: "u1.pat.which-figure", skill: "u1.patterns", level: L.C, type: "numeric", calc: false,
    make(r) {
      const d = r.int(3, 7), a = r.int(2, 10), k = r.int(15, 40);
      const f5 = arith(a, d, 5), target = arith(a, d, k);
      return { key: [a, d, k],
        prompt: `Figure 1 of a pattern has ${a} squares and figure 5 has ${f5} squares. The same number of squares is added each time. Which figure has exactly ${target} squares?`,
        answer: k,
        hint: "First find how many squares are added each time.",
        solution: `From figure 1 to figure 5 is 4 steps: $(${f5} - ${a}) \\div 4 = ${d}$ per step.<br>$${a} + ${d}(n - 1) = ${target}$ → $${d}(n-1) = ${target - a}$ → $n - 1 = ${k - 1}$ → $n = \\mathbf{${k}}$` };
    } });

  // ───────────────────────── Arithmetic sequences ─────────────────────────
  add({ id: "u1.ar.next", skill: "u1.arith", level: L.B, type: "numeric", calc: false,
    make(r) {
      const a = r.int(-10, 25), d = r.intNot(-9, 12, [0]);
      const t = terms((n) => arith(a, d, n), 5);
      return { key: [a, d],
        prompt: `What is the next term of this arithmetic sequence? $${texList(t.slice(0, 4))},\\ \\ldots$`,
        answer: t[4],
        hint: "Subtract any term from the one after it.",
        solution: `Common difference: $${t[1]} - ${t[0] < 0 ? "(" + t[0] + ")" : t[0]} = ${d}$. Next term: $${t[3]} ${signed(d)} = \\mathbf{${t[4]}}$` };
    } });

  add({ id: "u1.ar.diff", skill: "u1.arith", level: L.B, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-5, 30), d = r.intNot(-8, 9, [0, 1, -1]);
      const t = terms((n) => arith(a, d, n), 4);
      const m = mcq(fmt(d), [
        { text: fmt(-d), why: "Subtract an earlier term from a later one, not the other way around." },
        { text: fmt(t[1]), why: "That is the second term, not the change between terms." },
        { text: fmt(t[3] - t[0]), why: "That is the change over 3 steps. Divide by 3." },
      ], r, [{ text: fmt(d + 1), why: "Check the subtraction again." }]);
      return { key: [a, d], ...m,
        prompt: `What is the common difference of the sequence $${texList(t)},\\ \\ldots$?`,
        hint: "Common difference = (a term) − (the term before it).",
        solution: `$${t[1]} - ${paren(t[0])} = \\mathbf{${d}}$` };
    } });

  add({ id: "u1.ar.nth", skill: "u1.arith", level: L.I, type: "numeric", calc: false,
    make(r) {
      const a = r.int(-12, 20), d = r.intNot(-7, 9, [0]), n = r.pick([15, 20, 25, 30, 40, 50]);
      const t = terms((k) => arith(a, d, k), 4);
      return { key: [a, d, n],
        prompt: `Find the ${ordinal(n)} term of the arithmetic sequence $${texList(t)},\\ \\ldots$`,
        answer: arith(a, d, n),
        hint: `Use $f(n) = f(1) + d(n - 1)$.`,
        solution: `$f(1) = ${a}$, $d = ${d}$.<br>$f(${n}) = ${a} ${signed(d)}(${n} - 1) = ${a} ${signed(d * (n - 1))} = \\mathbf{${arith(a, d, n)}}$` };
    } });

  add({ id: "u1.ar.which-term", skill: "u1.arith", level: L.H, type: "numeric", calc: false,
    make(r) {
      const a = r.int(-15, 15), d = r.intNot(-6, 8, [0]), k = r.int(18, 60);
      const v = arith(a, d, k);
      return { key: [a, d, k],
        prompt: `The arithmetic sequence ${list(terms((n) => arith(a, d, n), 4))}, … continues. Which term number is ${fmt(v)}?`,
        answer: k,
        hint: `Set $${a} ${signed(d)}(n - 1)$ equal to ${v} and solve for $n$.`,
        solution: `$${a} ${signed(d)}(n - 1) = ${v}$<br>$${d}(n - 1) = ${v - a}$<br>$n - 1 = ${k - 1}$, so $n = \\mathbf{${k}}$` };
    } });

  add({ id: "u1.ar.meet", skill: "u1.arith", level: L.C, type: "numeric", calc: false,
    make(r) {
      // f(n) = a1 + d1(n-1), g(n) = a2 + d2(n-1), equal at n = k
      const k = r.int(6, 20), d1 = r.int(2, 9), d2 = r.intNot(-4, 1, [0]);
      const v = r.int(20, 120), a1 = v - d1 * (k - 1), a2 = v - d2 * (k - 1);
      return { key: [a1, d1, a2, d2],
        prompt: `Sequence A: $${eqArithExplicit(a1, d1, "f")}$<br>Sequence B: $${eqArithExplicit(a2, d2, "g")}$<br>For which term number $n$ are the two sequences equal?`,
        answer: k,
        hint: "Set $f(n) = g(n)$ and solve.",
        solution: `$${a1} ${signed(d1)}(n-1) = ${a2} ${signed(d2)}(n-1)$<br>$${d1 - d2}(n - 1) = ${a2 - a1}$<br>$n - 1 = ${k - 1}$, so $n = \\mathbf{${k}}$ (both equal ${v}).` };
    } });

  // ───────────────────────── Geometric sequences ─────────────────────────
  add({ id: "u1.ge.next", skill: "u1.geom", level: L.B, type: "numeric", calc: false,
    make(r) {
      const rr = r.pick([2, 3, 4, -2, 5, -3, 10]), a = r.int(1, 9) * r.pick([1, 1, -1]);
      const t = terms((n) => geom(a, rr, n), 5);
      return { key: [a, rr],
        prompt: `What is the next term of this geometric sequence? $${texList(t.slice(0, 4))},\\ \\ldots$`,
        answer: t[4],
        hint: "Divide any term by the one before it to find the ratio.",
        solution: `Ratio: $${t[1]} \\div ${paren(t[0])} = ${rr}$. Next: $${t[3]} \\cdot ${paren(rr)} = \\mathbf{${t[4]}}$` };
    } });

  add({ id: "u1.ge.ratio", skill: "u1.geom", level: L.B, type: "mcq", calc: false,
    make(r) {
      const rr = r.pick([2, 3, 4, 5, 1 / 2, 1 / 3, -2, -3]);
      const a = rr === 1 / 2 ? r.pick([32, 64, 128, 256]) : rr === 1 / 3 ? r.pick([81, 162, 243]) : r.int(1, 5);
      const t = terms((n) => geom(a, rr, n), 4);
      const m = mcq(`$${tex(rr)}$`, [
        { text: `$${tex(t[1] - t[0])}$`, why: "That is a difference. Geometric sequences multiply by the same number." },
        { text: `$${tex(1 / rr)}$`, why: "Divide a term by the one before it, not the other way around." },
        { text: `$${tex(-rr)}$`, why: "Check the sign of the terms." },
      ], r, [{ text: `$${tex(rr * 2)}$`, why: "Check the division again." }]);
      return { key: [a, rr], ...m,
        prompt: `What is the common ratio of the geometric sequence $${texList(t)},\\ \\ldots$?`,
        hint: "Common ratio = (a term) ÷ (the term before it).",
        solution: `$${tex(t[1])} \\div ${paren(t[0])} = \\mathbf{${tex(rr)}}$` };
    } });

  add({ id: "u1.ge.nth", skill: "u1.geom", level: L.I, type: "numeric", calc: true,
    make(r) {
      const rr = r.pick([2, 3, 1.5, -2]), a = rr === 1.5 ? r.pick([16, 32, 64]) : r.int(2, 7), n = rr === 3 ? r.int(6, 8) : r.int(7, 10);
      const t = terms((k) => geom(a, rr, k), 3);
      return { key: [a, rr, n],
        prompt: `Find the ${ordinal(n)} term of the geometric sequence $${texList(t)},\\ \\ldots$`,
        answer: geom(a, rr, n),
        hint: `Use $f(n) = f(1) \\cdot r^{n-1}$.`,
        solution: `$f(1) = ${a}$, $r = ${tex(rr)}$.<br>$f(${n}) = ${a} \\cdot ${paren(rr)}^{${n - 1}} = \\mathbf{${tex(geom(a, rr, n))}}$` };
    } });

  add({ id: "u1.ge.fraction", skill: "u1.geom", level: L.H, type: "numeric", calc: false,
    make(r) {
      const [num, den] = r.pick([[1, 2], [-1, 2], [1, 3], [-1, 3], [2, 3], [-2, 3], [3, 2], [-3, 2]]);
      const rr = num / den, n = r.pick([5, 6]), a = den ** (n - 1) * r.int(1, 3);
      const t = terms((k) => geom(a, rr, k), 3);
      return { key: [a, rr, n],
        prompt: `Find the ${ordinal(n)} term of the geometric sequence $${texList(t)},\\ \\ldots$ (A fraction like 3/4 is fine.)`,
        answer: geom(a, rr, n),
        hint: "Find the ratio first. It may be negative or a fraction.",
        solution: `$r = ${tex(t[1])} \\div ${paren(t[0])} = ${tex(rr)}$.<br>$f(${n}) = ${a} \\cdot ${paren(rr)}^{${n - 1}} = \\mathbf{${tex(geom(a, rr, n))}}$` };
    } });

  add({ id: "u1.ge.exceed", skill: "u1.geom", level: L.C, type: "numeric", calc: true,
    make(r) {
      const rr = r.pick([2, 3, 1.5]), a = r.int(2, 9), X = r.pick([500, 1000, 2000, 5000]);
      let n = 1; while (geom(a, rr, n) <= X) n++;
      return { key: [a, rr, X],
        prompt: `A geometric sequence has $f(1) = ${a}$ and common ratio ${fmt(rr)}. What is the first term number $n$ where $f(n)$ is greater than ${X}?`,
        answer: n,
        hint: "Make a table of terms, or test values of n in $f(n) = f(1) \\cdot r^{n-1}$.",
        solution: `$f(${n - 1}) = ${a} \\cdot ${paren(rr)}^{${n - 2}} = ${fmt(geom(a, rr, n - 1))}$ (not yet over ${X})<br>$f(${n}) = ${a} \\cdot ${paren(rr)}^{${n - 1}} = ${fmt(geom(a, rr, n))}$ > ${X}, so $n = \\mathbf{${n}}$` };
    } });

  // ───────────────────────── Explicit and recursive equations ─────────────────────────
  add({ id: "u1.fo.recursive-eval", skill: "u1.forms", level: L.B, type: "numeric", calc: false,
    make(r) {
      const geo = r.chance(0.4);
      const a = r.int(2, 9), d = geo ? r.pick([2, 3]) : r.intNot(-6, 8, [0]);
      const f = (n) => (geo ? geom(a, d, n) : arith(a, d, n));
      const eq = geo ? eqGeomRecursive(a, d) : eqArithRecursive(a, d);
      return { key: [geo, a, d],
        prompt: `A sequence is defined by $${eq}$. What is $f(4)$?`,
        answer: f(4),
        hint: "Start at $f(1)$ and apply the rule three times.",
        solution: `$f(1) = ${a}$, $f(2) = ${f(2)}$, $f(3) = ${f(3)}$, $f(4) = \\mathbf{${f(4)}}$` };
    } });

  add({ id: "u1.fo.table-explicit", skill: "u1.forms", level: L.I, type: "mcq", calc: false,
    make(r) {
      const d = r.intNot(-7, 8, [0, 1]), a = r.intNot(-6, 15, [d, 0]);
      const t = terms((n) => arith(a, d, n), 4);
      const m = mcq(`$${eqArithExplicit(a, d)}$`, [
        { text: `$f(n) = ${tex(a)} ${signed(d)}n$`, why: `Check n = 1: this gives ${a + d}, not ${a}. Use $(n - 1)$.` },
        { text: `$${eqArithExplicit(d, a)}$`, why: "The first term and the common difference are swapped." },
        { text: `$${eqGeomExplicit(a, d)}$`, why: "This is geometric (multiplies). The table adds the same amount each time." },
      ], r);
      return { key: [a, d], ...m,
        prompt: "Which explicit equation matches the table?",
        table: { headers: ["n", "1", "2", "3", "4"], rows: [["f(n)", ...t.map(fmt)]] },
        hint: "Find the first term and the common difference.",
        solution: `$f(1) = ${a}$ and the terms change by ${d}, so $\\mathbf{${eqArithExplicit(a, d)}}$` };
    } });

  add({ id: "u1.fo.geo-recursive", skill: "u1.forms", level: L.I, type: "mcq", calc: false,
    make(r) {
      const rr = r.pick([2, 3, 4, 5, -2]), a = r.intNot(2, 8, [rr]);
      const t = terms((n) => geom(a, rr, n), 4);
      const m = mcq(`$${eqGeomRecursive(a, rr)}$`, [
        { text: `$f(1) = ${a},\\ f(n) = f(n - 1) ${signed(rr)}$`, why: "This adds the ratio. A geometric sequence multiplies." },
        { text: `$f(1) = ${rr},\\ f(n) = ${paren(a)} \\cdot f(n - 1)$`, why: "The first term and the ratio are swapped." },
        { text: `$f(1) = ${a},\\ f(n) = ${paren(rr)} \\cdot f(n + 1)$`, why: "A recursive rule builds each term from the one *before* it, $f(n - 1)$." },
      ], r);
      return { key: [a, rr], ...m,
        prompt: `Which recursive equation describes the sequence $${texList(t)},\\ \\ldots$?`,
        hint: "Is the sequence adding or multiplying each time?",
        solution: `Each term is ${rr} times the one before, starting at ${a}: $\\mathbf{${eqGeomRecursive(a, rr)}}$` };
    } });

  add({ id: "u1.fo.explicit-to-recursive", skill: "u1.forms", level: L.H, type: "mcq", calc: false,
    make(r) {
      const geo = r.chance(0.5);
      const d = geo ? r.pick([2, 3, 4, 1 / 2]) : r.intNot(-9, 9, [0, 1]), a = r.intNot(2, 12, [d, Math.abs(d)]);
      const given = geo ? eqGeomExplicit(a, d) : eqArithExplicit(a, d);
      const correct = geo ? eqGeomRecursive(a, d) : eqArithRecursive(a, d);
      const dis = geo
        ? [{ text: `$f(1) = ${a},\\ f(n) = f(n - 1) ${signed(d)}$`, why: "The explicit form multiplies by the ratio, so the recursive form must multiply too." },
           { text: `$f(1) = ${tex(a * d)},\\ f(n) = ${paren(d)} \\cdot f(n - 1)$`, why: `$f(1) = ${a} \\cdot ${paren(d)}^0 = ${a}$, not ${tex(a * d)}.` },
           { text: `$f(0) = ${a},\\ f(n) = ${paren(d)} \\cdot f(n - 1)$`, why: "The sequence starts at $n = 1$." }]
        : [{ text: `$f(1) = ${a},\\ f(n) = ${paren(d)} \\cdot f(n - 1)$`, why: "The explicit form adds the difference, so the recursive form must add too." },
           { text: `$f(1) = ${a + d},\\ f(n) = f(n - 1) ${signed(d)}$`, why: `$f(1) = ${a} ${signed(d)}(0) = ${a}$.` },
           { text: `$f(1) = ${d},\\ f(n) = f(n - 1) ${signed(a)}$`, why: "The first term and the difference are swapped." }];
      const m = mcq(`$${correct}$`, dis, r);
      return { key: [geo, a, d], ...m,
        prompt: `Which recursive equation describes the same sequence as $${given}$?`,
        hint: "Find $f(1)$ from the explicit equation, then decide whether you add or multiply each step.",
        solution: `$f(1) = ${a}$, and each term ${geo ? "is multiplied by " + tex(d) : "changes by " + d}. So $\\mathbf{${correct}}$` };
    } });

  add({ id: "u1.fo.two-terms-explicit", skill: "u1.forms", level: L.C, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-10, 20), d = r.intNot(-6, 9, [0, 1]), p = r.int(2, 4), q = p + r.int(3, 6);
      const fp = arith(a, d, p), fq = arith(a, d, q);
      const m = mcq(`$${eqArithExplicit(a, d)}$`, [
        { text: `$${eqArithExplicit(fp, d)}$`, why: `This makes $f(1) = ${fp}$, but ${fp} is the ${ordinal(p)} term.` },
        { text: `$${eqArithExplicit(a, fq - fp)}$`, why: `${fq - fp} is the change over ${q - p} steps, not one step.` },
        { text: `$f(n) = ${tex(a)} ${signed(d)}n$`, why: `Check: this gives $f(${p}) = ${a + d * p}$, not ${fp}.` },
      ], r);
      return { key: [a, d, p, q], ...m,
        prompt: `An arithmetic sequence has $f(${p}) = ${fp}$ and $f(${q}) = ${fq}$. Which explicit equation defines it?`,
        hint: `From term ${p} to term ${q} is ${q - p} steps.`,
        solution: `$d = (${fq} - ${paren(fp)}) \\div ${q - p} = ${d}$. Go back ${p - 1} step${p > 2 ? "s" : ""} from $f(${p})$: $f(1) = ${fp} - ${paren(d)}(${p - 1}) = ${a}$.<br>$\\mathbf{${eqArithExplicit(a, d)}}$` };
    } });

  // ───────────────────────── Arithmetic, geometric or neither ─────────────────────────
  const KINDS = ["Arithmetic", "Geometric", "Neither"];
  function seqOfKind(r, kind) {
    if (kind === 0) { for (;;) { const a = r.int(-10, 20), d = r.intNot(-7, 9, [0]); const t = terms((n) => arith(a, d, n), 5); if (!t.includes(0)) return t; } }
    if (kind === 1) { const a = r.int(1, 6), rr = r.pick([2, 3, -2, -3, 4]); return terms((n) => geom(a, rr, n), 5); }
    const s = r.pick(["sq", "tri", "plus2", "fib"]);
    if (s === "sq") { const k = r.int(0, 3); return terms((n) => (n + k) ** 2, 5); }
    if (s === "tri") return terms((n) => (n * (n + 1)) / 2, 5);
    if (s === "plus2") { const a = r.int(1, 4); const out = [a]; for (let i = 1; i < 5; i++) out.push(2 * out[i - 1] + 1); return out; }
    const a = r.int(1, 3), b = r.int(2, 5); const out = [a, b]; for (let i = 2; i < 5; i++) out.push(out[i - 1] + out[i - 2]); return out;
  }

  add({ id: "u1.cl.basic", skill: "u1.classify", level: L.B, type: "mcq", calc: false,
    make(r) {
      const kind = r.int(0, 2), t = seqOfKind(r, kind);
      const choices = ["Arithmetic", "Geometric", "Neither", "Both arithmetic and geometric"];
      const why = ["Arithmetic sequences add the same amount each time.", "Geometric sequences multiply by the same amount each time.",
        "Check both the differences and the ratios.", "Only a constant sequence (like 5, 5, 5) is both."];
      return { key: [kind, t.join(",")], choices, answer: kind, why: why.map((w, i) => (i === kind ? "Correct." : w)),
        prompt: `Is the sequence $${texList(t)},\\ \\ldots$ arithmetic, geometric, or neither?`,
        hint: "Check the differences between terms, then check the ratios.",
        solution: `Differences: ${list(t.slice(1).map((x, i) => x - t[i]))}. Ratios: ${list(t.slice(1).map((x, i) => x / t[i]))}.<br>**${KINDS[kind]}**${kind === 2 ? ": neither the differences nor the ratios stay the same." : "."}` };
    } });

  add({ id: "u1.cl.select-geometric", skill: "u1.classify", level: L.I, type: "multi", calc: false,
    make(r) {
      const target = r.int(0, 1); // select all arithmetic or all geometric
      const kinds = r.shuffle([target, target, (target + 1) % 2, 2, r.int(0, 2)]);
      const used = new Set();
