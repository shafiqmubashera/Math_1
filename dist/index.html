  add({ id: "u1.cx.plans", skill: "u1.context", level: L.C, type: "numeric", calc: true,
    make(r) {
      const a = r.int(20, 60), d = r.int(10, 30), b = r.pick([1, 2, 3]);
      let n = 1; while (geom(b, 2, n) <= arith(a, d, n)) n++;
      return { key: [a, d, b],
        prompt: `Two allowance plans start in week 1. Plan A pays \\$${a} in week 1 and \\$${d} more each week after. Plan B pays \\$${b} in week 1 and doubles every week. In which week does Plan B first pay more than Plan A?`,
        answer: n,
        hint: "Write both rules and make a table of weeks.",
        solution: `A: $${a} + ${d}(n-1)$. B: $${b}\\cdot 2^{n-1}$.<br>Week ${n - 1}: A = ${arith(a, d, n - 1)}, B = ${geom(b, 2, n - 1)}. Week ${n}: A = ${arith(a, d, n)}, B = ${geom(b, 2, n)}.<br>Week $\\mathbf{${n}}$` };
    } });

  // ───────────────────────── More graph questions (keeps every set visual) ─────────────────────────
  add({ id: "u1.cl.graph", skill: "u1.classify", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const kind = r.int(0, 2);
      let t;
      if (kind === 0) { const a = r.int(1, 8), d = r.int(1, 3); t = terms((n) => arith(a, d, n), 5); }
      else if (kind === 1) { const a = r.pick([1, 2]), rr = r.pick([2, 1 / 2]); t = terms((n) => geom(rr === 2 ? a : 32, rr, n), 5); }
      else { const k = r.int(0, 1); t = terms((n) => n * n + k, 5); }
      const pts = t.map((y, i) => [i + 1, y]);
      const choices = ["Arithmetic", "Geometric", "Neither", "Both arithmetic and geometric"];
      return { key: [kind, t.join(",")], choices, answer: kind,
        why: ["Arithmetic points lie on a straight line (same change each step).", "Geometric points multiply by the same factor each step.", "Check the change and the factor between points.", "Only a constant sequence is both."].map((w, i) => (i === kind ? "Correct." : w)),
        prompt: "The graph shows the first five terms of a sequence. What type of sequence is it?",
        graph: { points: pts, window: windowFor(pts) },
        hint: "Read the y-values. Check the differences, then the ratios.",
        solution: `y-values: ${list(t)}. Differences: ${list(t.slice(1).map((x, i) => x - t[i]))}. Ratios: ${list(t.slice(1).map((x, i) => x / t[i]))}. **${KINDS[kind]}**.` };
    } });

  add({ id: "u1.ge.graph-ratio", skill: "u1.geom", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const [a, rr] = r.pick([[1, 2], [2, 2], [1, 3], [64, 1 / 2], [81, 1 / 3], [48, 1 / 2]]);
      const pts = terms((n) => geom(a, rr, n), 4).map((y, i) => [i + 1, y]);
      const m = mcq(`$${tex(rr)}$`, [
        { text: `$${tex(pts[1][1] - pts[0][1])}$`, why: "That is the difference between the first two points, not the ratio." },
        { text: `$${tex(1 / rr)}$`, why: "Divide a later term by the one before it." },
        { text: `$${tex(a)}$`, why: "That is the first term." },
      ], r, [{ text: `$${tex(rr + 1)}$`, why: "Check the division." }, { text: `$${tex(-rr)}$`, why: "The points go the same direction each time, so the ratio is positive." }, { text: `$${tex(rr * 2)}$`, why: "Check the division." }]);
      return { key: [a, rr], ...m,
        prompt: "The graph shows the first four terms of a geometric sequence. What is the common ratio?",
        graph: { points: pts, window: windowFor(pts) },
        hint: "Divide the second y-value by the first.",
        solution: `$${tex(pts[1][1])} \\div ${tex(pts[0][1])} = \\mathbf{${tex(rr)}}$` };
    } });

  add({ id: "u1.de.plot", skill: "u1.decrease", level: L.I, type: "plot", calc: false,
    make(r) {
      const d = -r.int(1, 3), a = r.int(3 * -d + 2, 12);
      const pts = terms((n) => arith(a, d, n), 4).map((y, i) => [i + 1, y]);
      return { key: [a, d],
        prompt: `A candle is ${a} cm tall at hour 1 and burns down ${-d} cm each hour. Plot its height for hours 1 to 4 as points (hour, height).`,
        plot: { window: { xmin: 0, xmax: 6, ymin: 0, ymax: a + 2, xstep: 1, ystep: 1 } },
        answer: pts,
        hint: `Start at (1, ${a}) and go down ${-d} for each hour.`,
        solution: `Points: ${pts.map((p) => `(${p[0]}, ${p[1]})`).join(", ")}` };
    } });

  add({ id: "u1.cx.plot-savings", skill: "u1.context", level: L.H, type: "plot", calc: false,
    make(r) {
      const a = r.pick([10, 15, 20, 25]), d = r.pick([5, 10, 15]);
      const pts = terms((n) => arith(a, d, n), 4).map((y, i) => [i + 1, y]);
      return { key: [a, d],
        prompt: `Jordan's savings follow $S(n) = ${a} + ${d}(n - 1)$, where $n$ is the week number. Plot weeks 1 to 4 as points $(n, S(n))$.`,
        plot: { window: { xmin: 0, xmax: 6, ymin: 0, ymax: a + 3 * d + 10, xstep: 1, ystep: 5 } },
        answer: pts,
        hint: "Each grid line on the y-axis is 5 dollars.",
        solution: `Points: ${pts.map((p) => `(${p[0]}, ${p[1]})`).join(", ")}` };
    } });

  add({ id: "u1.mi.graph-gap", skill: "u1.missing", level: L.I, type: "numeric", calc: false,
    make(r) {
      const geo = r.chance(0.5);
      const a = geo ? r.pick([1, 2, 3]) : r.int(1, 6), d = geo ? 2 : r.intNot(-2, 4, [0]);
      const all = terms((n) => (geo ? geom(a, d, n) : arith(a, d, n)), 5).map((y, i) => [i + 1, y]);
      const pts = all.filter((p) => p[0] !== 4);
      return { key: [geo, a, d],
        prompt: `The graph shows terms 1, 2, 3 and 5 of ${geo ? "a geometric" : "an arithmetic"} sequence. Term 4 is missing. What is $f(4)$?`,
        graph: { points: pts, window: windowFor(all) },
        answer: all[3][1],
        hint: geo ? "Find the ratio from the first two points." : "Find the change from one point to the next.",
        solution: geo ? `Ratio $= ${all[1][1]} \\div ${all[0][1]} = 2$. $f(4) = ${all[2][1]} \\cdot 2 = \\mathbf{${all[3][1]}}$` : `Change per step $= ${d}$. $f(4) = ${all[2][1]} ${signed(d)} = \\mathbf{${all[3][1]}}$` };
    } });

  // ───────────────────────── Extra pools so a weak skill never runs out ─────────────────────────
  add({ id: "u1.ge.which-term", skill: "u1.geom", level: L.H, type: "numeric", calc: false,
    make(r) {
      const a = r.int(1, 9), rr = r.pick([2, 3, 4]), n = rr === 2 ? r.int(5, 10) : rr === 3 ? r.int(4, 7) : r.int(4, 6);
      const v = geom(a, rr, n);
      return { key: [a, rr, n],
        prompt: `The geometric sequence ${list(terms((k) => geom(a, rr, k), 3))}, … continues. Which term number is ${v}?`,
        answer: n,
        hint: `Keep multiplying by ${rr} and count the terms, or solve $${a} \\cdot ${rr}^{n-1} = ${v}$.`,
        solution: `$${v} \\div ${a} = ${v / a} = ${rr}^{${n - 1}}$, so $n - 1 = ${n - 1}$ and $n = \\mathbf{${n}}$` };
    } });

  add({ id: "u1.gr.read", skill: "u1.graphs", level: L.B, type: "numeric", calc: false,
    make(r) {
      const geo = r.chance(0.35);
      const a = geo ? r.int(1, 3) : r.int(-3, 9), d = geo ? 2 : r.intNot(-3, 4, [0]), k = r.int(2, 5);
      const pts = terms((n) => (geo ? geom(a, d, n) : arith(a, d, n)), 5).map((y, i) => [i + 1, y]);
      return { key: [geo, a, d, k],
        prompt: `The graph shows the first five terms of a sequence as points $(n, f(n))$. What is $f(${k})$?`,
        graph: { points: pts, window: windowFor(pts) },
        answer: pts[k - 1][1],
        hint: `Find the point with $n = ${k}$ and read its height.`,
        solution: `The point above $n = ${k}$ is $(${k}, ${pts[k - 1][1]})$, so $f(${k}) = \\mathbf{${pts[k - 1][1]}}$` };
    } });

  add({ id: "u1.gr.next-points", skill: "u1.graphs", level: L.I, type: "plot", calc: false,
    make(r) {
      const a = r.int(0, 6), d = r.int(1, 3);
      const all = terms((n) => arith(a, d, n), 6).map((y, i) => [i + 1, y]);
      return { key: [a, d],
        prompt: `The first four terms of an arithmetic sequence are $${list(all.slice(0, 4).map((p) => p[1]))}$. Plot terms 5 and 6 as points $(n, f(n))$.`,
        plot: { window: { xmin: 0, xmax: 7, ymin: 0, ymax: all[5][1] + 2, xstep: 1, ystep: 1 } },
        answer: all.slice(4),
        hint: `The terms go up by ${d} each time.`,
        solution: `$f(5) = ${all[4][1]}$ and $f(6) = ${all[5][1]}$, so plot $(5, ${all[4][1]})$ and $(6, ${all[5][1]})$.` };
    } });

  add({ id: "u1.de.recursive", skill: "u1.decrease", level: L.I, type: "numeric", calc: false,
    make(r) {
      const a = r.int(60, 200), d = r.int(3, 9), n = r.int(8, 15);
      return { key: [a, d, n],
        prompt: `A sequence is defined by $f(1) = ${a},\\ f(n) = f(n - 1) - ${d}$. What is $f(${n})$?`,
        answer: arith(a, -d, n),
        hint: `Each step subtracts ${d}. How many steps from term 1 to term ${n}?`,
        solution: `$f(${n}) = ${a} - ${d}(${n} - 1) = ${a} - ${d * (n - 1)} = \\mathbf{${arith(a, -d, n)}}$` };
    } });

  add({ id: "u1.de.halving", skill: "u1.decrease", level: L.C, type: "numeric", calc: true,
    make(r) {
      const start = r.pick([400, 800, 1600, 3200, 640, 960]), period = r.pick([2, 3, 4, 6, 8]), limit = r.pick([10, 25, 50, 100]);
      let k = 0, amt = start; while (amt >= limit) { amt /= 2; k++; }
      return { key: [start, period, limit],
        prompt: `A patient has ${start} mg of a medicine in their body. The amount is cut in half every ${period} hours. After how many hours is the amount first below ${limit} mg?`,
        answer: k * period,
        hint: "Halve the amount again and again, counting the halvings. Then multiply by the hours per halving.",
        solution: `Halvings: ${Array.from({ length: k + 1 }, (_, i) => String(+(start / 2 ** i).toFixed(3))).join(" → ")} mg. That's ${k} halvings, so $${k} \\times ${period} = \\mathbf{${k * period}}$ hours.` };
    } });

  add({ id: "u1.mi.insert-means", skill: "u1.missing", level: L.C, type: "numeric", calc: false,
    make(r) {
      const a = r.int(-20, 30), d = r.intNot(-9, 12, [0]), gaps = r.int(3, 5), ask = r.int(2, gaps);
      const last = arith(a, d, gaps + 1);
      return { key: [a, d, gaps, ask],
        prompt: `Write ${gaps - 1} numbers between ${a} and ${last} so that all ${gaps + 1} numbers form an arithmetic sequence. What is the ${ordinal(ask)} number of the sequence?`,
        answer: arith(a, d, ask),
        hint: `There are ${gaps} equal steps from ${a} to ${last}.`,
        solution: `$d = (${last} - ${paren(a)}) \\div ${gaps} = ${d}$. Term ${ask}: $${a} ${signed(d)}(${ask - 1}) = \\mathbf{${arith(a, d, ask)}}$` };
    } });

  // ───────────────────────── Thinking questions ─────────────────────────
  // Find the mistake: a worked solution for a term of an arithmetic sequence.
  add({ id: "u1.th.find-error", skill: "u1.arith", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-9, 15), d = r.intNot(-6, 9, [0, 1, -1]), N = r.int(12, 40), kind = r.int(0, 3);
      const t2 = a + d, t3 = a + 2 * d, right = arith(a, d, N);
      const dd = kind === 0 ? -d : d;
      const s1 = `$d = ${paren(kind === 0 ? a : t2)} - ${paren(kind === 0 ? t2 : a)} = ${dd}$`;
      const s2 = kind === 1 ? `$f(n) = ${a} ${signed(d)}n$` : `$f(n) = ${a} ${signed(dd)}(n - 1)$`;
      const val = kind === 0 ? arith(a, -d, N) : kind === 1 ? a + d * N : kind === 2 ? right + r.pick([-10, 10, d * 2]) : right;
      const s3 = kind === 1 ? `$f(${N}) = ${a} ${signed(d)}(${N}) = ${val}$` : `$f(${N}) = ${a} ${signed(dd)}(${N - 1}) = ${val}$`;
      const bad = kind === 3 ? -1 : kind;
      const whyWrong = ["The difference is the later term minus the earlier term.", "The explicit form uses $(n - 1)$, because term 1 adds no differences.", "The arithmetic in the last step is off."][Math.max(0, bad)];
      const f = M1.qlib.findStep([s1, s2, s3], bad, whyWrong);
      return { key: [a, d, N, kind, val], choices: f.choices, answer: f.answer, why: f.why, think: true,
        prompt: `Jordan found the ${ordinal(N)} term of $${a}, ${t2}, ${t3}, \\ldots$ like this:<br>${f.stepsText}<br>Where is Jordan's first mistake?`,
        hint: "Check each step on its own.",
        solution: `$d = ${t2} - ${paren(a)} = ${d}$, $f(n) = ${a} ${signed(d)}(n - 1)$, so $f(${N}) = ${a} ${signed(d)}(${N - 1}) = ${right}$.<br>` +
          (bad < 0 ? "**There is no mistake.**" : `The first mistake is in **Step ${bad + 1}**. ${whyWrong}`) };
    } });

  // Is a number a term? Pick the answer with the right reason.
  add({ id: "u1.th.is-term", skill: "u1.missing", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(2, 12), d = r.int(3, 9), T = r.int(80, 400);
      if (T <= a) throw new Error("retry");
      const yes = (T - a) % d === 0, gap = T - a;
      const Y = `Yes, because $${T} - ${a} = ${gap}$ is a multiple of ${d}.`;
      const N = `No, because $${T} - ${a} = ${gap}$ is not a multiple of ${d}.`;
      const m = mcq(yes ? Y : N, [
        { text: yes ? N : Y, why: `$${gap} \\div ${d} = ${fmt(gap / d)}$, ${yes ? "a whole number" : "not a whole number"}.` },
        { text: `Yes, because ${T} is greater than ${a}.`, why: "Being bigger than the first term is not enough. The sequence skips numbers." },
        { text: `No, because ${T} is not one of the first ten terms.`, why: "A term can come much later. Check the gap from the first term." },
        { text: T % d ? `Yes, because ${T} is a multiple of ${d}.`.replace("is a", "is close to a") : `No, because the sequence starts at ${a}, not 0.`, why: `The test is whether $${T} - ${a}$ is a multiple of ${d}.` },
      ], r);
      return { key: [a, d, T], ...m, think: true,
        prompt: `Is ${T} a term of the sequence $${a}, ${a + d}, ${a + 2 * d}, \\ldots$? Pick the answer with the correct reason.`,
        hint: "Every term is the first term plus some number of steps.",
        solution: `Each term is ${a} plus a whole number of ${d}s. $${T} - ${a} = ${gap}$, and $${gap} \\div ${d} = ${fmt(gap / d)}$. ${yes ? `That is a whole number, so ${T} **is** a term (term ${gap / d + 1}).` : `That is not a whole number, so ${T} is **not** a term.`}` };
    } });

  // What changes if the first term is scaled?
  add({ id: "u1.th.what-if", skill: "u1.geom", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(2, 9), g = r.pick([2, 3, -2]), k = r.pick([2, 3, 4, 5, 10]), N = r.int(5, 9);
      const m = mcq(`It is multiplied by ${k}.`, [
        { text: `It increases by ${k}.`, why: `Every term is multiplied by ${k}, so the change is not a fixed amount.` },
        { text: `It is multiplied by $${k}^{${N - 1}}$.`, why: `The ratio stays ${g}. Only the starting value is ${k} times as big.` },
        { text: `It is multiplied by ${k * N}.`, why: "Each term is the first term times the same power of the ratio as before." },
      ], r, [{ text: "It stays the same.", why: "The first term is a factor of every term." }]);
      return { key: [a, g, k, N], ...m, think: true,
        prompt: `A geometric sequence has $f(n) = ${a} \\cdot ${paren(g)}^{n - 1}$. The first term is changed from ${a} to ${a * k}, and the ratio stays the same. What happens to the ${ordinal(N)} term?`,
        hint: "Write the term before and after the change.",
        solution: `Before: $${a} \\cdot ${paren(g)}^{${N - 1}}$. After: $${a * k} \\cdot ${paren(g)}^{${N - 1}} = ${k} \\cdot \\left(${a} \\cdot ${paren(g)}^{${N - 1}}\\right)$. The term is **multiplied by ${k}**.` };
    } });

  // Make it true: choose a common difference that lands on a target.
  add({ id: "u1.th.make-true", skill: "u1.arith", level: L.C, type: "numeric", calc: false,
    make(r) {
      const a = r.int(1, 15), gap = r.pick([24, 30, 36, 40, 42, 48, 60, 72, 84, 90]), T = a + gap;
      const ds = []; for (let d = 2; d <= gap; d++) if (gap % d === 0) ds.push(d);
      return { key: [a, gap], answer: ds[0], accept: { in: ds }, think: true,
        prompt: `An arithmetic sequence starts at ${a} and has a common difference $d$ that is a whole number greater than 1. Give **one** value of $d$ that makes ${T} a term of the sequence.`,
        hint: `How far is ${T} from ${a}?`,
        solution: `${T} must be ${a} plus a whole number of steps: $${T} - ${a} = ${gap}$ must be a multiple of $d$. Any factor of ${gap} greater than 1 works: **${ds.join(", ")}**.` };
    } });

  // Always, sometimes or never: answer with a reason.
  const U1_ASN = [
    { s: "An arithmetic sequence with a positive common difference eventually has a term greater than 1,000.",
      right: "Always true: adding the same positive amount again and again passes any number.",
      wrong: ["Sometimes true: only if the first term is positive.", "Never true: the terms grow by the same amount, so they stay small.", "Sometimes true: only if the difference is at least 10."] },
    { s: "A geometric sequence with a negative common ratio has only negative terms.",
      right: "Never true: the signs switch back and forth, as in $1, -2, 4, -8$.",
      wrong: ["Always true: multiplying by a negative makes the terms negative.", "Sometimes true: only when the first term is negative.", "Always true: the ratio is negative, so every term is too."] },
    { s: "A sequence can be both arithmetic and geometric.",
      right: "Sometimes true: $5, 5, 5, \\ldots$ has difference 0 and ratio 1.",
      wrong: ["Never true: one adds and the other multiplies.", "Always true: every sequence has a difference and a ratio.", "Never true: a ratio of 1 is not allowed."] },
    { s: "If the first term and the common difference of an arithmetic sequence are both odd, every term is odd.",
      right: "Never true: the second term is odd + odd, which is even.",
      wrong: ["Always true: odd numbers stay odd.", "Sometimes true: only when the difference is 1.", "Sometimes true: only for the first few terms."] },
    { s: "A geometric sequence with a positive first term and a ratio between 0 and 1 eventually has a negative term.",
      right: "Never true: multiplying a positive number by a positive ratio stays positive. The terms get closer to 0.",
      wrong: ["Always true: the terms keep shrinking, so they pass 0.", "Sometimes true: only if the ratio is less than $\\frac{1}{2}$.", "Sometimes true: only after many terms."] },
    { s: "The terms of an arithmetic sequence with common difference 3 are all multiples of 3.",
      right: "Sometimes true: $3, 6, 9, \\ldots$ works, but $1, 4, 7, \\ldots$ does not.",
      wrong: ["Always true: you keep adding 3.", "Never true: adding 3 changes the remainder.", "Always true: the difference is a multiple of 3."] },
    { s: "If the first two terms of a geometric sequence are whole numbers, the common ratio is a whole number.",
      right: "Sometimes true: $2, 6, \\ldots$ has ratio 3, but $4, 6, \\ldots$ has ratio $\\frac{3}{2}$.",
      wrong: ["Always true: whole numbers divide to whole numbers.", "Never true: a ratio is always a fraction.", "Always true: the second term is the first term times the ratio."] },
  ];
  add({ id: "u1.th.always", skill: "u1.classify", level: L.C, type: "mcq", calc: false,
    make(r) {
      const i = r.int(0, U1_ASN.length - 1), it = U1_ASN[i];
      const m = mcq(it.right, it.wrong.map((t) => ({ text: t, why: "Test it with a few examples. " + it.right })), r);
      return { key: [i], ...m, think: true,
        prompt: `Is this statement always true, sometimes true, or never true?<br>"${it.s}"`,
        hint: "Try a few examples, including unusual ones.",
        solution: `**${it.right}**` };
    } });

  M1.units.u1 = Object.assign(M1.units.u1 || {}, { generators: gens });
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>/* content/unit-1-sequences/bank.js */
/* Unit 1 Sequences: written question bank (context and SAT-style items that don't fit a template).
   Every item is re-solved in tests/run-tests.mjs (see BANK_CHECKS) before it ships. */
(function (G) {
  const M1 = G.M1;
  const bank = [
    { id: "u1b01", skill: "u1.context", level: "challenge", type: "mcq", calc: false, lesson: 5, standard: "NC.M1.F-LE.5",
      prompt: "A gym's total cost after $n$ months is $f(n) = 45 + 30(n - 1)$, where $f(1)$ covers the sign-up fee and the first month. What does 30 represent?",
      choices: ["The cost of each additional month", "The sign-up fee", "The total cost after 1 month", "The number of months"],
      answer: 0, why: ["Correct.", "45 covers the sign-up fee plus month 1; 30 is added for each month after.", "That is $f(1) = 45$.", "The number of months is $n$."],
      hint: "What is added each time $n$ goes up by 1?", solution: "Each extra month adds 30 to the total, so 30 is the **cost of each additional month**." },
    { id: "u1b02", skill: "u1.arith", level: "challenge", type: "numeric", calc: false, lesson: 8, standard: "NC.M1.F-BF.1a", answer: 11,
      prompt: "The 4th term of an arithmetic sequence is 23 and the 9th term is 58. What is the sum of the 1st and 2nd terms?",
      hint: "Find the common difference first.", solution: "$d = (58 - 23) \\div 5 = 7$. $f(1) = 23 - 3(7) = 2$, $f(2) = 9$. Sum: $2 + 9 = \\mathbf{11}$" },
    { id: "u1b03", skill: "u1.geom", level: "challenge", type: "mcq", calc: false, lesson: 9, standard: "NC.M1.F-BF.1a",
      prompt: "A geometric sequence has first term 3 and fourth term 81. What is the sixth term?",
      choices: ["$729$", "$243$", "$2187$", "$486$"], answer: 0,
      why: ["Correct.", "That is the 5th term.", "That is the 7th term.", "This doubles 243 instead of multiplying by the ratio."],
      hint: "From term 1 to term 4 you multiply by $r$ three times.", solution: "$r^3 = 81 \\div 3 = 27$, so $r = 3$. $f(6) = 3 \\cdot 3^5 = \\mathbf{729}$" },
    { id: "u1b04", skill: "u1.forms", level: "challenge", type: "mcq", calc: false, lesson: 7, standard: "NC.M1.F-BF.2",
      prompt: "A sequence is defined by $f(1) = 5$ and $f(n) = f(n - 1) + 3$. Which expression is equal to $f(n)$ for every $n \\ge 1$?",
      choices: ["$3n + 2$", "$3n + 5$", "$5n + 3$", "$5 \\cdot 3^{n-1}$"], answer: 0,
      why: ["Correct.", "Check $n = 1$: this gives 8, not 5.", "The first term and the difference are swapped.", "The rule adds 3; it does not multiply."],
      hint: "Write $5 + 3(n - 1)$ and simplify.", solution: "$f(n) = 5 + 3(n - 1) = 5 + 3n - 3 = \\mathbf{3n + 2}$" },
    { id: "u1b05", skill: "u1.classify", level: "hard", type: "multi", calc: false, lesson: 10, standard: "NC.M1.F-LE.1",
      prompt: "Select **all** situations that a geometric sequence models.",
      choices: ["A town's population grows by 4% each year.", "A savings account gets \\$20 added each week.", "The number of layers when a paper is folded in half again and again.", "Each row of a theater has 2 more seats than the row before.", "A ball bounces back to 60% of its previous height."],
      answer: [0, 2, 4], why: ["", "Adding the same amount is arithmetic.", "", "Adding the same amount is arithmetic.", ""],
      hint: "Geometric means multiplying by the same factor each step.", solution: "Growing 4% (×1.04), folding (×2) and bouncing to 60% (×0.6) multiply each step: **geometric**. Adding \\$20 or 2 seats is arithmetic." },
    { id: "u1b06", skill: "u1.context", level: "challenge", type: "numeric", calc: true, lesson: 5, standard: "NC.M1.F-BF.2", answer: 6,
      prompt: "A post gets 3 new shares in hour 1. Each hour, the number of new shares is 3 times the number from the hour before. In which hour are there 729 new shares?",
      hint: "Write $f(n) = 3 \\cdot 3^{n-1} = 3^n$.", solution: "$3^n = 729 = 3^6$, so hour $\\mathbf{6}$." },
    { id: "u1b07", skill: "u1.missing", level: "challenge", type: "numeric", calc: false, lesson: 8, standard: "NC.M1.F-BF.1a", answer: 20,
      prompt: "In an arithmetic sequence, $f(2) + f(6) = 40$. What is $f(4)$?",
      hint: "Term 4 is exactly halfway between term 2 and term 6.", solution: "In an arithmetic sequence the middle term is the average: $f(4) = \\dfrac{f(2) + f(6)}{2} = \\dfrac{40}{2} = \\mathbf{20}$" },
    { id: "u1b08", skill: "u1.geom", level: "hard", type: "mcq", calc: false, lesson: 9, standard: "NC.M1.F-BF.1a",
      prompt: "A geometric sequence has $f(1) = 3$, $f(3) = 12$, and a negative common ratio. What is $f(4)$?",
      choices: ["$-24$", "$24$", "$-48$", "$48$"], answer: 0,
      why: ["Correct.", "The ratio is negative, so the sign switches each term.", "That multiplies 12 by $-4$, which is $r^2$ with the wrong sign.", "That is $f(5)$."],
      hint: "$r^2 = 12 \\div 3$.", solution: "$r^2 = 4$ and $r < 0$, so $r = -2$. $f(4) = 12 \\cdot (-2) = \\mathbf{-24}$" },
    { id: "u1b09", skill: "u1.decrease", level: "challenge", type: "mcq", calc: true, lesson: 6, standard: "NC.M1.F-LE.1",
      prompt: "A tank holds 1,200 liters. Every hour it loses 20% of the water it had at the start of that hour. How much water is left after 4 hours?",
      choices: ["491.52 liters", "614.4 liters", "240 liters", "708.48 liters"], answer: 0,
      why: ["Correct.", "That is after 3 hours.", "This subtracts 20% of the original 1,200 every hour.", "That is how much water was lost."],
      hint: "Losing 20% means keeping 80%. Multiply by 0.8 four times.", solution: "$1200 \\cdot 0.8^4 = 1200 \\cdot 0.4096 = \\mathbf{491.52}$ liters" },
    { id: "u1b10", skill: "u1.patterns", level: "challenge", type: "numeric", calc: false, lesson: 1, standard: "NC.M1.A-SSE.1a", answer: 20,
      prompt: "One hexagon takes 6 toothpicks. Hexagons are added in a row, each sharing one side with the one before, so each new hexagon adds 5 toothpicks. How many hexagons are in a row made with 101 toothpicks?",
      hint: "Write an expression for the toothpicks in a row of $n$ hexagons.", solution: "$6 + 5(n - 1) = 101$ → $5(n - 1) = 95$ → $n - 1 = 19$ → $n = \\mathbf{20}$" },
    { id: "u1b11", skill: "u1.graphs", level: "challenge", type: "mcq", calc: false, lesson: 10, standard: "NC.M1.F-IF.3",

      why: ["Correct.", "Check $n = 1$: this gives 9, not 5.", "The y-values go up by 4 (adding), so it is arithmetic.", "$f(1) = 5$; $n = 0$ is not a term of the sequence."],

    { id: "u1b12", skill: "u1.forms", level: "hard", type: "numeric", calc: false, lesson: 7, standard: "NC.M1.F-IF.3", answer: 41,

    { id: "u1b13", skill: "u1.arith", level: "hard", type: "mcq", calc: false, lesson: 8, standard: "NC.M1.F-BF.1a",
      prompt: "Kai says 100 is a term of the arithmetic sequence $7, 11, 15, \\ldots$ Is he right?",

      why: ["Correct.", "$f(24) = 7 + 4(23) = 99$.", "$f(25) = 103$.", "Growing terms can jump right past 100: 99 is followed by 103."],
      hint: "Solve $7 + 4(n - 1) = 100$. Is $n$ a whole number?", solution: "$4(n - 1) = 93$ gives $n - 1 = 23.25$, not a whole number. **No**: $100 - 7 = 93$ is not a multiple of 4." },
    { id: "u1b14", skill: "u1.context", level: "hard", type: "numeric", calc: true, lesson: 4, standard: "NC.M1.F-BF.2", answer: 40.5,

    { id: "u1b15", skill: "u1.decrease", level: "hard", type: "numeric", calc: false, lesson: 6, standard: "NC.M1.F-BF.1a", answer: 8,
      prompt: "A ball is dropped from 256 cm. Each bounce reaches half the height of the bounce before (the first bounce reaches 128 cm). How high, in cm, does the 5th bounce reach?",

<script>/* content/unit-2-linear-exponential/generators.js */
/* Unit 2 Linear & Exponential Functions: question generators.
   Each generator: { id, skill, level, type, calc, make(r) } where make returns
   { key, prompt, ... } and every answer is computed here, never typed by hand. */
(function (G) {
  const M1 = G.M1;
  const { fmt, tex, signed, mcq, multi, gcd, windowFor } = M1.qlib;

  const L = { B: "basic", I: "intermediate", H: "hard", C: "challenge" };
  const gens = [];
  const add = (g) => gens.push(g);

  // Decimals as typed (1.05 stays 1.05, not 21/20).
  const dec = (x) => String(+(+x).toFixed(6));
  const commas = (s) => s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const money = (x) => "\\$" + (Number.isInteger(x) ? commas(String(x)) : x.toFixed(2));
  // Linear expression mx + b in KaTeX: handles m = ±1, b = 0 and fractions.
  function lin(m, b, v = "x") {
    if (m === 0) return tex(b);
    const mt = m === 1 ? "" : m === -1 ? "-" : tex(m);
    return `${mt}${v}${b === 0 ? "" : " " + signed(b)}`;
  }
  // a·b^x with the base always in parentheses.
  // Unit fractions (1/2, 1/3, 1/4) show as fractions; other bases as decimals.
  const base = (b) => ([1 / 2, 1 / 3, 1 / 4].some((f) => Math.abs(f - b) < 1e-12) ? tex(b) : dec(b));
  const expo = (a, b, v = "x") => (a === 1 && Number.isInteger(b) ? `${b}^{${v}}` : `${a === 1 ? "" : tex(a)}\\left(${base(b)}\\right)^{${v}}`);
  const frac = (n, d) => { // n/d reduced, as KaTeX
    const g = gcd(n, d), s = (n < 0) !== (d < 0) ? "-" : "";
    const N = Math.abs(n) / g, D = Math.abs(d) / g;
    return D === 1 ? `${s}${N}` : `${s}\\frac{${N}}{${D}}`;
  };
  const pt = (p) => `(${fmt(p[0])}, ${fmt(p[1])})`;
  const setTex = (lo, hi) => (hi - lo <= 5 ? `\\{${Array.from({ length: hi - lo + 1 }, (_, i) => lo + i).join(", ")}\\}` : `\\{${lo}, ${lo + 1}, ${lo + 2}, \\ldots, ${hi}\\}`);

  // ───────────────────────── Discrete vs continuous, domain ─────────────────────────
  const DISCRETE = [
    (r) => { const p = r.int(6, 15); return [`$C(n)$ is the cost of buying $n$ movie tickets at ${money(p)} each.`, p]; },
    (r) => { const k = r.int(8, 30); return [`$S(n)$ is the number of chairs in $n$ rows when each row has ${k} chairs.`, k]; },
    (r) => { const k = r.int(2, 9); return [`$P(w)$ is the number of push-ups done after $w$ workouts of ${k * 5} push-ups each.`, k]; },
    (r) => { const k = r.int(3, 12); return [`$T(b)$ is the number of tennis balls in $b$ cans that hold ${k} balls each.`, k]; },
    (r) => { const k = r.int(20, 60); return [`$M(s)$ is the money earned for working $s$ shifts at ${money(k * 2)} per shift.`, k]; },
    (r) => { const k = r.int(2, 6); return [`$B(n)$ is the number of bacteria colonies after $n$ full days when the number of colonies is multiplied by ${k} each day.`, k]; },
  ];
  const CONTINUOUS = [
    (r) => { const k = r.int(2, 8); return [`$h(t)$ is the height of a candle $t$ hours after it is lit, if it burns ${k} cm per hour.`, k]; },
    (r) => { const k = r.int(3, 15); return [`$V(t)$ is the water in a tank $t$ minutes after it starts filling at ${k} gallons per minute.`, k]; },
    (r) => { const k = r.int(35, 70); return [`$d(t)$ is the distance a car has traveled $t$ hours after leaving, at ${k} miles per hour.`, k]; },
    (r) => { const k = r.int(10, 40); return [`$A(t)$ is the altitude of a plane $t$ seconds after takeoff, climbing ${k} feet per second.`, k]; },
    (r) => { const k = r.int(2, 9); return [`$R(x)$ is the cost of $x$ pounds of rice scooped from a bulk bin at ${money(k)} per pound.`, k]; },
    (r) => { const k = r.int(5, 20); return [`$G(m)$ is the gas left in a tank after a car drives $m$ miles, using 1 gallon every ${k} miles.`, k]; },
  ];
  const situ = (r, discrete) => { const pool = discrete ? DISCRETE : CONTINUOUS, i = r.int(0, pool.length - 1); const [text, k] = pool[i](r); return { text, key: [discrete, i, k] }; };

  add({ id: "u2.di.classify", skill: "u2.discrete", level: L.B, type: "mcq", calc: false,
    make(r) {
      const disc = r.chance(0.5), s = situ(r, disc);
      const D = "Discrete: only whole-number inputs make sense.", C = "Continuous: every input in an interval makes sense.";
      const m = mcq(disc ? D : C, [
        { text: disc ? C : D, why: disc ? "You cannot have part of one of these inputs, so the inputs are whole numbers." : "The input is time or an amount that can be any value, not just whole numbers." },
        { text: "Discrete, because the outputs keep going up.", why: "Going up or down does not decide it. Ask which inputs make sense." },
        { text: "Continuous, because the outputs can be large numbers.", why: "The size of the outputs does not decide it. Ask which inputs make sense." },
      ], r);
      return { key: s.key, ...m,
        prompt: `${s.text} Is this function discrete or continuous?`,
        hint: "Look at the input. Does a value like 2.5 make sense for it?",
        solution: disc ? `The input counts whole things, so 2.5 of them makes no sense. The function is **discrete**.` : `The input can be any value in an interval, like 2.5. The function is **continuous**.` };
    } });

  add({ id: "u2.di.in-domain", skill: "u2.discrete", level: L.B, type: "mcq", calc: false,
    make(r) {
      const p = r.int(4, 15), n = r.int(2, 12), half = r.int(1, 9) + 0.5;
      const item = r.pick(["concert tickets", "pizzas", "notebooks", "bus passes"]);
      const m = mcq(String(n), [
        { text: dec(half), why: `You cannot buy ${dec(half)} ${item}.` },
        { text: String(-r.int(1, 5)), why: "You cannot buy a negative number of items." },
        { text: `\\$${p * n + p}`, why: "That is a cost, an output. The domain is the inputs: numbers of items." },
      ], r);
      return { key: [p, n, half, item], ...m,
        prompt: `$C(n) = ${p}n$ gives the cost, in dollars, of buying $n$ ${item}. Which value is in the domain of $C$?`,
        hint: "The domain is the set of inputs that make sense. Here the input is the number of items bought.",
        solution: `The input $n$ must be a whole number of ${item}, 0 or more. Only **${n}** works.` };
    } });

  add({ id: "u2.di.domain-cont", skill: "u2.discrete", level: L.I, type: "mcq", calc: false,
    make(r) {
      const rate = r.pick([5, 10, 15, 20, 25, 40]), T = r.int(6, 30), V0 = rate * T;
      const m = mcq(`$0 \\le t \\le ${T}$`, [
        { text: `$${setTex(0, T)}$`, why: "Time can be any value, like 2.5 minutes, so the domain is not just whole numbers." },
        { text: `$0 \\le t \\le ${V0}$`, why: `${V0} is the starting amount of water, an output, not a time.` },
        { text: "$t \\ge 0$", why: `The tank is empty after ${T} minutes, so the model stops there.` },
      ], r);
      return { key: [rate, T], ...m,
        prompt: `A tank holds ${V0} gallons of water. It drains at ${rate} gallons per minute until it is empty. $V(t) = ${V0} - ${rate}t$ is the water left after $t$ minutes. What is the domain of $V$?`,
        hint: "When does the tank become empty? Can $t$ be a decimal?",
        solution: `The tank is empty when $${V0} - ${rate}t = 0$, so $t = ${T}$. Time can be any value from 0 to ${T}: **$0 \\le t \\le ${T}$**.` };
    } });

  add({ id: "u2.di.select-discrete", skill: "u2.discrete", level: L.I, type: "multi", calc: false,
    make(r) {
      const nD = r.int(2, 3), nC = 5 - nD;
      const di = r.shuffle(DISCRETE.map((_, i) => i)).slice(0, nD), ci = r.shuffle(CONTINUOUS.map((_, i) => i)).slice(0, nC);
      const items = di.map((i) => ({ text: DISCRETE[i](r)[0], ok: true }))
        .concat(ci.map((i) => ({ text: CONTINUOUS[i](r)[0], ok: false, why: "The input can be any value in an interval, so this is continuous." })));
      const m = multi(items, r);
      return { key: m.choices, ...m,
        prompt: "Select **all** functions that are discrete.",
        hint: "For each one, ask: can the input be a value like 2.5?",
        solution: "A function is discrete when only whole-number inputs make sense (tickets, rows, cans, shifts, full days). Time, distance and amounts of liquid can be any value, so those are continuous." };
    } });

  add({ id: "u2.di.count-domain", skill: "u2.discrete", level: L.H, type: "numeric", calc: false,
    make(r) {
      const p = r.int(5, 15), B = r.int(4, 12) * p + r.int(0, p - 1);
      const k = Math.floor(B / p);
      const who = r.pick(["Jada", "Malik", "Priya", "Owen"]);
      return { key: [p, B],
        prompt: `${who} has ${money(B)} to spend on comic books that cost ${money(p)} each. $C(n) = ${p}n$ is the cost of buying $n$ comic books. ${who} could also buy none. How many values are in the domain of $C$?`,
        answer: k + 1,
        hint: `Find the greatest number of books ${who} can afford. Do not forget 0.`,
        solution: `$${B} \\div ${p} ${B % p ? "\\approx" : "="} ${dec(+(B / p).toFixed(2))}$, so the most books is ${k}. The domain is $${setTex(0, k)}$, which has $${k} + 1 = \\mathbf{${k + 1}}$ values.` };
    } });

  add({ id: "u2.di.domain-discrete", skill: "u2.discrete", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(10, 24), d = r.int(1, 4), R = r.int(15, 40);
      const m = mcq(`$${setTex(1, R)}$`, [
        { text: `$1 \\le n \\le ${R}$`, why: "There is no row 2.5. Only whole-number rows make sense." },
        { text: `$${setTex(0, R)}$`, why: "Row numbers start at 1. There is no row 0." },
        { text: `$\\{${a}, ${a + d}, ${a + 2 * d}, \\ldots, ${a + d * (R - 1)}\\}$`, why: "These are the numbers of seats, the outputs. That is the range." },
      ], r);
      return { key: [a, d, R], ...m,
        prompt: `A theater has ${R} rows. Row 1 has ${a} seats and each row has ${d} more seat${d > 1 ? "s" : ""} than the row before. $S(n)$ is the number of seats in row $n$. What is the domain of $S$?`,
        hint: "The input is the row number. Which row numbers exist?",
        solution: `The inputs are row numbers 1 through ${R}, whole numbers only: **$${setTex(1, R)}$**.` };
    } });

  add({ id: "u2.di.graph-domain", skill: "u2.discrete", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const k = r.int(3, 5), a = r.int(1, 6), d = r.int(1, 3);
      const pts = Array.from({ length: k + 1 }, (_, x) => [x, a + d * x]);
      const m = mcq(`$${setTex(0, k)}$`, [
        { text: `$0 \\le x \\le ${k}$`, why: "The graph is separate points, not a solid line, so only those x-values are in the domain." },
        { text: `$\\{${pts.map((p) => p[1]).join(", ")}\\}$`, why: "These are the y-values. That is the range." },
        { text: "All real numbers", why: "Only the x-values of the points shown are inputs." },
      ], r);
      return { key: [k, a, d], ...m,
        prompt: "The graph shows **all** the points of a function $f$. What is the domain of $f$?",
        graph: { points: pts, window: windowFor(pts) },
        hint: "The domain is the list of x-values. Is the graph separate points or a solid line?",
        solution: `The points have x-values ${pts.map((p) => p[0]).join(", ")}. The domain is **$${setTex(0, k)}$**.` };
    } });

  add({ id: "u2.di.range-min", skill: "u2.discrete", level: L.C, type: "numeric", calc: false,
    make(r) {
      const p = r.int(3, 9), B = r.int(5, 15) * p + r.int(1, p - 1);
      const k = Math.floor(B / p);
      return { key: [p, B],
        prompt: `A transit card has ${money(B)} on it. Each ride costs ${money(p)}. $R(n) = ${B} - ${p}n$ is the money left after $n$ rides. A ride is only allowed if the card has enough money for it. What is the **smallest** value in the range of $R$?`,
        answer: B - p * k,
        hint: "Find the greatest number of rides allowed. Then find the money left.",
        solution: `$${B} \\div ${p}$ is ${k} with some left over, so the most rides is ${k}. $R(${k}) = ${B} - ${p}(${k}) = \\mathbf{${B - p * k}}$ dollars.` };
    } });

  add({ id: "u2.di.domain-range", skill: "u2.discrete", level: L.C, type: "mcq", calc: false,
    make(r) {
      const rate = r.int(2, 6), T = r.int(4, 12), H = rate * T;
      const m = mcq(`Domain: $0 \\le t \\le ${T}$; range: $0 \\le h \\le ${H}$`, [
        { text: `Domain: $0 \\le t \\le ${H}$; range: $0 \\le h \\le ${T}$`, why: "This swaps the inputs (hours) and the outputs (height)." },
        { text: `Domain: $${setTex(0, T)}$; range: $\\{0, ${rate}, ${2 * rate}, \\ldots, ${H}\\}$`, why: "Time and height can be decimals. The candle keeps burning between whole hours." },
        { text: `Domain: $t \\ge 0$; range: $h \\le ${H}$`, why: "The candle is gone after the height reaches 0, and the height cannot be negative." },
      ], r);
      return { key: [rate, T], ...m,
        prompt: `A candle is ${H} cm tall. It burns down ${rate} cm each hour until it is gone. $h(t) = ${H} - ${rate}t$. Which gives the domain and range of $h$ for this situation?`,
        hint: "Find when the candle is gone. Then think about which inputs and outputs make sense.",
        solution: `$h(t) = 0$ when $t = ${H} \\div ${rate} = ${T}$. Time runs from 0 to ${T} hours and the height goes from ${H} down to 0, including every value in between: **domain $0 \\le t \\le ${T}$, range $0 \\le h \\le ${H}$**.` };
    } });

  // ───────────────────────── Linear vs exponential ─────────────────────────
  const TYPE3 = ["Linear", "Exponential", "Neither", "Both linear and exponential"];
  function tableOfKind(r, kind) {
    if (kind === 0) { const b = r.int(-5, 20), m = r.intNot(-6, 9, [0]); return { key: [kind, b, m], y: [0, 1, 2, 3].map((x) => b + m * x) }; }
    if (kind === 1) { const a = r.int(1, 8), g = r.pick([2, 3, 4, 1 / 2]); const a2 = g === 1 / 2 ? a * 8 : a; return { key: [kind, a2, g], y: [0, 1, 2, 3].map((x) => a2 * g ** x) }; }
    const a = r.int(0, 5), s = r.int(1, 3); return { key: [kind, a, s], y: [0, 1, 2, 3].map((x) => s * x * x + a) };
  }

  add({ id: "u2.le.table-type", skill: "u2.linexp", level: L.B, type: "mcq", calc: false,
    make(r) {
      const kind = r.int(0, 2), t = tableOfKind(r, kind);
      const why = ["Linear functions add the same amount each time x goes up by 1.", "Exponential functions multiply by the same factor each time x goes up by 1.",
        "Check both the differences and the ratios.", "Only a constant function changes by the same amount and the same factor."];
      const diffs = t.y.slice(1).map((v, i) => v - t.y[i]);
      const ratios = t.y.slice(1).map((v, i) => (t.y[i] === 0 ? "none (cannot divide by 0)" : `$${frac(v, t.y[i])}$`));
      return { key: t.key, choices: TYPE3, answer: kind, why: why.map((w, i) => (i === kind ? "Correct." : w)),
        prompt: "Is the function in the table linear, exponential, or neither?",
        table: { headers: ["$x$", "0", "1", "2", "3"], rows: [["$y$", ...t.y.map(fmt)]] },
        hint: "Find the differences between y-values. Then find the ratios.",
        solution: `Differences: ${diffs.map(fmt).join(", ")}. Ratios: ${ratios.join(", ")}.<br>**${TYPE3[kind]}**${kind === 2 ? ": neither the differences nor the ratios stay the same." : "."}` };
    } });

  const LIN_STORIES = [
    (r) => `A plant grows ${r.int(2, 6)} cm each week.`,
    (r) => `A pool drains ${r.int(2, 9) * 10} gallons each minute.`,
    (r) => `A savings account gets ${money(r.int(2, 9) * 5)} added each month.`,
    (r) => `A taxi charges ${money(r.int(2, 4))} plus ${money(r.int(2, 3))} for each mile.`,
    (r) => `A phone's battery loses ${r.int(2, 9)} percentage points of charge every hour.`,
  ];

        { text: `$y = ${lin(ys[1] - ys[0], a)}$`, why: "This is linear: it adds the same amount each time. The table multiplies by the same factor." },
        { text: `$y = ${expo(a, g, "x - 1")}$`, why: `Check $x = 0$: this gives $${tex(a / g)}$, not ${a}.` },

    } });

  add({ id: "u2.we.percent", skill: "u2.writeexp", level: L.I, type: "mcq", calc: false,
    make(r) {
      const grow = r.chance(0.5), p = grow ? r.pick([2, 3, 4, 5, 6, 8, 10, 12, 15]) : r.pick([5, 8, 10, 12, 15, 20, 25]), A = r.int(5, 60) * 100;

      const v = (b) => `$f(t) = ${A}\\left(${dec(b)}\\right)^{t}$`;

        { text: v(p / 100), why: `Multiplying by ${dec(p / 100)} keeps only ${p}% each year.` },
        { text: v(other), why: grow ? "This shrinks by the percent. The amount grows, so the factor is above 1." : "This grows by the percent. The amount shrinks, so the factor is below 1." },
        { text: `$f(t) = ${A} ${grow ? "+" : "-"} ${dec(p / 100)}t$`, why: "Changing by a percent each year multiplies; it does not add a fixed amount." },
      ], r);
      return { key: [grow, p, A, thing], ...mm,
        prompt: `${thing} ${commas(String(A))} now. It ${grow ? "grows" : "goes down"} by ${p}% each year. Which function gives the amount after $t$ years?`,
        hint: grow ? "Growing by p% means keeping 100% and adding p%." : "Losing p% means keeping (100 − p)%.",
        solution: `The factor is $1 ${grow ? "+" : "-"} ${dec(p / 100)} = ${dec(fac)}$, so **$f(t) = ${A}(${dec(fac)})^t$**.` };
    } });

  add({ id: "u2.we.two-points", skill: "u2.writeexp", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(1, 8), g = r.pick([2, 3]);
      const y1 = a * g, y3 = a * g ** 3;
      const eq = (A, B) => `$f(x) = ${expo(A, B)}$`;
      const mm = mcq(eq(a, g), [
        { text: eq(a, g * g), why: `From $x = 1$ to $x = 3$ is 2 steps, so $${y3} \\div ${y1} = ${g * g}$ is $b^2$. Take the square root.` },
        { text: eq(y1, g), why: `$f(1) = ${y1}$, but the number in front is $f(0)$. Divide by the factor once more.` },
        { text: `$f(x) = ${lin((y3 - y1) / 2, y1 - (y3 - y1) / 2)}$`, why: "This is the line through the two points, not an exponential function." },
      ], r, [{ text: eq(y1, g * g), why: "Check both points in this equation." }]);
      return { key: [a, g], ...mm,
        prompt: `An exponential function $f$ has $f(1) = ${y1}$ and $f(3) = ${y3}$, and its factor is positive. Which equation describes $f$?`,

        solution: `$b^2 = ${y3} \\div ${y1} = ${g * g}$, so $b = ${g}$. $f(0) = ${y1} \\div ${g} = ${a}$.<br>**$f(x) = ${expo(a, g)}$**` };
    } });

  add({ id: "u2.we.decay-value", skill: "u2.writeexp", level: L.H, type: "numeric", calc: true,
    make(r) {
      const V = r.int(12, 40) * 1000, p = r.pick([8, 10, 12, 15, 18, 20]), t = r.int(2, 6);
      const ans = Math.round(V * (1 - p / 100) ** t);

        solution: `$V(t) = ${V}(${dec(1 - p / 100)})^t$.<br>$V(${t}) = ${V}(${dec(1 - p / 100)})^{${t}} \\approx \\mathbf{${ans}}$ dollars` };
    } });

  add({ id: "u2.we.plot", skill: "u2.writeexp", level: L.I, type: "plot", calc: false,
    make(r) {
      const [a, g, n] = r.pick([[1, 2, 4], [2, 2, 4], [16, 1 / 2, 4], [8, 1 / 2, 4], [1, 3, 3], [2, 3, 3], [9, 1 / 3, 3], [12, 1 / 2, 3]]);
      const story = r.chance(0.5);
      const pts = Array.from({ length: n }, (_, x) => [x, a * g ** x]);

        plot: { window: { xmin: 0, xmax: 6, ymin: 0, ymax: ymax + 2, xstep: 1, ystep: 1 } },

        hint: "Start at the value for $x = 0$, then multiply by the factor for each next point.",

  add({ id: "u2.we.find-initial", skill: "u2.writeexp", level: L.C, type: "numeric", calc: false,

        solution: `$b^{${q - p}} = ${fmt(yq)} \\div ${fmt(yp)} = ${tex(g ** (q - p))}$, so $b = ${tex(g)}$.<br>$f(0) = ${fmt(yp)} \\div ${Number.isInteger(g) ? g : `\\left(${tex(g)}\\right)`}^{${p}} = \\mathbf{${a}}$` };
    } });

  add({ id: "u2.we.interpret", skill: "u2.writeexp", level: L.C, type: "mcq", calc: false,

        { text: `It ${grow ? "decreases" : "increases"} by ${p}% each year.`, why: grow ? "A factor above 1 means growth." : "A factor below 1 means decay." },
        { text: `It ${grow ? "increases" : "decreases"} by ${dec(g)} each year.`, why: "Exponential change multiplies; it does not add or subtract a fixed amount." },
      ], r);
      return { key: [grow, p, A], ...mm,

  // ───────────────────────── Thinking questions ─────────────────────────
  const paren = M1.qlib.paren;
  // Find the mistake: equation of a line through two points.
  add({ id: "u2.th.find-error", skill: "u2.writeline", level: L.H, type: "mcq", calc: false,
    make(r) {
      const m = r.intNot(-5, 5, [0]), x1 = r.int(-4, 3), dx = r.int(1, 4), b = r.int(-9, 9);
      const x2 = x1 + dx, y1 = m * x1 + b, y2 = m * x2 + b, kind0 = r.int(0, 3);
      const kind = Math.abs(m) === 1 && kind0 === 0 ? 1 : kind0; // a flipped slope of ±1 would still be right
      const mm = kind === 0 ? dx / (y2 - y1) : m;
      const s1 = kind === 0 ? `slope $= \\frac{${x2} - ${paren(x1)}}{${y2} - ${paren(y1)}} = ${tex(mm)}$` : `slope $= \\frac{${y2} - ${paren(y1)}}{${x2} - ${paren(x1)}} = ${m}$`;
      const bb = kind === 1 ? y1 + mm * x1 : y1 - mm * x1;
      const s2 = kind === 1 ? `$${y1} = ${m}(${x1}) + b$, so $b = ${y1} + ${paren(m * x1)} = ${bb}$` : `$${y1} = ${tex(mm)}(${x1}) + b$, so $b = ${y1} - ${paren(mm * x1)} = ${tex(bb)}$`;
      const shown = kind === 2 ? r.pick([-bb, bb + 1, bb - 1].filter((v) => v !== bb)) : bb;
      const s3 = `$y = ${lin(mm, shown)}$`;

      const f = M1.qlib.findStep([s1, s2, s3], bad, whyWrong);

        hint: "Check each step on its own.",
        solution: `Slope $= \\frac{${y2 - y1}}{${dx}} = ${m}$. $b = ${y1} - ${paren(m * x1)} = ${b}$. The line is $y = ${lin(m, b)}$.<br>` +
          (bad < 0 ? "**There is no mistake.**" : `The first mistake is in **Step ${bad + 1}**. ${whyWrong}`) };
    } });

  // Compare average rates of change of an exponential on two intervals, with a reason.
  add({ id: "u2.th.roc-reason", skill: "u2.roc", level: L.H, type: "mcq", calc: true,
    make(r) {
      const a = r.int(1, 5), g = r.pick([2, 3]), w = r.int(1, 3), s = r.int(0, 2);
      const f = (x) => a * g ** x;
      const r1 = (f(s + w) - f(s)) / w, r2 = (f(s + 2 * w) - f(s + w)) / w;
      const right = `From $x = ${s + w}$ to $x = ${s + 2 * w}$, because the function grows by a larger amount over each later interval of the same length.`;
      const m = mcq(right, [
        { text: `From $x = ${s}$ to $x = ${s + w}$, because the function starts growing sooner.`, why: `Compute both: $${tex(r1)}$ and $${tex(r2)}$.` },
        { text: `They are equal, because both intervals have length ${w}.`, why: "Equal-length intervals give equal rates only for linear functions." },
        { text: `They are equal, because the growth factor is always ${g}.`, why: "The factor is constant, but the amount added grows." },
      ], r);
      return { key: [a, g, w, s], ...m, think: true,
        prompt: `$f(x) = ${expo(a, g)}$. Over which interval is the average rate of change of $f$ greater? Pick the answer with the correct reason.`,
        hint: "Average rate of change is (change in $f$) ÷ (change in $x$).",
        solution: `From ${s} to ${s + w}: $\\frac{${f(s + w)} - ${f(s)}}{${w}} = ${tex(r1)}$. From ${s + w} to ${s + 2 * w}: $\\frac{${f(s + 2 * w)} - ${f(s + w)}}{${w}} = ${tex(r2)}$.<br>**${right}**` };
    } });

  // What changes if: a linear cost model's rate goes up.
  add({ id: "u2.th.what-if", skill: "u2.writeline", level: L.H, type: "numeric", calc: false,
    make(r) {
      const job = r.pick([["a plumber", "hour", "hours", "the call-out fee"], ["a tutor", "session", "sessions", "the sign-up fee"], ["a gym", "month", "months", "the joining fee"]]);
      const rate = r.int(3, 12) * 5, fee = r.int(2, 9) * 10, up = r.pick([5, 10, 15]), n = r.int(3, 12);
      return { key: [job[0], rate, fee, up, n], answer: up * n, think: true,
        prompt: `The cost of ${job[0]} for $x$ ${job[2]} is $C(x) = ${rate}x + ${fee}$ dollars. The price per ${job[1]} goes up by \\$${up}, and ${job[3]} stays the same. How many more dollars do ${n} ${job[2]} cost now?`,
        hint: `Only the ${rate} changes.`,
        solution: `New cost: $C(x) = ${rate + up}x + ${fee}$. Each ${job[1]} costs \\$${up} more, so ${n} ${job[2]} cost $${up} \\times ${n} = \\mathbf{${up * n}}$ dollars more. The fee does not matter.` };
    } });

  // Make it true: a whole number where exponential beats linear.
  add({ id: "u2.th.make-true", skill: "u2.linexp", level: L.C, type: "numeric", calc: true,
    make(r) {
      const g = r.pick([2, 3]), k = g === 2 ? r.pick([10, 20, 50, 100]) : r.pick([20, 50, 100, 200]), c = r.pick([0, 100, 500]);
      let x0 = 1; while (!(g ** x0 > k * x0 + c)) x0++;
      return { key: [g, k, c], answer: x0, accept: { lo: x0, int: true }, think: true,
        prompt: `$f(x) = ${lin(k, c)}$ and $g(x) = ${g}^{x}$. Give **one** positive whole number $x$ for which $g(x) > f(x)$.`,
        hint: "Try a few values in a table.",
        solution: `$g(${x0 - 1}) = ${g ** (x0 - 1)}$ and $f(${x0 - 1}) = ${k * (x0 - 1) + c}$, so $g$ is not ahead yet. $g(${x0}) = ${g ** x0} > f(${x0}) = ${k * x0 + c}$. From then on $g$ stays ahead, so any whole number **${x0} or more** works.` };
    } });

  const U2_ASN = [
    { s: "An exponential function with a growth factor greater than 1 eventually passes any increasing linear function.",
      right: "Always true: growth that multiplies eventually beats growth that adds.",
      wrong: ["Sometimes true: only if the exponential starts higher.", "Never true: a steep line stays ahead.", "Sometimes true: only if the line's slope is less than the factor."] },
    { s: "Over equal intervals, a linear function changes by equal amounts.",
      right: "Always true: the slope is the same everywhere, so equal steps in $x$ give equal changes in $y$.",
      wrong: ["Sometimes true: only when the slope is positive.", "Never true: the outputs keep changing.", "Sometimes true: only for whole-number inputs."] },
    { s: "The function $f(x) = a(b)^x$ with $a > 0$ and $0 < b < 1$ has a negative output for some $x$.",
      right: "Never true: a positive number times a positive power stays positive. The outputs get close to 0.",
      wrong: ["Always true: decay makes the outputs negative eventually.", "Sometimes true: only when $b < \\frac{1}{2}$.", "Sometimes true: only when $x$ is negative."] },
    { s: "$2^x > x^2$ for every whole number $x \\ge 1$.",
      right: "Sometimes true: it holds for $x = 1$ and $x \\ge 5$, but $2^3 = 8 < 9$.",
      wrong: ["Always true: exponential grows faster.", "Never true: squaring is bigger than doubling.", "Sometimes true: only for even $x$."] },
    { s: "If the average rate of change of a function is the same over $[0, 2]$ and $[2, 4]$, the function is linear.",
      right: "Sometimes true: a linear function works, but so does a function that wiggles between those points.",
      wrong: ["Always true: equal rates mean a line.", "Never true: exponential functions do this too.", "Always true: two equal rates prove the slope is constant."] },
    { s: "$a^m \\cdot a^n = a^{mn}$ for whole numbers $m, n$ and $a > 1$.",
      right: "Sometimes true: the rule is $a^{m+n}$, and $m + n = mn$ only for special pairs like $m = n = 2$.",
      wrong: ["Always true: that is the product rule.", "Never true: you always add exponents.", "Sometimes true: only when $a = 2$."] },
  ];
  add({ id: "u2.th.always", skill: "u2.linexp", level: L.C, type: "mcq", calc: false,
    make(r) {
      const i = r.int(0, U2_ASN.length - 1), it = U2_ASN[i];
      const m = mcq(it.right, it.wrong.map((t) => ({ text: t, why: "Test it with a few examples. " + it.right })), r);
      return { key: [i], ...m, think: true,
        prompt: `Is this statement always true, sometimes true, or never true?<br>"${it.s}"`,
        hint: "Try a few examples, including unusual ones.",
        solution: `**${it.right}**` };
    } });

  M1.units.u2 = Object.assign(M1.units.u2 || {}, { generators: gens });
})(typeof window !== "undefined" ? window : globalThis);

      why: ["Correct.", "Dividing by $x^{-1}$ adds 1 to the exponent: $6 - (-1) = 7$.", "$27 \\div 9 = 3$, so 3 goes on top.", "$3^3 = 27$, not 9."],
      hint: "First find $\\left(3x^2\\right)^3$.", solution: "$\\left(3x^2\\right)^3 = 27x^6$. $\\dfrac{27x^6}{9x^{-1}} = 3x^{6 - (-1)} = \\mathbf{3x^{7}}$" },
    { id: "u2b10", skill: "u2.roc", level: "hard", type: "numeric", calc: false, lesson: 7, standard: "NC.M1.F-IF.6", answer: 2,
      prompt: "The table shows the height of a plant. What is the average rate of change of its height from day 2 to day 8, in cm per day?",
      table: { headers: ["Day", "0", "2", "5", "8"], rows: [["Height (cm)", "3", "5.5", "10", "17.5"]] },
      hint: "Change in height ÷ change in days.", solution: "$\\dfrac{17.5 - 5.5}{8 - 2} = \\dfrac{12}{6} = \\mathbf{2}$ cm per day" },
    { id: "u2b11", skill: "u2.roc", level: "challenge", type: "mcq", calc: false, lesson: 7, standard: "NC.M1.F-IF.6",
      prompt: "$f(x) = 3 \\cdot 2^x$. Over which interval is the average rate of change of $f$ equal to 18?",
      choices: ["From $x = 2$ to $x = 4$", "From $x = 1$ to $x = 3$", "From $x = 2$ to $x = 3$", "From $x = 3$ to $x = 4$"], answer: 0,
      why: ["Correct.", "$\\frac{24 - 6}{2} = 9$.", "$\\frac{24 - 12}{1} = 12$.", "$\\frac{48 - 24}{1} = 24$."],
      hint: "Find $f(1), f(2), f(3), f(4)$ first.", solution: "$f(2) = 12$, $f(4) = 48$: $\\dfrac{48 - 12}{4 - 2} = 18$. **From $x = 2$ to $x = 4$**." },
    { id: "u2b12", skill: "u2.roc", level: "challenge", type: "numeric", calc: false, lesson: 7, standard: "NC.M1.F-IF.6", answer: 8,
      prompt: "The average rate of change of $f(x) = x^2$ from $x = 3$ to $x = b$ is 11. What is $b$?",
      hint: "$b^2 - 9 = (b - 3)(b + 3)$.", solution: "$\\dfrac{b^2 - 9}{b - 3} = b + 3 = 11$, so $b = \\mathbf{8}$." },
    { id: "u2b13", skill: "u2.writeline", level: "hard", type: "numeric", calc: true, lesson: 8, standard: "NC.M1.A-CED.2", answer: 37.75,
      prompt: "A taxi charges a fixed fee plus a cost per mile. A 4-mile ride costs \\$13.00 and a 10-mile ride costs \\$26.50. How much, in dollars, does a 15-mile ride cost?",
      hint: "6 more miles cost \\$13.50 more.", solution: "Per mile: $13.50 \\div 6 = 2.25$. Fee: $13 - 4(2.25) = 4$. $C = 4 + 2.25(15) = \\mathbf{37.75}$ dollars" },
    { id: "u2b14", skill: "u2.writeline", level: "challenge", type: "mcq", calc: false, lesson: 9, standard: "NC.M1.F-BF.1a",
      prompt: "A line passes through $(-2, 7)$ and $(4, -2)$. Which equation describes the line?",
      choices: ["$y = -\\frac{3}{2}x + 4$", "$y = -\\frac{2}{3}x + \\frac{17}{3}$", "$y = \\frac{3}{2}x + 10$", "$y = -\\frac{3}{2}x + 7$"], answer: 0,
      why: ["Correct.", "This uses change in $x$ over change in $y$.", "The line goes down from left to right, so the slope is negative.", "7 is $y$ at $x = -2$, not at $x = 0$."],
      hint: "Find the slope, then put one point into $y = mx + b$.", solution: "$m = \\dfrac{-2 - 7}{4 - (-2)} = -\\dfrac{3}{2}$. $7 = -\\frac{3}{2}(-2) + b = 3 + b$, so $b = 4$. **$y = -\\frac{3}{2}x + 4$**" },
    { id: "u2b15", skill: "u2.writeline", level: "challenge", type: "numeric", calc: false, lesson: 8, standard: "NC.M1.F-BF.1a", answer: 2,
      prompt: "The line through $(1, 5)$ and $(3, 11)$ crosses the $y$-axis at $(0, k)$. What is $k$?",
      hint: "Find the slope. Then step back from $x = 1$ to $x = 0$.", solution: "$m = \\dfrac{11 - 5}{3 - 1} = 3$. $k = 5 - 3 = \\mathbf{2}$" },
    { id: "u2b16", skill: "u2.writeexp", level: "hard", type: "mcq", calc: false, lesson: 9, standard: "NC.M1.F-LE.5",
      prompt: "A town had 8,000 people in 2020. The population grows by 2.5% each year. Which function gives the population $t$ years after 2020?",
      choices: ["$P(t) = 8000(1.025)^{t}$", "$P(t) = 8000(1.25)^{t}$", "$P(t) = 8000(0.025)^{t}$", "$P(t) = 8000 + 0.025t$"], answer: 0,
      why: ["Correct.", "2.5% is 0.025, so the factor is 1.025, not 1.25.", "Multiplying by 0.025 keeps only 2.5% each year.", "A percent change multiplies; it does not add a fixed amount."],
      hint: "Growing 2.5% means keeping 100% and adding 2.5%.", solution: "Factor: $1 + 0.025 = 1.025$. **$P(t) = 8000(1.025)^t$**" },
    { id: "u2b17", skill: "u2.writeexp", level: "challenge", type: "numeric", calc: true, lesson: 9, standard: "NC.M1.F-LE.5", answer: 309, tol: 1,
      prompt: "A phone is worth \\$900. It loses 30% of its value each year. To the nearest dollar, what is it worth after 3 years?",
      hint: "Losing 30% means keeping 70%.", solution: "$900(0.7)^3 = 900(0.343) = 308.7 \\approx \\mathbf{309}$ dollars" },
    { id: "u2b18", skill: "u2.writeexp", level: "challenge", type: "mcq", calc: false, lesson: 9, standard: "NC.M1.F-BF.1a",
      prompt: "$f$ is an exponential function with $f(0) = 5$ and $f(2) = 45$. All its values are positive. What is $f(3)$?",
      choices: ["$135$", "$65$", "$405$", "$225$"], answer: 0,
      why: ["Correct.", "This adds 20 each step, which is linear.", "That is $f(4)$.", "This multiplies by 5, the starting value."],
      hint: "$f(2) = 5b^2$.", solution: "$5b^2 = 45$, so $b^2 = 9$ and $b = 3$. $f(3) = 5 \\cdot 3^3 = \\mathbf{135}$" },
    { id: "u2b19", skill: "u2.writeexp", level: "hard", type: "numeric", calc: false, lesson: 9, standard: "NC.M1.F-BF.1a", answer: 25,
      prompt: "An exponential function $f(x) = a \\cdot b^x$ passes through $(0, 4)$ and $(1, 10)$. What is $f(2)$?",
      hint: "$a = f(0)$. Then $b = f(1) \\div f(0)$.", solution: "$a = 4$, $b = 10 \\div 4 = 2.5$. $f(2) = 4(2.5)^2 = 4(6.25) = \\mathbf{25}$" },
    { id: "u2b20", skill: "u2.discrete", level: "challenge", type: "multi", calc: false, lesson: 3, standard: "NC.M1.F-IF.5",
      prompt: "Select **all** functions whose domain should be whole numbers only.",
      choices: ["$C(n)$: the cost of $n$ concert tickets", "$h(t)$: the height of a kite $t$ seconds after launch", "$P(s)$: the total pay for $s$ shifts worked", "$W(m)$: the water in a tub $m$ minutes after the drain is opened", "$N(t)$: the number of people in a store $t$ minutes after it opens"],
      answer: [0, 2], why: ["", "Time can be any value, like 2.5 seconds.", "", "Time can be any value.", "The outputs are whole numbers, but the input is time, which can be any value."],
      hint: "The domain is about the **inputs**. Look at what each input counts.", solution: "Tickets and shifts are counted in whole numbers. Time can be any value, even when the output (like a number of people) is a whole number." },
  ];
  M1.units.u2 = Object.assign(M1.units.u2 || {}, { bank });

<script>/* content/unit-3-features-of-functions/generators.js */
/* Unit 3 Features of Functions: question generators.
   Each generator: { id, skill, level, type, calc, make(r) } where make returns
   { key, prompt, ... } and every answer is computed here, never typed by hand. */
(function (G) {
  const M1 = G.M1;
  const { fmt, tex, signed, mcq, multi, lin, pt, box, findStep, paren } = M1.qlib;

  const L = { B: "basic", I: "intermediate", H: "hard", C: "challenge" };
  const gens = [];
  const add = (g) => gens.push(g);
  const W = box(-7, 7);

  // ── Piecewise-linear graphs with whole-number corners ──
  // Corners alternate up and down, so every piece is one increasing or decreasing run.
  function zigzag(r, { pieces = r.int(3, 4), withZero = false } = {}) {
    for (let tries = 0; tries < 2000; tries++) {
      const pool = [];
      for (let x = -6; x <= 6; x++) pool.push(x);
      let xs = r.shuffle(pool).slice(0, pieces + 1).sort((a, b) => a - b);
      if (withZero && !xs.includes(0)) continue;
      if (xs.some((x, i) => i && x - xs[i - 1] < 2)) continue;
      let up = r.chance(0.5), y = r.int(-4, 4);
      const ys = [y];
      let ok = true;
      for (let i = 1; i < xs.length; i++) {
        const step = r.int(2, 6);
        y = up ? y + step : y - step;
        if (y > 6 || y < -6) { ok = false; break; }
        ys.push(y); up = !up;
      }
      if (!ok) continue;
      // one highest and one lowest corner keeps "maximum at" questions single-answer
      const mx = Math.max(...ys), mn = Math.min(...ys);
      if (ys.filter((v) => v === mx).length > 1 || ys.filter((v) => v === mn).length > 1) continue;
      return makePw(xs, ys);
    }
    throw new Error("zigzag: no graph found");
  }
  function makePw(xs, ys) {
    const f = (x) => {
      for (let i = 0; i < xs.length - 1; i++) if (x >= xs[i] - 1e-9 && x <= xs[i + 1] + 1e-9) return ys[i] + ((ys[i + 1] - ys[i]) * (x - xs[i])) / (xs[i + 1] - xs[i]);
      return NaN;
    };
    const runs = xs.slice(0, -1).map((x, i) => ({ a: x, b: xs[i + 1], up: ys[i + 1] > ys[i] }));
    return { xs, ys, f, runs, pts: xs.map((x, i) => [x, ys[i]]), lo: xs[0], hi: xs[xs.length - 1],
      max: Math.max(...ys), min: Math.min(...ys) };
  }
  const graphOf = (P, extra = {}) => Object.assign({ window: W, paths: [{ pts: P.pts }], closed: [P.pts[0], P.pts[P.pts.length - 1]] }, extra);
  const iv = (a, b, lc = "[", rc = "]") => `${lc}${a}, ${b}${rc}`;

  // ───────────────────────── Key features from graphs and tables ─────────────────────────
  add({ id: "u3.fe.y-intercept", skill: "u3.features", level: L.B, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r, { withZero: true });
      return { key: [P.xs, P.ys], answer: P.f(0), graph: graphOf(P),
        prompt: "The graph of $y = f(x)$ is shown. What is the $y$-intercept of the graph?",
        hint: "The y-intercept is where the graph crosses the y-axis, where $x = 0$.",
        solution: `At $x = 0$ the graph is at $y = ${P.f(0)}$. The $y$-intercept is **${P.f(0)}**.` };
    } });

  add({ id: "u3.fe.max-min", skill: "u3.features", level: L.B, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r), askMax = r.chance(0.5);
      const v = askMax ? P.max : P.min;
      return { key: [P.xs, P.ys, askMax], answer: v, graph: graphOf(P),
        prompt: `The whole graph of $y = f(x)$ is shown. What is the ${askMax ? "maximum" : "minimum"} value of $f$?`,
        hint: `The ${askMax ? "maximum" : "minimum"} value is the ${askMax ? "greatest" : "least"} $y$-value on the graph.`,
        solution: `The ${askMax ? "highest" : "lowest"} point is $${pt(P.pts[P.ys.indexOf(v)])}$. The ${askMax ? "maximum" : "minimum"} value is the $y$-value, **${v}**.` };
    } });

  add({ id: "u3.fe.increasing", skill: "u3.features", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 3 }), askUp = r.chance(0.5);
      const runs = P.runs.filter((x) => x.up === askUp), other = P.runs.filter((x) => x.up !== askUp);
      const R0 = r.pick(runs), O = r.pick(other);
      const yA = P.f(R0.a), yB = P.f(R0.b);
      const m = mcq(`$${iv(R0.a, R0.b, "(", ")")}$`, [
        { text: `$${iv(O.a, O.b, "(", ")")}$`, why: `On that interval the graph goes ${askUp ? "down" : "up"} from left to right.` },
        { text: `$${iv(Math.min(yA, yB), Math.max(yA, yB), "(", ")")}$`, why: "Those are y-values. Intervals of increase and decrease use x-values." },
        { text: `$${iv(P.lo, P.hi, "(", ")")}$`, why: `The graph does not ${askUp ? "rise" : "fall"} over the whole domain.` },
      ], r, [{ text: `$${iv(R0.a - 1, R0.b + 1, "(", ")")}$`, why: "That interval goes past the turning points." }]);
      return { key: [P.xs, P.ys, askUp, R0.a], ...m, graph: graphOf(P),
        prompt: `The graph of $y = f(x)$ is shown. On which interval is $f$ ${askUp ? "increasing" : "decreasing"}?`,
        hint: `Read left to right. Where does the graph go ${askUp ? "up" : "down"}?`,
        solution: `From $x = ${R0.a}$ to $x = ${R0.b}$ the graph goes ${askUp ? "up" : "down"}. $f$ is ${askUp ? "increasing" : "decreasing"} on **$${iv(R0.a, R0.b, "(", ")")}$**.` };
    } });

  add({ id: "u3.fe.table-zero", skill: "u3.features", level: L.I, type: "numeric", calc: false,
    make(r) {
      const m = r.pick([2, 4, -2, -4, 3, -3]), z = r.int(-6, 10) + (Math.abs(m) % 2 === 0 && r.chance(0.4) ? 0.5 : 0);
      const b = -m * z, xs = [0, 1, 2, 3, 4];
      if (xs.includes(z)) return this.make(r);
      return { key: [m, z], answer: z,
        table: { headers: ["$x$", "$f(x)$"], rows: xs.map((x) => [String(x), String(m * x + b)]) },
        prompt: "The table shows values of a linear function $f$. What is the $x$-intercept of the graph of $f$ (the value of $x$ where $f(x) = 0$)?",
        hint: "Find the slope from the table, then work back to where the output is 0.",
        solution: `From the table the output changes by ${m} each time $x$ goes up by 1, so the slope is ${m}, and $f(0) = ${b}$. $f(x) = ${lin(m, b)}$. Set $${lin(m, b)} = 0$: $x = \\mathbf{${tex(z)}}$.` };
    } });

  add({ id: "u3.fe.select-true", skill: "u3.features", level: L.H, type: "multi", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: r.int(3, 4) });
      const iMax = P.ys.indexOf(P.max), iMin = P.ys.indexOf(P.min);
      const R0 = r.pick(P.runs);
      const a = r.int(P.lo, P.hi), b = r.int(P.lo, P.hi);
      const items = [
        { text: `The maximum value is ${P.max}.`, ok: true },
        { text: `The maximum value is ${P.xs[iMax]}.`, ok: P.xs[iMax] === P.max, why: `${P.xs[iMax]} is where the maximum happens. The value is ${P.max}.` },
        { text: `$f$ is ${R0.up ? "increasing" : "decreasing"} on $${iv(R0.a, R0.b, "(", ")")}$.`, ok: true },
        { text: `$f$ is ${R0.up ? "decreasing" : "increasing"} on $${iv(R0.a, R0.b, "(", ")")}$.`, ok: false, why: `The graph goes ${R0.up ? "up" : "down"} there.` },
        { text: `$f(${a}) ${P.f(a) > P.f(b) ? ">" : P.f(a) < P.f(b) ? "<" : "="} f(${b})$`, ok: true },
        { text: `The minimum value happens at $x = ${P.xs[iMin]}$.`, ok: true },
      ];
      // keep 5 items, at least one false
      const keep = r.shuffle(items).slice(0, 5);
      if (!keep.some((x) => !x.ok)) keep[0] = items[3];
      if (keep.every((x) => !x.ok) || new Set(keep.map((x) => x.text)).size < keep.length) return this.make(r);
      const m = multi(keep, r);
      return { key: [P.xs, P.ys, R0.a, a, b, keep.map((x) => x.text)], ...m, graph: graphOf(P),
        prompt: "The whole graph of $y = f(x)$ is shown. Select **all** true statements.",
        hint: "Values are y-values. Where things happen are x-values.",
        solution: `Highest point $${pt(P.pts[iMax])}$, lowest point $${pt(P.pts[iMin])}$. ${P.runs.map((u) => `${u.up ? "Increasing" : "Decreasing"} on $(${u.a}, ${u.b})$`).join("; ")}. $f(${a}) = ${fmt(P.f(a))}$ and $f(${b}) = ${fmt(P.f(b))}$.<br>True: ${m.answer.map((i) => m.choices[i]).join(" · ")}` };
    } });

  add({ id: "u3.fe.story", skill: "u3.features", level: L.H, type: "graph-mcq", calc: false,
    make(r) {
      // distance from home over time: away, rest, back or further
      const pts = [[0, 0]];
      let t = 0, d = 0;
      const kinds = r.shuffle(["away", "rest", "back"]);
      if (kinds[0] === "back" || (kinds[0] === "rest")) kinds.unshift("away");
      for (const k of kinds) {
        const dt = r.int(1, 3);
        t += dt;
        if (k === "away") d += r.int(2, 4) * dt;
        if (k === "back") d = Math.max(1, d - r.int(1, 3) * dt);
        pts.push([t, d]);
      }
      if (t > 10 || d > 14 || pts.some((p, i) => i && p[1] <= 0)) return this.make(r);
      const segs = pts.slice(0, -1).map((p, i) => ({ a: p[0], b: pts[i + 1][0], k: pts[i + 1][1] > p[1] ? 0 : pts[i + 1][1] === p[1] ? 1 : 2 }));
      const S = r.pick(segs);
      const choices = ["She is walking away from home.", "She is stopped.", "She is walking back toward home.", "She is at home."];
      const why = ["The distance from home would go up.", "The distance would stay the same.", "The distance from home would go down.", "Her distance from home is not 0 there."];
      return { key: [pts, S.a], choices, answer: S.k, why: why.map((w, i) => (i === S.k ? "Correct." : w)),
        graph: { window: { xmin: 0, xmax: Math.max(10, t), ymin: 0, ymax: 16, xstep: 1, ystep: 2 }, paths: [{ pts }], closed: [pts[0], pts[pts.length - 1]] },
        prompt: `The graph shows Maya's distance from home, in blocks, $t$ minutes after she leaves. What is happening from $t = ${S.a}$ to $t = ${S.b}$?`,
        hint: "Is the distance going up, staying the same, or going down?",
        solution: `From $t = ${S.a}$ to $t = ${S.b}$ the distance goes from ${fmt(pts.find((p) => p[0] === S.a)[1])} to ${fmt(pts.find((p) => p[0] === S.b)[1])} blocks. **${choices[S.k]}**` };
    } });

  add({ id: "u3.fe.solutions", skill: "u3.features", level: L.C, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 4 });
      const ks = []; for (let k = P.min + 1; k < P.max; k++) if (!P.ys.includes(k)) ks.push(k);
      if (!ks.length) return this.make(r);
      const k = r.pick(ks);
      const n = P.runs.filter((u) => (P.f(u.a) - k) * (P.f(u.b) - k) < 0).length;
      return { key: [P.xs, P.ys, k], answer: n, graph: graphOf(P),
        prompt: `The whole graph of $y = f(x)$ is shown. How many solutions does the equation $f(x) = ${k}$ have?`,
        hint: `Draw the horizontal line $y = ${k}$. Count where it meets the graph.`,
        solution: `The line $y = ${k}$ crosses the graph on ${n === 1 ? "one piece" : `${n} pieces`}: ${P.runs.filter((u) => (P.f(u.a) - k) * (P.f(u.b) - k) < 0).map((u) => `between $x = ${u.a}$ and $x = ${u.b}$`).join(", ")}. **${n}** solution${n === 1 ? "" : "s"}.` };
    } });

  add({ id: "u3.fe.count-above", skill: "u3.features", level: L.C, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 3 });
      const k = r.int(P.min, P.max - 1);
      const xs = []; for (let x = P.lo; x <= P.hi; x++) if (P.f(x) > k) xs.push(x);
      if (!xs.length) return this.make(r);
      return { key: [P.xs, P.ys, k], answer: xs.length, graph: graphOf(P),
        prompt: `The whole graph of $y = f(x)$ is shown. For how many **whole-number** values of $x$ is $f(x) > ${k}$?`,
        hint: "Check each whole number in the domain. Points exactly on the line do not count.",
        solution: `The whole numbers with $f(x) > ${k}$ are ${xs.join(", ")}. That is **${xs.length}** values.` };
    } });

  // ───────────────────────── Domain, range and interval notation ─────────────────────────
  add({ id: "u3.do.ineq-to-interval", skill: "u3.domain", level: L.B, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-9, 4), b = a + r.int(2, 10), lc = r.pick(["[", "("]), rc = r.pick(["]", ")"]);
      const ineq = `${a} ${lc === "[" ? "\\le" : "<"} x ${rc === "]" ? "\\le" : "<"} ${b}`;
      const flip = (c) => ({ "[": "(", "(": "[", "]": ")", ")": "]" }[c]);
      const m = mcq(`$${iv(a, b, lc, rc)}$`, [
        { text: `$${iv(a, b, flip(lc), rc)}$`, why: `$${lc === "[" ? "\\le" : "<"}$ on the left means ${lc === "[" ? "include" : "leave out"} ${a}: ${lc === "[" ? "square bracket" : "round bracket"}.` },
        { text: `$${iv(a, b, lc, flip(rc))}$`, why: `$${rc === "]" ? "\\le" : "<"}$ on the right means ${rc === "]" ? "include" : "leave out"} ${b}.` },
        { text: `$${iv(a, b, flip(lc), flip(rc))}$`, why: "Square brackets include an endpoint; round brackets leave it out." },
      ], r);
      return { key: [a, b, lc, rc], ...m,
        prompt: `Which interval means the same as $${ineq}$?`,
        hint: "Square bracket: the endpoint is included. Round bracket: it is not.",
        solution: `${lc === "[" ? `${a} is included` : `${a} is not included`} and ${rc === "]" ? `${b} is included` : `${b} is not included`}: **$${iv(a, b, lc, rc)}$**.` };
    } });

  add({ id: "u3.do.graph-domain", skill: "u3.domain", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 3 });
      const openL = r.chance(0.5), openR = r.chance(0.5), askDomain = r.chance(0.5);
      const first = P.pts[0], last = P.pts[P.pts.length - 1];
      const g = graphOf(P, { closed: [openL ? null : first, openR ? null : last].filter(Boolean), open: [openL ? first : null, openR ? last : null].filter(Boolean) });
      let right, wrong;
