<title>Math 1 Practice</title>
<meta name="description" content="Adaptive NC Math 1 practice sets for an 8th grader, built on the WCPSS units.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Overpass+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: graph-paper notebook. Header + content column on wide screens; the set player puts the
   question beside a tools panel and stacks them on phones. */
:root {
  --bg: #f3f6f8; --surface: #ffffff; --surface-2: #eef2f6; --ink: #17212c; --muted: #586474;
  --line: #d6dde5; --grid: #e2e8ee; --accent: #2356d6; --accent-soft: #e4ecfd; --on-accent: #ffffff;
  --mark: #f2c230; --good: #1d7f55; --good-soft: #dff2e8; --bad: #be3a2b; --bad-soft: #fbe5e2;
  --t0: #c46a12; --t1: #2a7bbf; --t2: #6b4fc9; --ach: #1d7f55;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #151c24; --surface-2: #1b2430; --ink: #e5ebf1; --muted: #9aa6b4;
    --line: #2a3542; --grid: #212b36; --accent: #7ea4ff; --accent-soft: #1d2a45; --on-accent: #0e1319;
    --mark: #f2c230; --good: #5cc795; --good-soft: #15302a; --bad: #f08473; --bad-soft: #3a1f1c;
    --t0: #f0a050; --t1: #6fb2ec; --t2: #a891f2; --ach: #5cc795; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1b2430; --ink: #e5ebf1; --muted: #9aa6b4;
  --line: #2a3542; --grid: #212b36; --accent: #7ea4ff; --accent-soft: #1d2a45; --on-accent: #0e1319;
  --mark: #f2c230; --good: #5cc795; --good-soft: #15302a; --bad: #f08473; --bad-soft: #3a1f1c;
  --t0: #f0a050; --t1: #6fb2ec; --t2: #a891f2; --ach: #5cc795; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-attachment: fixed;
}
#app { min-height: 100%; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
math { font-size: 1.08em; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 16px;
  border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.big { min-height: 50px; padding: 0 26px; font-size: 1.05rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.btn-quiet { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 0.9rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.center { justify-content: center; margin-block: 8px; }

/* Pills */
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.sm { font-size: 0.68rem; padding: 0 6px; }
.pill.ach { background: var(--good-soft); color: var(--ach); border-color: transparent; }
.pill.t0, .pill.lvl-basic { color: var(--t0); border-color: currentColor; background: transparent; }
.pill.t1, .pill.lvl-intermediate { color: var(--t1); border-color: currentColor; background: transparent; }
.pill.t2, .pill.lvl-hard { color: var(--t2); border-color: currentColor; background: transparent; }
.pill.lvl-challenge { color: var(--on-accent); background: var(--t2); border-color: var(--t2); }
.pill.calc-ok { color: var(--good); border-color: currentColor; background: transparent; }
.pill.calc-no { color: var(--bad); border-color: currentColor; background: transparent; }
.pill.think { color: var(--accent); border-color: currentColor; background: var(--accent-soft); }
.pill.review { color: var(--muted); border-style: dashed; display: inline-block; width: auto; }
.review-score { margin-top: .35rem; font-size: .9rem; }
.pill.done { color: var(--good); border-color: currentColor; background: transparent; }
.pill.lock { color: var(--muted); }
.lock-note { color: var(--muted); }
.parents .row { margin: 10px 0; }
.big-check { font-size: 1rem; margin: 8px 0; }
.file-btn { cursor: pointer; }
.flags { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 10px; }
.flags li { border-top: 1px solid var(--line); padding-top: 8px; }
.btn-link.flag { margin-top: 8px; color: var(--muted); font-size: 0.85rem; }
.btn-link.flag.on { color: var(--bad); font-weight: 700; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { width: 40px; height: 40px; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark svg { width: 26px; height: 26px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; }
.brand-sub { font-size: 0.8rem; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 9px; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 700; color: var(--muted); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.save-chip { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.save-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.save-chip.browser::before { background: var(--mark); }

.page { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 22px; }
.intro { display: flex; flex-direction: column; gap: 8px; max-width: 68ch; }
.intro p { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; align-items: baseline; }
.loading { padding: 80px 16px; text-align: center; color: var(--muted); font-size: 1.1rem; }

/* Resume banner */
.resume { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 18px; border-radius: var(--radius);
  background: var(--accent-soft); border: 1.5px solid var(--accent); }
.resume-title { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }

/* Units */
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.unit-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.unit-card.planned { background: transparent; border-style: dashed; }
.unit-card.planned h3, .unit-card.planned .unit-num { color: var(--muted); }
.unit-card.mastered { border-color: var(--ach); }
.unit-head { display: flex; justify-content: space-between; align-items: center; }
.unit-num { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 700; color: var(--accent); }
.unit-meta, .unit-stats { font-size: 0.88rem; color: var(--muted); }
.unit-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.skill-meter { display: flex; gap: 4px; }
.sm { flex: 1; height: 8px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.sm.t0 { background: var(--t0); border-color: var(--t0); opacity: 0.45; }
.sm.t1 { background: var(--t1); border-color: var(--t1); opacity: 0.7; }
.sm.t2 { background: var(--t2); border-color: var(--t2); }
.sm.ach { background: var(--ach); border-color: var(--ach); }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
thead th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 0.88rem; white-space: nowrap; }
.score { font-weight: 700; }
.score.shi { color: var(--good); } .score.smid { color: var(--t0); } .score.slo { color: var(--bad); }
.qtable { width: auto; min-width: 280px; background: var(--surface); border: 1px solid var(--line); }
.qtable th, .qtable td { border: 1px solid var(--line); text-align: center; font-family: var(--font-mono); padding: 8px 14px; }
.qtable tbody th { background: var(--surface-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; min-width: 80px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.ladder td:not(:first-child):not(.num) { text-align: center; }
.rung { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.rung.done { background: var(--ach); border-color: var(--ach); }
.rung.now { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
.picker { flex-direction: row; flex-wrap: wrap; align-items: center; }
.picker select { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* Set player */
body[data-view="set"] { background-image: none; }
.set-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.set-title { display: flex; flex-direction: column; line-height: 1.25; margin-right: auto; min-width: 0; }
.set-title .muted { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer { font-family: var(--font-mono); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.timer-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mark); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .timer-dot { animation: none; } }
.dots { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; max-width: 1280px; margin: 0 auto; }
.dot { width: 34px; height: 34px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 0.8rem; cursor: pointer; color: var(--muted); }
.dot.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.dot.here { outline: 3px solid var(--mark); outline-offset: 1px; color: var(--ink); }
.player { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; padding-inline: 16px; padding-block: 4px 110px; max-width: 1280px; margin: 0 auto; align-items: start; }
@media (max-width: 900px) { .player { grid-template-columns: minmax(0, 1fr); } }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qnum { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; margin-right: 4px; }
.qskill { font-size: 0.85rem; color: var(--muted); margin-top: -8px; }
.prompt { font-size: 1.12rem; line-height: 1.65; }
.qgraph { max-width: 460px; width: 100%; }
.qgraph.small { max-width: 340px; }
.legend { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lg-c, .lg-s, .lg-ring { display: inline-block; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; margin-left: 8px; }
.lg-s { border-radius: 2px; background: var(--t0); }
.lg-ring { background: transparent; border: 2px solid var(--good); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 14px; min-height: 52px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.choice:hover { border-color: var(--accent); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.letter { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--font-mono); font-size: 0.85rem; border: 1.5px solid var(--line); }
.choice.on .letter { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.box { flex: none; width: 22px; height: 22px; border-radius: 5px; border: 2px solid var(--line); }
.choice.on .box { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.ctext { min-width: 0; overflow-x: auto; }
.num-entry { display: flex; flex-direction: column; gap: 6px; font-weight: 700; max-width: 320px; }
.num-entry input { font: 600 1.25rem var(--font-mono); padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.num-entry input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.num-help { font-size: 0.85rem; color: var(--muted); }
.num-help.warn { color: var(--bad); }
.plot-wrap { display: flex; flex-direction: column; gap: 8px; max-width: 480px; }
.hint-row { border-top: 1px dashed var(--line); padding-top: 10px; }
.hint { background: color-mix(in srgb, var(--mark) 18%, var(--surface)); border-radius: 8px; padding: 10px 12px; }
.set-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.foot-mid { margin-right: auto; color: var(--muted); font-size: 0.9rem; flex: 1 1 160px; text-align: center; }
@media (max-width: 560px) { .dots { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; } .dot { flex: none; } .foot-mid { order: -1; flex-basis: 100%; } .player { padding-bottom: 150px; } }

/* Tools */
.tools { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; position: sticky; top: 76px; min-width: 0; }
@media (max-width: 900px) { .tools { position: static; } }
.tool-tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 8px; }
.ttab { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 7px 4px; cursor: pointer; font-weight: 700; color: var(--muted); }
.ttab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.tool-pane { display: flex; flex-direction: column; gap: 8px; }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tool-row.small { font-size: 0.8rem; color: var(--muted); }
.tool-row.small input { width: 54px; font: inherit; padding: 3px 5px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg-btn { border: 0; background: var(--surface); padding: 6px 10px; cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--muted); border-right: 1px solid var(--line); }
.seg-btn:last-child { border-right: 0; }
.seg-btn.on { background: var(--accent); color: var(--on-accent); }
.check { font-size: 0.85rem; display: flex; gap: 4px; align-items: center; }
.pad { width: 100%; height: auto; aspect-ratio: 720 / 560; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); touch-action: none; cursor: crosshair; }

/* SVG grid */
.grid-svg { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; touch-action: manipulation; }
.grid-svg.interactive { cursor: crosshair; }
.grid-svg .minor { stroke: var(--grid); stroke-width: 1; }
.grid-svg .axis { stroke: var(--muted); stroke-width: 1.6; }
.grid-svg .tick { fill: var(--muted); font: 10px var(--font-mono); }
.grid-svg .axis-label { fill: var(--muted); font: 11px var(--font-body); }
.grid-svg .pt { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; }
.grid-svg .pt2 { fill: var(--t0); }
.grid-svg .pt-hover { fill: var(--accent); opacity: 0.3; pointer-events: none; }
.grid-svg .pt-answer { fill: none; stroke: var(--good); stroke-width: 2.5; }
.grid-svg .user-line { stroke: var(--accent); stroke-width: 2; }
.grid-svg .curve { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; }
.grid-svg .curve.alt { stroke: var(--t0); }
.grid-svg .curve.dashed { stroke-dasharray: 7 5; }
.grid-svg .shade { fill: var(--accent); opacity: 0.16; }
.grid-svg .end-closed { fill: var(--accent); }
.grid-svg .end-open { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.grid-svg .curve-label { fill: var(--ink, currentColor); font: 600 12px var(--font-body); }

/* Calculator */
.calc-blocked { padding: 18px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); font-weight: 700; text-align: center; }
.calc-body { display: flex; flex-direction: column; gap: 8px; }
.calc-input { font: 600 1.1rem var(--font-mono); padding: 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--ink); }
.calc-out { font: 700 1.2rem var(--font-mono); text-align: right; min-height: 1.6em; }
.calc-keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ck { min-height: 42px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 1rem var(--font-mono); }
.ck-op { background: var(--surface-2); }
.ck-eq { background: var(--accent); color: var(--on-accent); border-color: var(--accent); grid-column: span 2; }
.calc-tape { list-style: none; margin: 0; padding: 0; font: 0.82rem var(--font-mono); color: var(--muted); display: flex; flex-direction: column; gap: 2px; }

/* Results */
.score-hero { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
.score-hero.mastered { border-color: var(--ach); border-width: 2px; }
.big-score { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 8vw, 4rem); line-height: 1; color: var(--muted); }
.big-score span { color: var(--ink); }
.big-score small { font-size: 0.4em; margin-left: 10px; color: var(--accent); }
.time-stats { display: grid; grid-template-columns: repeat(2, minmax(120px, auto)); gap: 10px 26px; margin: 0; }
.time-stats dt { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.time-stats dd { margin: 0; font: 700 1.05rem var(--font-mono); }
.mastered-panel { background: var(--good-soft); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.mastered-panel h2 { color: var(--ach); }
.events { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.review-filter { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; align-self: flex-start; }
.review { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.ritem { border: 1px solid var(--line); border-left: 5px solid var(--good); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ritem.bad { border-left-color: var(--bad); }
.rhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; }
.rhead .muted { font-weight: 400; font-size: 0.85rem; }
.mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--good-soft); color: var(--good); }
.ritem.bad .mark { background: var(--bad-soft); color: var(--bad); }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.ans-grid > div { background: var(--surface-2); border-radius: 7px; padding: 10px; min-width: 0; overflow-x: auto; }
.lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
.why { font-size: 0.93rem; background: var(--bad-soft); border-radius: 7px; padding: 8px 10px; }
details summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.solution { padding: 8px 2px 2px; line-height: 1.8; overflow-x: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; max-width: calc(100% - 32px); }

/* Skill checklist: only shown by designs that style it */
.skill-list { display: none; }

/* fonts: https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Overpass+Mono:wght@400;600;700&display=swap */
/* Theme "Metro Map": the course is a transit map. Each unit is a station on its own colored line,
   each question in a set is a stop on the route, and "you are here" is always the biggest marker.
   Built for an 8th grader: highway-sign headings (Overpass), low-vision-friendly body text (Atkinson Hyperlegible Next), 18px text, 48px+ tap targets, thick focus rings. */
:root {
  --bg: #f5f3ee; --surface: #ffffff; --surface-2: #eceae3; --ink: #121528; --muted: #4c5266;
  --line: #d3d0c6; --grid: #e4e1d8; --accent: #2b2fd6; --accent-soft: #e3e4ff; --on-accent: #ffffff;
  --mark: #ffc21a; --good: #00803e; --good-soft: #dcf3e5; --bad: #c8102e; --bad-soft: #fde2e5;
  --t0: #b35500; --t1: #0067b9; --t2: #7a33e6; --ach: #00803e;
  --sign: #121528; --on-sign: #ffffff; --track: #cfccc2;
  --font-display: "Overpass", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e1c; --surface: #161a2e; --surface-2: #1f2440; --ink: #f1f2f8; --muted: #a9aecb;
    --line: #2f3556; --grid: #1a1e35; --accent: #8f93ff; --accent-soft: #262b5c; --on-accent: #0c0e1c;
    --mark: #ffcc33; --good: #4fd18b; --good-soft: #123222; --bad: #ff7a8a; --bad-soft: #3d1820;
    --t0: #ffa24d; --t1: #5fb4ff; --t2: #b794ff; --ach: #4fd18b;
    --sign: #05060d; --on-sign: #ffffff; --track: #353b5e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e1c; --surface: #161a2e; --surface-2: #1f2440; --ink: #f1f2f8; --muted: #a9aecb;
  --line: #2f3556; --grid: #1a1e35; --accent: #8f93ff; --accent-soft: #262b5c; --on-accent: #0c0e1c;
  --mark: #ffcc33; --good: #4fd18b; --good-soft: #123222; --bad: #ff7a8a; --bad-soft: #3d1820;
  --t0: #ffa24d; --t1: #5fb4ff; --t2: #b794ff; --ach: #4fd18b;
  --sign: #05060d; --on-sign: #ffffff; --track: #353b5e; color-scheme: dark;
}

/* Base: bigger, calmer, no background pattern */
body { font-size: 18px; line-height: 1.6; background-image: none; }
h1 { font-weight: 900; letter-spacing: -0.02em; font-size: clamp(2rem, 5vw, 3rem); }
h2 { font-weight: 800; font-size: 1.35rem; }
h3 { font-weight: 800; font-size: 1.35rem; }
:focus-visible { outline: 4px solid var(--mark); outline-offset: 3px; box-shadow: 0 0 0 7px var(--ink); border-radius: 10px; }
.eyebrow, thead th, .lbl, .time-stats dt { letter-spacing: 0.1em; }

/* Header = station sign */
.top { background: var(--sign); color: var(--on-sign); border-bottom: 6px solid var(--mark); padding: 12px 20px; }
.brand-mark { background: var(--mark); color: #121528; border-radius: 50%; width: 46px; height: 46px; }
.brand-name { font-weight: 900; font-size: 1.35rem; letter-spacing: -0.01em; }
.brand-sub { color: color-mix(in srgb, var(--on-sign) 70%, transparent); }
.tabs { background: transparent; gap: 8px; padding: 0; }
.tab { min-height: 48px; padding: 0 22px; border-radius: 999px; color: var(--on-sign); border: 2px solid color-mix(in srgb, var(--on-sign) 35%, transparent); font-size: 1.05rem; font-weight: 800; }
.tab:hover { border-color: var(--on-sign); }
.tab.on { background: var(--mark); color: #121528; border-color: var(--mark); box-shadow: none; }
.save-chip { color: color-mix(in srgb, var(--on-sign) 75%, transparent); }

.page { gap: 28px; }
.intro p { font-size: 1.05rem; }
.intro h1::before { content: "Your route"; display: block; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

/* Buttons: big, clear, signage-like */
.btn { min-height: 50px; padding: 0 24px; border-radius: 999px; border-width: 2px; font-weight: 800; font-size: 1.02rem; }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.big { min-height: 58px; padding: 0 32px; font-size: 1.15rem; }
.btn-link { font-size: 1rem; }
.pill { font-weight: 800; }

/* Resume banner = "next train" board */
.resume { background: var(--sign); color: var(--on-sign); border: 0; border-left: 10px solid var(--mark); }
.resume .muted, .resume .eyebrow { color: color-mix(in srgb, var(--on-sign) 75%, transparent); }
.resume .btn.primary { background: var(--mark); border-color: var(--mark); color: #121528; }

/* Units = stations along a line. Each unit gets its own line color. */
.unit-grid { display: flex; flex-direction: column; gap: 18px; padding-left: 64px; }
.unit-card { position: relative; --lc: #59636e; border: 2px solid var(--line); border-radius: var(--radius); padding: 18px 20px; overflow: visible; }
.unit-card:nth-child(1) { --lc: #d1001f; } .unit-card:nth-child(2) { --lc: #005eb8; } .unit-card:nth-child(3) { --lc: #00843d; }
.unit-card:nth-child(4) { --lc: #c75000; } .unit-card:nth-child(5) { --lc: #7a33e6; } .unit-card:nth-child(6) { --lc: #00808a; }
.unit-card:nth-child(7) { --lc: #b8006b; } .unit-card:nth-child(8) { --lc: #7a4f2e; } .unit-card:nth-child(9) { --lc: #59636e; }
.unit-card::before { content: ""; position: absolute; left: -46px; top: 30px; bottom: -50px; width: 10px; background: var(--lc); border-radius: 5px; }
.unit-card:last-child::before { bottom: auto; height: 0; }
.unit-card::after { content: ""; position: absolute; left: -54px; top: 22px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 6px solid var(--lc); }
.unit-card:not(.planned) { border-color: var(--lc); border-width: 3px; box-shadow: 8px 8px 0 color-mix(in srgb, var(--lc) 22%, transparent); }
.unit-card:not(.planned)::after { width: 34px; height: 34px; left: -58px; top: 18px; background: var(--mark); border-color: var(--sign); }
.unit-card.planned { background: var(--surface); border-style: solid; padding-block: 12px; opacity: 0.85; }
.unit-card.planned::before { background: repeating-linear-gradient(var(--lc) 0 10px, transparent 10px 18px); opacity: 0.55; }
.unit-card.planned .unit-meta { font-size: 0.85rem; }
.unit-card.mastered::after { background: var(--ach); border-color: var(--ach); }
.unit-head { justify-content: flex-start; gap: 10px; }
.unit-num { background: var(--lc); color: #fff; border-radius: 999px; padding: 3px 12px; font-family: var(--font-display); font-weight: 900; font-size: 0.85rem; letter-spacing: 0.04em; }
.unit-card.planned .unit-num { color: #fff; }
.unit-card.planned h3 { color: var(--muted); font-size: 1.15rem; }
.skill-meter { gap: 6px; }
.sm { height: 12px; border-radius: 999px; border: 0; background: var(--surface-2); }

/* Panels and tables */
.panel, .score-hero, .tools, .qcard { border: 2px solid var(--line); }
.bar { height: 10px; }
.bar span { background: var(--accent); }
.rung { width: 22px; height: 22px; border-width: 3px; }

/* Set player: header = route sign */
body[data-view="set"] { background: var(--bg); }
.set-bar { background: var(--sign); color: var(--on-sign); border-bottom: 6px solid var(--mark); padding: 10px 20px; }
.set-bar .btn.quiet { color: var(--on-sign); border: 2px solid color-mix(in srgb, var(--on-sign) 35%, transparent); }
.set-title .muted { color: color-mix(in srgb, var(--on-sign) 72%, transparent); }
.set-title strong { font-size: 1.15rem; font-weight: 900; }
.timer { color: var(--on-sign); font-size: 1.3rem; }

/* Question stops connected by a track */
.dots { gap: 8px; padding: 18px 20px 10px; }
.dot { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--track); background: var(--surface); color: var(--muted); font-weight: 700; font-size: 0.82rem; }
.dot + .dot::before { content: ""; position: absolute; right: calc(100% + 4px); top: 50%; width: 8px; height: 4px; margin-top: -2px; background: var(--track); pointer-events: none; }
.dot.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dot.done::before { background: var(--accent); }
.dot.here { outline: none; transform: scale(1.22); background: var(--mark); border-color: var(--sign); color: #121528; font-weight: 900; z-index: 1; }

.player { gap: 20px; }
.qcard { padding: 28px; gap: 18px; }
.qnum { font-size: 1.35rem; font-weight: 900; }
.qskill { font-size: 0.95rem; margin-top: -10px; }
.prompt { font-size: 1.28rem; line-height: 1.7; }
.choices { gap: 12px; }
.choice { min-height: 60px; padding: 12px 16px; border-radius: 12px; border-width: 2px; font-size: 1.1rem; }
.choice:hover { border-color: var(--accent); background: var(--accent-soft); }
.choice.on { border-color: var(--accent); border-width: 3px; background: var(--accent-soft); }
.letter { width: 36px; height: 36px; border-radius: 9px; background: var(--sign); color: var(--on-sign); border: 0; font-size: 1rem; }
.choice.on .letter { background: var(--mark); color: #121528; }
.box { width: 28px; height: 28px; border-width: 3px; }
.num-entry input { font-size: 1.4rem; padding: 12px 14px; border-width: 2px; border-radius: 12px; }
.num-entry input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--mark); }
.hint { border-left: 6px solid var(--mark); border-radius: 10px; }

/* Bottom bar: big arrows to move between stops */
.set-foot { border-top: 2px solid var(--line); padding-block: 12px; }
.set-foot [data-act="prev"]::before { content: "←"; }
.set-foot [data-act="next"]::after { content: "→"; }
.set-foot [data-act="next"] { background: var(--sign); color: var(--on-sign); border-color: var(--sign); }
.foot-mid { font-weight: 700; color: var(--ink); }
#submit-btn { background: var(--good); border-color: var(--good); }

/* Tools */
.tool-tabs { background: transparent; gap: 6px; padding: 0; }
.ttab { min-height: 44px; border: 2px solid var(--line); border-radius: 999px; }
.ttab.on { background: var(--sign); color: var(--on-sign); border-color: var(--sign); box-shadow: none; }
.seg-btn.on { background: var(--sign); color: var(--on-sign); }
.ck { min-height: 48px; border-radius: 10px; }
.ck-eq { background: var(--good); border-color: var(--good); }

/* Results */
.score-hero { border-left: 10px solid var(--accent); }
.score-hero.mastered { border-color: var(--ach); }
.big-score { font-weight: 900; }
.ritem { border-width: 2px; border-left-width: 8px; border-radius: 12px; }

@media (max-width: 560px) {
  .unit-grid { padding-left: 44px; }
  .unit-card::before { left: -32px; width: 8px; }
  .unit-card::after { left: -39px; width: 22px; height: 22px; border-width: 5px; }
  .unit-card:not(.planned)::after { left: -42px; width: 28px; height: 28px; }
  .tab { padding: 0 16px; }
  .set-foot .btn { padding: 0 16px; }
  .set-bar { padding-inline: 12px; gap: 10px; }
  .set-bar .btn.quiet { white-space: nowrap; padding: 0 14px; min-height: 44px; }
  .timer-dot { display: none; }
}

<script>/* app/src/qlib.js */
/* Question-building helpers shared by every unit's generators.
   Plain script: attaches to globalThis.M1 so it runs in the browser and in node tests. */
(function (G) {
  const M1 = (G.M1 = G.M1 || {});

  // Seeded random numbers (mulberry32) so any question can be rebuilt from its seed.
  function rng(seed) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const r = {
      next,
      int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      sign: () => (next() < 0.5 ? -1 : 1),
      chance: (p) => next() < p,
      shuffle: (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      },
      intNot: (lo, hi, bad) => {
        for (let k = 0; k < 100; k++) {
          const v = lo + Math.floor(next() * (hi - lo + 1));
          if (!bad.includes(v)) return v;
        }
        return lo;
      },
    };
    return r;
  }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a, b] = [b, a % b];
    return a || 1;
  }

  // Format a number for display: integers plainly, simple fractions as a/b, else up to 4 decimals.
  function fmt(x) {
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    for (const d of [2, 3, 4, 5, 6, 8, 9, 10, 12, 16, 25, 27, 32, 64, 81, 100, 125, 243, 256]) {
      const n = x * d;
      if (Math.abs(n - Math.round(n)) < 1e-9) {
        const g = gcd(Math.round(n), d);
        return `${Math.round(n) / g}/${d / g}`;
      }
    }
    return String(Math.round(x * 10000) / 10000);
  }

  // Same, as KaTeX (fractions stacked).
  function tex(x) {
    const s = fmt(x);
    if (s.includes("/")) {
      const neg = s.startsWith("-");
      const [n, d] = s.replace("-", "").split("/");
      return `${neg ? "-" : ""}\\frac{${n}}{${d}}`;
    }
    return s;
  }

  // "+ 3" / "- 3" for writing equations.
  function signed(x, texMode = true) {
    const v = texMode ? tex(Math.abs(x)) : fmt(Math.abs(x));
    return x < 0 ? `- ${v}` : `+ ${v}`;
  }

  // Build a 4-option multiple choice from the correct text and named mistakes.
  // distractors: [{text, why}] — duplicates and copies of the answer are dropped;
  // fillers ({text, why}) top it up to 4 if needed.
  function mcq(correct, distractors, r, fillers = [], correctWhy = "Correct.") {
    const seen = new Set([norm(correct)]);
    const wrong = [];
    for (const d of distractors.concat(fillers)) {
      const k = norm(d.text);
      if (seen.has(k)) continue;
      seen.add(k);
      wrong.push(d);
      if (wrong.length === 3) break;
    }
    if (wrong.length < 3) throw new Error("mcq: not enough distinct distractors for " + correct);
    const all = r.shuffle([{ text: correct, why: correctWhy, ok: true }].concat(wrong));
    return {
      choices: all.map((c) => c.text),
      answer: all.findIndex((c) => c.ok),
      why: all.map((c) => c.why),
    };
  }

  // Multi-select: items [{text, ok, why}] shuffled; answer = sorted indices of ok items.
  function multi(items, r) {
    const all = r.shuffle(items);
    return {
      choices: all.map((c) => c.text),
      answer: all.map((c, i) => (c.ok ? i : -1)).filter((i) => i >= 0),
      why: all.map((c) => c.why || ""),
    };
  }

  function norm(s) {
    return String(s).replace(/\s+/g, "").toLowerCase();
  }

  // Parse a typed number: integers, decimals, fractions (3/4, -2 1/2), commas allowed.
  function parseNum(s) {
    if (s == null) return NaN;
    s = String(s).trim().replace(/,/g, "").replace(/−/g, "-").replace(/^\$/, "");
    if (!s) return NaN;
    let m = s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/);
    if (m) return (m[1] ? -1 : 1) * (Number(m[2]) + Number(m[3]) / Number(m[4]));
    m = s.match(/^(-?\d*\.?\d+)\s*\/\s*(-?\d*\.?\d+)$/);
    if (m) return Number(m[1]) / Number(m[2]);

    return NaN;
  }

  // Sequence helpers
  const arith = (a, d, n) => a + d * (n - 1);
  // Remove floating-point dust (31.999999999 → 32) so answers and labels stay exact.
  const clean = (x) => (Math.abs(x - Math.round(x)) < 1e-9 ? Math.round(x) : Math.round(x * 1e10) / 1e10);
  const geom = (a, r, n) => clean(a * Math.pow(r, n - 1));
  const terms = (f, count, start = 1) => Array.from({ length: count }, (_, i) => f(start + i));
  const list = (arr) => arr.map((x) => fmt(x)).join(", ");
  const texList = (arr) => arr.map((x) => tex(x)).join(",\\ ");

  // Equation strings in function notation
  const eqArithExplicit = (a, d, name = "f") => `${name}(n) = ${tex(a)} ${signed(d)}(n - 1)`;
  const eqGeomExplicit = (a, r, name = "f") => `${name}(n) = ${tex(a)} \\cdot ${paren(r)}^{n - 1}`;
  const eqArithRecursive = (a, d, name = "f") => `${name}(1) = ${tex(a)},\\ ${name}(n) = ${name}(n - 1) ${signed(d)}`;
  const eqGeomRecursive = (a, r, name = "f") => `${name}(1) = ${tex(a)},\\ ${name}(n) = ${paren(r)} \\cdot ${name}(n - 1)`;
  function paren(x) {
    const t = tex(x);
    return x < 0 || t.includes("frac") ? `\\left(${t}\\right)` : t;
  }

  // Graph window that fits a list of points, with friendly tick steps.
  function windowFor(points, opts = {}) {
    const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
    const xmax = Math.max(opts.minX || 0, ...xs) + 1;
    let ymin = Math.min(0, ...ys), ymax = Math.max(0, ...ys);
    const span = ymax - ymin || 1;
    const step = niceStep(span / 8);
    ymin = Math.floor(ymin / step) * step - (ymin < 0 ? step : 0);
    ymax = Math.ceil(ymax / step) * step + step;
    return { xmin: 0, xmax: Math.max(6, xmax), ymin, ymax, xstep: 1, ystep: step };
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p;
    return 10 * p;
  }

  // ── Shared by the later units ──
  // Linear expression mx + b in KaTeX (handles m = ±1, b = 0, fractions).
  function lin(m, b, v = "x") {
    if (m === 0) return tex(b);
    const mt = m === 1 ? "" : m === -1 ? "-" : tex(m);
    return `${mt}${v}${b === 0 ? "" : " " + signed(b)}`;
  }
  // a/b reduced, as KaTeX.
  function frac(n, d) {
    const g = gcd(n, d), s = (n < 0) !== (d < 0) && n !== 0 ? "-" : "";
    const N = Math.abs(n) / g, D = Math.abs(d) / g;
    return D === 1 ? `${s}${N}` : `${s}\\frac{${N}}{${D}}`;
  }
  const pt = (p) => `(${fmt(p[0])}, ${fmt(p[1])})`;
  // Sample y = f(x) on [x0, x1] as a polyline, cut where it leaves [ylo, yhi] by a margin.
  function sample(f, x0, x1, n = 80) {
    const out = [];
    for (let i = 0; i <= n; i++) { const x = x0 + ((x1 - x0) * i) / n, y = f(x); if (Number.isFinite(y)) out.push([clean(x), clean(y)]); }
    return out;
  }
  // A square-ish window around the origin.
  const box = (lo, hi, step = 1, ylo = lo, yhi = hi, ystep = step) => ({ xmin: lo, xmax: hi, ymin: ylo, ymax: yhi, xstep: step, ystep });
  // Format ax + by = c style coefficients: "3x - 2y".
  function terms2(a, b, x = "x", y = "y") {
    const t1 = a === 0 ? "" : `${a === 1 ? "" : a === -1 ? "-" : a}${x}`;
    if (b === 0) return t1 || "0";
    const bb = Math.abs(b) === 1 ? "" : Math.abs(b);
    return t1 ? `${t1} ${b < 0 ? "-" : "+"} ${bb}${y}` : `${b < 0 ? "-" : ""}${bb}${y}`;
  }
  // Quadratic ax^2 + bx + c in KaTeX.
  function quad(a, b, c, v = "x") {
    let s = a === 1 ? `${v}^2` : a === -1 ? `-${v}^2` : `${tex(a)}${v}^2`;
    if (b) s += ` ${b < 0 ? "-" : "+"} ${Math.abs(b) === 1 ? "" : tex(Math.abs(b))}${v}`;
    if (c) s += ` ${signed(c)}`;
    return s;
  }
  // (x - p) with sign handled: x - 3, x + 2, x.
  const fac = (p, v = "x") => (p === 0 ? v : `${v} ${p > 0 ? "-" : "+"} ${Math.abs(p)}`);

  // "Find the mistake": steps shown in order, the student picks the first wrong one (or none).
  // bad = index of the wrong step, or -1 when the work is right.
  function findStep(steps, bad, whyWrong) {
    const choices = steps.map((_, i) => `Step ${i + 1}`).concat(["There is no mistake"]);
    const answer = bad < 0 ? steps.length : bad;
    const why = choices.map((_, i) => (i === answer ? "Correct." : i < steps.length && i !== bad ? `Step ${i + 1} is right.` : bad < 0 ? "Every step checks out." : whyWrong));
    return { choices, answer, why, think: true,
      stepsText: steps.map((t, i) => `**Step ${i + 1}.** ${t}`).join("<br>") };
  }

  M1.qlib = { findStep, lin, frac, pt, sample, box, terms2, quad, fac, clean, rng, gcd, fmt, tex, signed, mcq, multi, parseNum, arith, geom, terms, list, texList,

<script>/* content/unit-1-sequences/generators.js */
/* Unit 1 Sequences: question generators.
   Each generator: { id, skill, level, type, calc, make(r) } where make returns
   { key, prompt, ... } and every answer is computed here, never typed by hand. */
(function (G) {
  const M1 = G.M1;
  const { fmt, tex, signed, mcq, multi, arith, geom, terms, list, texList, paren,
    eqArithExplicit, eqGeomExplicit, eqArithRecursive, eqGeomRecursive, windowFor } = M1.qlib;

  const L = { B: "basic", I: "intermediate", H: "hard", C: "challenge" };
  const gens = [];
  const add = (g) => gens.push(g);
  const ordinal = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));

  // ───────────────────────── Growing patterns and expressions ─────────────────────────
  add({ id: "u1.pat.evaluate", skill: "u1.patterns", level: L.B, type: "numeric", calc: false,
    make(r) {
      const d = r.int(2, 6), c = r.int(1, 9), n = r.int(5, 12);
      return { key: [d, c, n],
        prompt: `A tile pattern has $${d}n + ${c}$ tiles in figure $n$. How many tiles are in figure ${n}?`,
        answer: d * n + c,
        hint: `Replace $n$ with ${n}.`,
        solution: `$${d}(${n}) + ${c} = ${d * n} + ${c} = \\mathbf{${d * n + c}}$` };
    } });

  add({ id: "u1.pat.table-expr", skill: "u1.patterns", level: L.I, type: "mcq", calc: false,
    make(r) {
      const d = r.int(2, 9), a = r.intNot(1, 15, [d]);
      const t = terms((n) => arith(a, d, n), 4);
      const c = a - d; // f(n) = dn + c
      const ex = (k) => (k === 0 ? `$${d}n$` : `$${d}n ${signed(k)}$`);
      const m = mcq(ex(c), [
        { text: ex(a), why: `This gives figure 1 = ${d + a}. The constant must make figure 1 equal ${a}.` },
        { text: `$${a}n ${signed(d)}$`, why: "This swaps the starting amount and the amount added each time." },
        { text: `$n ${signed(d)}$`, why: `The pattern grows by ${d} each figure, so the coefficient of $n$ is ${d}.` },
      ], r, [{ text: `$${d + 1}n ${signed(c - 1)}$`, why: `Check figure 2: this does not give ${t[1]}.` }]);
      return { key: [a, d], ...m,
        prompt: `The table shows the number of tiles in each figure of a pattern. Which expression gives the number of tiles in figure $n$?`,
        table: { headers: ["Figure n", "1", "2", "3", "4"], rows: [["Tiles", ...t.map(fmt)]] },
        hint: "How many tiles are added each time? That number multiplies $n$.",
        solution: `Tiles go up by ${d} each figure, so start with $${d}n$. For figure 1, $${d}(1) = ${d}$ but we need ${a}, so add ${c}.<br>Expression: $\\mathbf{${d}n ${c === 0 ? "" : signed(c)}}$` };
    } });

  add({ id: "u1.pat.border-multi", skill: "u1.patterns", level: L.H, type: "multi", calc: false,
    make(r) {
      const n = r.int(4, 9);
      const items = [
        { text: "$4n + 4$", ok: true },
        { text: "$4(n + 1)$", ok: true },
        { text: "$(n + 2)^2 - n^2$", ok: true },
        { text: "$2n + 2(n + 2)$", ok: true },
        { text: "$4n$", ok: false, why: "This misses the 4 corner tiles." },
        { text: "$(n + 2)^2$", ok: false, why: "This counts the inside squares too." },
        { text: "$4(n + 2)$", ok: false, why: "This counts each corner twice." },
      ];
      const pick = r.shuffle(items.filter((i) => i.ok)).slice(0, r.int(2, 3)).concat(r.shuffle(items.filter((i) => !i.ok)).slice(0, 2));
      const m = multi(pick, r);
      return { key: [n, m.choices.join("|")], ...m,
        prompt: `A square garden is $n$ by $n$ tiles. One row of border tiles goes all the way around it, including the corners. Select **all** expressions that give the number of border tiles.`,
        hint: `Try it with $n = ${n}$: draw it or count. Then test each expression.`,
        solution: `For $n = ${n}$ there are $4(${n}) + 4 = ${4 * n + 4}$ border tiles (4 sides of ${n} plus 4 corners). Each correct expression simplifies to $4n + 4$: $4(n+1)$, $(n+2)^2 - n^2 = 4n + 4$, $2n + 2(n+2) = 4n + 4$.` };
    } });

  add({ id: "u1.pat.which-figure", skill: "u1.patterns", level: L.C, type: "numeric", calc: false,
    make(r) {
      const d = r.int(3, 7), a = r.int(2, 10), k = r.int(15, 40);
      const f5 = arith(a, d, 5), target = arith(a, d, k);
      return { key: [a, d, k],
        prompt: `Figure 1 of a pattern has ${a} squares and figure 5 has ${f5} squares. The same number of squares is added each time. Which figure has exactly ${target} squares?`,
        answer: k,
        hint: "First find how many squares are added each time.",
        solution: `From figure 1 to figure 5 is 4 steps: $(${f5} - ${a}) \\div 4 = ${d}$ per step.<br>$${a} + ${d}(n - 1) = ${target}$ → $${d}(n-1) = ${target - a}$ → $n - 1 = ${k - 1}$ → $n = \\mathbf{${k}}$` };
    } });

  // ───────────────────────── Arithmetic sequences ─────────────────────────
  add({ id: "u1.ar.next", skill: "u1.arith", level: L.B, type: "numeric", calc: false,
    make(r) {
      const a = r.int(-10, 25), d = r.intNot(-9, 12, [0]);
      const t = terms((n) => arith(a, d, n), 5);
      return { key: [a, d],
        prompt: `What is the next term of this arithmetic sequence? $${texList(t.slice(0, 4))},\\ \\ldots$`,
        answer: t[4],
        hint: "Subtract any term from the one after it.",
        solution: `Common difference: $${t[1]} - ${t[0] < 0 ? "(" + t[0] + ")" : t[0]} = ${d}$. Next term: $${t[3]} ${signed(d)} = \\mathbf{${t[4]}}$` };
    } });

  add({ id: "u1.ar.diff", skill: "u1.arith", level: L.B, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-5, 30), d = r.intNot(-8, 9, [0, 1, -1]);
      const t = terms((n) => arith(a, d, n), 4);
      const m = mcq(fmt(d), [
        { text: fmt(-d), why: "Subtract an earlier term from a later one, not the other way around." },
        { text: fmt(t[1]), why: "That is the second term, not the change between terms." },
        { text: fmt(t[3] - t[0]), why: "That is the change over 3 steps. Divide by 3." },
      ], r, [{ text: fmt(d + 1), why: "Check the subtraction again." }]);
      return { key: [a, d], ...m,
        prompt: `What is the common difference of the sequence $${texList(t)},\\ \\ldots$?`,
        hint: "Common difference = (a term) − (the term before it).",
        solution: `$${t[1]} - ${paren(t[0])} = \\mathbf{${d}}$` };
    } });

  // ───────────────────────── Arithmetic, geometric or neither ─────────────────────────
  const KINDS = ["Arithmetic", "Geometric", "Neither"];
  function seqOfKind(r, kind) {
    if (kind === 0) { for (;;) { const a = r.int(-10, 20), d = r.intNot(-7, 9, [0]); const t = terms((n) => arith(a, d, n), 5); if (!t.includes(0)) return t; } }
    if (kind === 1) { const a = r.int(1, 6), rr = r.pick([2, 3, -2, -3, 4]); return terms((n) => geom(a, rr, n), 5); }
    const s = r.pick(["sq", "tri", "plus2", "fib"]);
    if (s === "sq") { const k = r.int(0, 3); return terms((n) => (n + k) ** 2, 5); }
    if (s === "tri") return terms((n) => (n * (n + 1)) / 2, 5);
    if (s === "plus2") { const a = r.int(1, 4); const out = [a]; for (let i = 1; i < 5; i++) out.push(2 * out[i - 1] + 1); return out; }
    const a = r.int(1, 3), b = r.int(2, 5); const out = [a, b]; for (let i = 2; i < 5; i++) out.push(out[i - 1] + out[i - 2]); return out;
  }

      const a = r.int(1, 9), rr = r.pick([2, 3, 4]), n = rr === 2 ? r.int(5, 10) : rr === 3 ? r.int(4, 7) : r.int(4, 6);
      const v = geom(a, rr, n);
      return { key: [a, rr, n],
        prompt: `The geometric sequence ${list(terms((k) => geom(a, rr, k), 3))}, … continues. Which term number is ${v}?`,
        answer: n,
        hint: `Keep multiplying by ${rr} and count the terms, or solve $${a} \\cdot ${rr}^{n-1} = ${v}$.`,
        solution: `$${v} \\div ${a} = ${v / a} = ${rr}^{${n - 1}}$, so $n - 1 = ${n - 1}$ and $n = \\mathbf{${n}}$` };
    } });

  add({ id: "u1.gr.read", skill: "u1.graphs", level: L.B, type: "numeric", calc: false,
    make(r) {
      const geo = r.chance(0.35);
      const a = geo ? r.int(1, 3) : r.int(-3, 9), d = geo ? 2 : r.intNot(-3, 4, [0]), k = r.int(2, 5);
      const pts = terms((n) => (geo ? geom(a, d, n) : arith(a, d, n)), 5).map((y, i) => [i + 1, y]);
      return { key: [geo, a, d, k],
        prompt: `The graph shows the first five terms of a sequence as points $(n, f(n))$. What is $f(${k})$?`,
        graph: { points: pts, window: windowFor(pts) },
        answer: pts[k - 1][1],
        hint: `Find the point with $n = ${k}$ and read its height.`,
        solution: `The point above $n = ${k}$ is $(${k}, ${pts[k - 1][1]})$, so $f(${k}) = \\mathbf{${pts[k - 1][1]}}$` };
    } });

  add({ id: "u1.gr.next-points", skill: "u1.graphs", level: L.I, type: "plot", calc: false,
    make(r) {
      const a = r.int(0, 6), d = r.int(1, 3);
      const all = terms((n) => arith(a, d, n), 6).map((y, i) => [i + 1, y]);
      return { key: [a, d],
        prompt: `The first four terms of an arithmetic sequence are $${list(all.slice(0, 4).map((p) => p[1]))}$. Plot terms 5 and 6 as points $(n, f(n))$.`,
        plot: { window: { xmin: 0, xmax: 7, ymin: 0, ymax: all[5][1] + 2, xstep: 1, ystep: 1 } },
        answer: all.slice(4),
        hint: `The terms go up by ${d} each time.`,
        solution: `$f(5) = ${all[4][1]}$ and $f(6) = ${all[5][1]}$, so plot $(5, ${all[4][1]})$ and $(6, ${all[5][1]})$.` };
    } });

  add({ id: "u1.de.recursive", skill: "u1.decrease", level: L.I, type: "numeric", calc: false,
    make(r) {
      const a = r.int(60, 200), d = r.int(3, 9), n = r.int(8, 15);
      return { key: [a, d, n],
        prompt: `A sequence is defined by $f(1) = ${a},\\ f(n) = f(n - 1) - ${d}$. What is $f(${n})$?`,
        answer: arith(a, -d, n),
        hint: `Each step subtracts ${d}. How many steps from term 1 to term ${n}?`,
        solution: `$f(${n}) = ${a} - ${d}(${n} - 1) = ${a} - ${d * (n - 1)} = \\mathbf{${arith(a, -d, n)}}$` };
    } });

  add({ id: "u1.de.halving", skill: "u1.decrease", level: L.C, type: "numeric", calc: true,
    make(r) {
      const start = r.pick([400, 800, 1600, 3200, 640, 960]), period = r.pick([2, 3, 4, 6, 8]), limit = r.pick([10, 25, 50, 100]);
      let k = 0, amt = start; while (amt >= limit) { amt /= 2; k++; }
      return { key: [start, period, limit],
        prompt: `A patient has ${start} mg of a medicine in their body. The amount is cut in half every ${period} hours. After how many hours is the amount first below ${limit} mg?`,
        answer: k * period,
        hint: "Halve the amount again and again, counting the halvings. Then multiply by the hours per halving.",
        solution: `Halvings: ${Array.from({ length: k + 1 }, (_, i) => String(+(start / 2 ** i).toFixed(3))).join(" → ")} mg. That's ${k} halvings, so $${k} \\times ${period} = \\mathbf{${k * period}}$ hours.` };
    } });

  add({ id: "u1.mi.insert-means", skill: "u1.missing", level: L.C, type: "numeric", calc: false,
    make(r) {
      const a = r.int(-20, 30), d = r.intNot(-9, 12, [0]), gaps = r.int(3, 5), ask = r.int(2, gaps);
      const last = arith(a, d, gaps + 1);
      return { key: [a, d, gaps, ask],
        prompt: `Write ${gaps - 1} numbers between ${a} and ${last} so that all ${gaps + 1} numbers form an arithmetic sequence. What is the ${ordinal(ask)} number of the sequence?`,
        answer: arith(a, d, ask),
        hint: `There are ${gaps} equal steps from ${a} to ${last}.`,
        solution: `$d = (${last} - ${paren(a)}) \\div ${gaps} = ${d}$. Term ${ask}: $${a} ${signed(d)}(${ask - 1}) = \\mathbf{${arith(a, d, ask)}}$` };
    } });

  // ───────────────────────── Thinking questions ─────────────────────────
  // Find the mistake: a worked solution for a term of an arithmetic sequence.
  add({ id: "u1.th.find-error", skill: "u1.arith", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-9, 15), d = r.intNot(-6, 9, [0, 1, -1]), N = r.int(12, 40), kind = r.int(0, 3);
      const t2 = a + d, t3 = a + 2 * d, right = arith(a, d, N);
      const dd = kind === 0 ? -d : d;
      const s1 = `$d = ${paren(kind === 0 ? a : t2)} - ${paren(kind === 0 ? t2 : a)} = ${dd}$`;
      const s2 = kind === 1 ? `$f(n) = ${a} ${signed(d)}n$` : `$f(n) = ${a} ${signed(dd)}(n - 1)$`;
      const val = kind === 0 ? arith(a, -d, N) : kind === 1 ? a + d * N : kind === 2 ? right + r.pick([-10, 10, d * 2]) : right;
      const s3 = kind === 1 ? `$f(${N}) = ${a} ${signed(d)}(${N}) = ${val}$` : `$f(${N}) = ${a} ${signed(dd)}(${N - 1}) = ${val}$`;
      const bad = kind === 3 ? -1 : kind;
      const whyWrong = ["The difference is the later term minus the earlier term.", "The explicit form uses $(n - 1)$, because term 1 adds no differences.", "The arithmetic in the last step is off."][Math.max(0, bad)];
      const f = M1.qlib.findStep([s1, s2, s3], bad, whyWrong);
      return { key: [a, d, N, kind, val], choices: f.choices, answer: f.answer, why: f.why, think: true,
        prompt: `Jordan found the ${ordinal(N)} term of $${a}, ${t2}, ${t3}, \\ldots$ like this:<br>${f.stepsText}<br>Where is Jordan's first mistake?`,
        hint: "Check each step on its own.",
        solution: `$d = ${t2} - ${paren(a)} = ${d}$, $f(n) = ${a} ${signed(d)}(n - 1)$, so $f(${N}) = ${a} ${signed(d)}(${N - 1}) = ${right}$.<br>` +
          (bad < 0 ? "**There is no mistake.**" : `The first mistake is in **Step ${bad + 1}**. ${whyWrong}`) };
    } });

  // Is a number a term? Pick the answer with the right reason.
  add({ id: "u1.th.is-term", skill: "u1.missing", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(2, 12), d = r.int(3, 9), T = r.int(80, 400);
      if (T <= a) throw new Error("retry");
      const yes = (T - a) % d === 0, gap = T - a;
      const Y = `Yes, because $${T} - ${a} = ${gap}$ is a multiple of ${d}.`;
      const N = `No, because $${T} - ${a} = ${gap}$ is not a multiple of ${d}.`;
      const m = mcq(yes ? Y : N, [
        { text: yes ? N : Y, why: `$${gap} \\div ${d} = ${fmt(gap / d)}$, ${yes ? "a whole number" : "not a whole number"}.` },
        { text: `Yes, because ${T} is greater than ${a}.`, why: "Being bigger than the first term is not enough. The sequence skips numbers." },
        { text: `No, because ${T} is not one of the first ten terms.`, why: "A term can come much later. Check the gap from the first term." },
        { text: T % d ? `Yes, because ${T} is a multiple of ${d}.`.replace("is a", "is close to a") : `No, because the sequence starts at ${a}, not 0.`, why: `The test is whether $${T} - ${a}$ is a multiple of ${d}.` },
      ], r);
      return { key: [a, d, T], ...m, think: true,
        prompt: `Is ${T} a term of the sequence $${a}, ${a + d}, ${a + 2 * d}, \\ldots$? Pick the answer with the correct reason.`,
        hint: "Every term is the first term plus some number of steps.",
        solution: `Each term is ${a} plus a whole number of ${d}s. $${T} - ${a} = ${gap}$, and $${gap} \\div ${d} = ${fmt(gap / d)}$. ${yes ? `That is a whole number, so ${T} **is** a term (term ${gap / d + 1}).` : `That is not a whole number, so ${T} is **not** a term.`}` };
    } });

  // What changes if the first term is scaled?
  add({ id: "u1.th.what-if", skill: "u1.geom", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(2, 9), g = r.pick([2, 3, -2]), k = r.pick([2, 3, 4, 5, 10]), N = r.int(5, 9);
      const m = mcq(`It is multiplied by ${k}.`, [
        { text: `It increases by ${k}.`, why: `Every term is multiplied by ${k}, so the change is not a fixed amount.` },
        { text: `It is multiplied by $${k}^{${N - 1}}$.`, why: `The ratio stays ${g}. Only the starting value is ${k} times as big.` },
        { text: `It is multiplied by ${k * N}.`, why: "Each term is the first term times the same power of the ratio as before." },
      ], r, [{ text: "It stays the same.", why: "The first term is a factor of every term." }]);
      return { key: [a, g, k, N], ...m, think: true,
        prompt: `A geometric sequence has $f(n) = ${a} \\cdot ${paren(g)}^{n - 1}$. The first term is changed from ${a} to ${a * k}, and the ratio stays the same. What happens to the ${ordinal(N)} term?`,
        hint: "Write the term before and after the change.",
        solution: `Before: $${a} \\cdot ${paren(g)}^{${N - 1}}$. After: $${a * k} \\cdot ${paren(g)}^{${N - 1}} = ${k} \\cdot \\left(${a} \\cdot ${paren(g)}^{${N - 1}}\\right)$. The term is **multiplied by ${k}**.` };
    } });

  // Make it true: choose a common difference that lands on a target.
  add({ id: "u1.th.make-true", skill: "u1.arith", level: L.C, type: "numeric", calc: false,
    make(r) {
      const a = r.int(1, 15), gap = r.pick([24, 30, 36, 40, 42, 48, 60, 72, 84, 90]), T = a + gap;
      const ds = []; for (let d = 2; d <= gap; d++) if (gap % d === 0) ds.push(d);
      return { key: [a, gap], answer: ds[0], accept: { in: ds }, think: true,
        prompt: `An arithmetic sequence starts at ${a} and has a common difference $d$ that is a whole number greater than 1. Give **one** value of $d$ that makes ${T} a term of the sequence.`,
        hint: `How far is ${T} from ${a}?`,
        solution: `${T} must be ${a} plus a whole number of steps: $${T} - ${a} = ${gap}$ must be a multiple of $d$. Any factor of ${gap} greater than 1 works: **${ds.join(", ")}**.` };
    } });

  // Always, sometimes or never: answer with a reason.
  const U1_ASN = [
    { s: "An arithmetic sequence with a positive common difference eventually has a term greater than 1,000.",
      right: "Always true: adding the same positive amount again and again passes any number.",
      wrong: ["Sometimes true: only if the first term is positive.", "Never true: the terms grow by the same amount, so they stay small.", "Sometimes true: only if the difference is at least 10."] },
    { s: "A geometric sequence with a negative common ratio has only negative terms.",
      right: "Never true: the signs switch back and forth, as in $1, -2, 4, -8$.",
      wrong: ["Always true: multiplying by a negative makes the terms negative.", "Sometimes true: only when the first term is negative.", "Always true: the ratio is negative, so every term is too."] },
    { s: "A sequence can be both arithmetic and geometric.",
      right: "Sometimes true: $5, 5, 5, \\ldots$ has difference 0 and ratio 1.",
      wrong: ["Never true: one adds and the other multiplies.", "Always true: every sequence has a difference and a ratio.", "Never true: a ratio of 1 is not allowed."] },
    { s: "If the first term and the common difference of an arithmetic sequence are both odd, every term is odd.",
      right: "Never true: the second term is odd + odd, which is even.",
      wrong: ["Always true: odd numbers stay odd.", "Sometimes true: only when the difference is 1.", "Sometimes true: only for the first few terms."] },
    { s: "A geometric sequence with a positive first term and a ratio between 0 and 1 eventually has a negative term.",
      right: "Never true: multiplying a positive number by a positive ratio stays positive. The terms get closer to 0.",
      wrong: ["Always true: the terms keep shrinking, so they pass 0.", "Sometimes true: only if the ratio is less than $\\frac{1}{2}$.", "Sometimes true: only after many terms."] },
    { s: "The terms of an arithmetic sequence with common difference 3 are all multiples of 3.",
      right: "Sometimes true: $3, 6, 9, \\ldots$ works, but $1, 4, 7, \\ldots$ does not.",
      wrong: ["Always true: you keep adding 3.", "Never true: adding 3 changes the remainder.", "Always true: the difference is a multiple of 3."] },
    { s: "If the first two terms of a geometric sequence are whole numbers, the common ratio is a whole number.",
      right: "Sometimes true: $2, 6, \\ldots$ has ratio 3, but $4, 6, \\ldots$ has ratio $\\frac{3}{2}$.",
      wrong: ["Always true: whole numbers divide to whole numbers.", "Never true: a ratio is always a fraction.", "Always true: the second term is the first term times the ratio."] },
  ];
  add({ id: "u1.th.always", skill: "u1.classify", level: L.C, type: "mcq", calc: false,
    make(r) {
      const i = r.int(0, U1_ASN.length - 1), it = U1_ASN[i];
      const m = mcq(it.right, it.wrong.map((t) => ({ text: t, why: "Test it with a few examples. " + it.right })), r);
      return { key: [i], ...m, think: true,
        prompt: `Is this statement always true, sometimes true, or never true?<br>"${it.s}"`,
        hint: "Try a few examples, including unusual ones.",
        solution: `**${it.right}**` };
    } });

  M1.units.u1 = Object.assign(M1.units.u1 || {}, { generators: gens });
})(typeof window !== "undefined" ? window : globalThis);

</script>

    { id: "u1b06", skill: "u1.context", level: "challenge", type: "numeric", calc: true, lesson: 5, standard: "NC.M1.F-BF.2", answer: 6,

<script>/* content/unit-2-linear-exponential/generators.js */
/* Unit 2 Linear & Exponential Functions: question generators.
   Each generator: { id, skill, level, type, calc, make(r) } where make returns
   { key, prompt, ... } and every answer is computed here, never typed by hand. */
(function (G) {
  const M1 = G.M1;
  const { fmt, tex, signed, mcq, multi, gcd, windowFor } = M1.qlib;

  const L = { B: "basic", I: "intermediate", H: "hard", C: "challenge" };
  const gens = [];
  const add = (g) => gens.push(g);

  // Decimals as typed (1.05 stays 1.05, not 21/20).
  const dec = (x) => String(+(+x).toFixed(6));
  const commas = (s) => s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  const money = (x) => "\\$" + (Number.isInteger(x) ? commas(String(x)) : x.toFixed(2));
  // Linear expression mx + b in KaTeX: handles m = ±1, b = 0 and fractions.
  function lin(m, b, v = "x") {
    if (m === 0) return tex(b);
    const mt = m === 1 ? "" : m === -1 ? "-" : tex(m);
    return `${mt}${v}${b === 0 ? "" : " " + signed(b)}`;
  }
  // a·b^x with the base always in parentheses.
  // Unit fractions (1/2, 1/3, 1/4) show as fractions; other bases as decimals.
  const base = (b) => ([1 / 2, 1 / 3, 1 / 4].some((f) => Math.abs(f - b) < 1e-12) ? tex(b) : dec(b));
  const expo = (a, b, v = "x") => (a === 1 && Number.isInteger(b) ? `${b}^{${v}}` : `${a === 1 ? "" : tex(a)}\\left(${base(b)}\\right)^{${v}}`);
  const frac = (n, d) => { // n/d reduced, as KaTeX
    const g = gcd(n, d), s = (n < 0) !== (d < 0) ? "-" : "";
    const N = Math.abs(n) / g, D = Math.abs(d) / g;
    return D === 1 ? `${s}${N}` : `${s}\\frac{${N}}{${D}}`;
  };
  const pt = (p) => `(${fmt(p[0])}, ${fmt(p[1])})`;
  const setTex = (lo, hi) => (hi - lo <= 5 ? `\\{${Array.from({ length: hi - lo + 1 }, (_, i) => lo + i).join(", ")}\\}` : `\\{${lo}, ${lo + 1}, ${lo + 2}, \\ldots, ${hi}\\}`);

  // ───────────────────────── Discrete vs continuous, domain ─────────────────────────
  const DISCRETE = [
    (r) => { const p = r.int(6, 15); return [`$C(n)$ is the cost of buying $n$ movie tickets at ${money(p)} each.`, p]; },
    (r) => { const k = r.int(8, 30); return [`$S(n)$ is the number of chairs in $n$ rows when each row has ${k} chairs.`, k]; },
    (r) => { const k = r.int(2, 9); return [`$P(w)$ is the number of push-ups done after $w$ workouts of ${k * 5} push-ups each.`, k]; },
    (r) => { const k = r.int(3, 12); return [`$T(b)$ is the number of tennis balls in $b$ cans that hold ${k} balls each.`, k]; },
    (r) => { const k = r.int(20, 60); return [`$M(s)$ is the money earned for working $s$ shifts at ${money(k * 2)} per shift.`, k]; },
    (r) => { const k = r.int(2, 6); return [`$B(n)$ is the number of bacteria colonies after $n$ full days when the number of colonies is multiplied by ${k} each day.`, k]; },
  ];
  const CONTINUOUS = [
    (r) => { const k = r.int(2, 8); return [`$h(t)$ is the height of a candle $t$ hours after it is lit, if it burns ${k} cm per hour.`, k]; },
    (r) => { const k = r.int(3, 15); return [`$V(t)$ is the water in a tank $t$ minutes after it starts filling at ${k} gallons per minute.`, k]; },
    (r) => { const k = r.int(35, 70); return [`$d(t)$ is the distance a car has traveled $t$ hours after leaving, at ${k} miles per hour.`, k]; },
    (r) => { const k = r.int(10, 40); return [`$A(t)$ is the altitude of a plane $t$ seconds after takeoff, climbing ${k} feet per second.`, k]; },
    (r) => { const k = r.int(2, 9); return [`$R(x)$ is the cost of $x$ pounds of rice scooped from a bulk bin at ${money(k)} per pound.`, k]; },
    (r) => { const k = r.int(5, 20); return [`$G(m)$ is the gas left in a tank after a car drives $m$ miles, using 1 gallon every ${k} miles.`, k]; },
  ];
  const situ = (r, discrete) => { const pool = discrete ? DISCRETE : CONTINUOUS, i = r.int(0, pool.length - 1); const [text, k] = pool[i](r); return { text, key: [discrete, i, k] }; };

  add({ id: "u2.di.classify", skill: "u2.discrete", level: L.B, type: "mcq", calc: false,
    make(r) {
      const disc = r.chance(0.5), s = situ(r, disc);
      const D = "Discrete: only whole-number inputs make sense.", C = "Continuous: every input in an interval makes sense.";
      const m = mcq(disc ? D : C, [
        { text: disc ? C : D, why: disc ? "You cannot have part of one of these inputs, so the inputs are whole numbers." : "The input is time or an amount that can be any value, not just whole numbers." },
        { text: "Discrete, because the outputs keep going up.", why: "Going up or down does not decide it. Ask which inputs make sense." },
        { text: "Continuous, because the outputs can be large numbers.", why: "The size of the outputs does not decide it. Ask which inputs make sense." },
      ], r);
      return { key: s.key, ...m,
        prompt: `${s.text} Is this function discrete or continuous?`,
        hint: "Look at the input. Does a value like 2.5 make sense for it?",
        solution: disc ? `The input counts whole things, so 2.5 of them makes no sense. The function is **discrete**.` : `The input can be any value in an interval, like 2.5. The function is **continuous**.` };
    } });

  add({ id: "u2.di.in-domain", skill: "u2.discrete", level: L.B, type: "mcq", calc: false,
    make(r) {
      const p = r.int(4, 15), n = r.int(2, 12), half = r.int(1, 9) + 0.5;
      const item = r.pick(["concert tickets", "pizzas", "notebooks", "bus passes"]);
      const m = mcq(String(n), [
        { text: dec(half), why: `You cannot buy ${dec(half)} ${item}.` },
        { text: String(-r.int(1, 5)), why: "You cannot buy a negative number of items." },
        { text: `\\$${p * n + p}`, why: "That is a cost, an output. The domain is the inputs: numbers of items." },
      ], r);
      return { key: [p, n, half, item], ...m,
        prompt: `$C(n) = ${p}n$ gives the cost, in dollars, of buying $n$ ${item}. Which value is in the domain of $C$?`,
        hint: "The domain is the set of inputs that make sense. Here the input is the number of items bought.",
        solution: `The input $n$ must be a whole number of ${item}, 0 or more. Only **${n}** works.` };
