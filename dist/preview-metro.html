  add({ id: "u2.di.domain-cont", skill: "u2.discrete", level: L.I, type: "mcq", calc: false,
    make(r) {
      const rate = r.pick([5, 10, 15, 20, 25, 40]), T = r.int(6, 30), V0 = rate * T;
      const m = mcq(`$0 \\le t \\le ${T}$`, [
        { text: `$${setTex(0, T)}$`, why: "Time can be any value, like 2.5 minutes, so the domain is not just whole numbers." },
        { text: `$0 \\le t \\le ${V0}$`, why: `${V0} is the starting amount of water, an output, not a time.` },
        { text: "$t \\ge 0$", why: `The tank is empty after ${T} minutes, so the model stops there.` },
      ], r);
      return { key: [rate, T], ...m,
        prompt: `A tank holds ${V0} gallons of water. It drains at ${rate} gallons per minute until it is empty. $V(t) = ${V0} - ${rate}t$ is the water left after $t$ minutes. What is the domain of $V$?`,
        hint: "When does the tank become empty? Can $t$ be a decimal?",
        solution: `The tank is empty when $${V0} - ${rate}t = 0$, so $t = ${T}$. Time can be any value from 0 to ${T}: **$0 \\le t \\le ${T}$**.` };
    } });

  add({ id: "u2.di.select-discrete", skill: "u2.discrete", level: L.I, type: "multi", calc: false,
    make(r) {
      const nD = r.int(2, 3), nC = 5 - nD;
      const di = r.shuffle(DISCRETE.map((_, i) => i)).slice(0, nD), ci = r.shuffle(CONTINUOUS.map((_, i) => i)).slice(0, nC);
      const items = di.map((i) => ({ text: DISCRETE[i](r)[0], ok: true }))
        .concat(ci.map((i) => ({ text: CONTINUOUS[i](r)[0], ok: false, why: "The input can be any value in an interval, so this is continuous." })));
      const m = multi(items, r);
      return { key: m.choices, ...m,
        prompt: "Select **all** functions that are discrete.",
        hint: "For each one, ask: can the input be a value like 2.5?",
        solution: "A function is discrete when only whole-number inputs make sense (tickets, rows, cans, shifts, full days). Time, distance and amounts of liquid can be any value, so those are continuous." };
    } });

  add({ id: "u2.di.count-domain", skill: "u2.discrete", level: L.H, type: "numeric", calc: false,
    make(r) {
      const p = r.int(5, 15), B = r.int(4, 12) * p + r.int(0, p - 1);
      const k = Math.floor(B / p);
      const who = r.pick(["Jada", "Malik", "Priya", "Owen"]);
      return { key: [p, B],
        prompt: `${who} has ${money(B)} to spend on comic books that cost ${money(p)} each. $C(n) = ${p}n$ is the cost of buying $n$ comic books. ${who} could also buy none. How many values are in the domain of $C$?`,
        answer: k + 1,
        hint: `Find the greatest number of books ${who} can afford. Do not forget 0.`,
        solution: `$${B} \\div ${p} ${B % p ? "\\approx" : "="} ${dec(+(B / p).toFixed(2))}$, so the most books is ${k}. The domain is $${setTex(0, k)}$, which has $${k} + 1 = \\mathbf{${k + 1}}$ values.` };
    } });

  add({ id: "u2.di.domain-discrete", skill: "u2.discrete", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(10, 24), d = r.int(1, 4), R = r.int(15, 40);
      const m = mcq(`$${setTex(1, R)}$`, [
        { text: `$1 \\le n \\le ${R}$`, why: "There is no row 2.5. Only whole-number rows make sense." },
        { text: `$${setTex(0, R)}$`, why: "Row numbers start at 1. There is no row 0." },
        { text: `$\\{${a}, ${a + d}, ${a + 2 * d}, \\ldots, ${a + d * (R - 1)}\\}$`, why: "These are the numbers of seats, the outputs. That is the range." },
      ], r);
      return { key: [a, d, R], ...m,
        prompt: `A theater has ${R} rows. Row 1 has ${a} seats and each row has ${d} more seat${d > 1 ? "s" : ""} than the row before. $S(n)$ is the number of seats in row $n$. What is the domain of $S$?`,
        hint: "The input is the row number. Which row numbers exist?",
        solution: `The inputs are row numbers 1 through ${R}, whole numbers only: **$${setTex(1, R)}$**.` };
    } });

  add({ id: "u2.di.graph-domain", skill: "u2.discrete", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const k = r.int(3, 5), a = r.int(1, 6), d = r.int(1, 3);
      const pts = Array.from({ length: k + 1 }, (_, x) => [x, a + d * x]);
      const m = mcq(`$${setTex(0, k)}$`, [
        { text: `$0 \\le x \\le ${k}$`, why: "The graph is separate points, not a solid line, so only those x-values are in the domain." },
        { text: `$\\{${pts.map((p) => p[1]).join(", ")}\\}$`, why: "These are the y-values. That is the range." },
        { text: "All real numbers", why: "Only the x-values of the points shown are inputs." },
      ], r);
      return { key: [k, a, d], ...m,
        prompt: "The graph shows **all** the points of a function $f$. What is the domain of $f$?",
        graph: { points: pts, window: windowFor(pts) },
        hint: "The domain is the list of x-values. Is the graph separate points or a solid line?",
        solution: `The points have x-values ${pts.map((p) => p[0]).join(", ")}. The domain is **$${setTex(0, k)}$**.` };
    } });

  add({ id: "u2.di.range-min", skill: "u2.discrete", level: L.C, type: "numeric", calc: false,
    make(r) {
      const p = r.int(3, 9), B = r.int(5, 15) * p + r.int(1, p - 1);
      const k = Math.floor(B / p);
      return { key: [p, B],
        prompt: `A transit card has ${money(B)} on it. Each ride costs ${money(p)}. $R(n) = ${B} - ${p}n$ is the money left after $n$ rides. A ride is only allowed if the card has enough money for it. What is the **smallest** value in the range of $R$?`,
        answer: B - p * k,
        hint: "Find the greatest number of rides allowed. Then find the money left.",
        solution: `$${B} \\div ${p}$ is ${k} with some left over, so the most rides is ${k}. $R(${k}) = ${B} - ${p}(${k}) = \\mathbf{${B - p * k}}$ dollars.` };
    } });

  add({ id: "u2.di.domain-range", skill: "u2.discrete", level: L.C, type: "mcq", calc: false,
    make(r) {
      const rate = r.int(2, 6), T = r.int(4, 12), H = rate * T;
      const m = mcq(`Domain: $0 \\le t \\le ${T}$; range: $0 \\le h \\le ${H}$`, [
        { text: `Domain: $0 \\le t \\le ${H}$; range: $0 \\le h \\le ${T}$`, why: "This swaps the inputs (hours) and the outputs (height)." },
        { text: `Domain: $${setTex(0, T)}$; range: $\\{0, ${rate}, ${2 * rate}, \\ldots, ${H}\\}$`, why: "Time and height can be decimals. The candle keeps burning between whole hours." },
        { text: `Domain: $t \\ge 0$; range: $h \\le ${H}$`, why: "The candle is gone after the height reaches 0, and the height cannot be negative." },
      ], r);
      return { key: [rate, T], ...m,
        prompt: `A candle is ${H} cm tall. It burns down ${rate} cm each hour until it is gone. $h(t) = ${H} - ${rate}t$. Which gives the domain and range of $h$ for this situation?`,
        hint: "Find when the candle is gone. Then think about which inputs and outputs make sense.",
        solution: `$h(t) = 0$ when $t = ${H} \\div ${rate} = ${T}$. Time runs from 0 to ${T} hours and the height goes from ${H} down to 0, including every value in between: **domain $0 \\le t \\le ${T}$, range $0 \\le h \\le ${H}$**.` };
    } });

  // ───────────────────────── Linear vs exponential ─────────────────────────
  const TYPE3 = ["Linear", "Exponential", "Neither", "Both linear and exponential"];
  function tableOfKind(r, kind) {
    if (kind === 0) { const b = r.int(-5, 20), m = r.intNot(-6, 9, [0]); return { key: [kind, b, m], y: [0, 1, 2, 3].map((x) => b + m * x) }; }
    if (kind === 1) { const a = r.int(1, 8), g = r.pick([2, 3, 4, 1 / 2]); const a2 = g === 1 / 2 ? a * 8 : a; return { key: [kind, a2, g], y: [0, 1, 2, 3].map((x) => a2 * g ** x) }; }
    const a = r.int(0, 5), s = r.int(1, 3); return { key: [kind, a, s], y: [0, 1, 2, 3].map((x) => s * x * x + a) };
  }

  add({ id: "u2.le.table-type", skill: "u2.linexp", level: L.B, type: "mcq", calc: false,
    make(r) {
      const kind = r.int(0, 2), t = tableOfKind(r, kind);
      const why = ["Linear functions add the same amount each time x goes up by 1.", "Exponential functions multiply by the same factor each time x goes up by 1.",
        "Check both the differences and the ratios.", "Only a constant function changes by the same amount and the same factor."];
      const diffs = t.y.slice(1).map((v, i) => v - t.y[i]);
      const ratios = t.y.slice(1).map((v, i) => (t.y[i] === 0 ? "none (cannot divide by 0)" : `$${frac(v, t.y[i])}$`));
      return { key: t.key, choices: TYPE3, answer: kind, why: why.map((w, i) => (i === kind ? "Correct." : w)),
        prompt: "Is the function in the table linear, exponential, or neither?",
        table: { headers: ["$x$", "0", "1", "2", "3"], rows: [["$y$", ...t.y.map(fmt)]] },
        hint: "Find the differences between y-values. Then find the ratios.",
        solution: `Differences: ${diffs.map(fmt).join(", ")}. Ratios: ${ratios.join(", ")}.<br>**${TYPE3[kind]}**${kind === 2 ? ": neither the differences nor the ratios stay the same." : "."}` };
    } });

  const LIN_STORIES = [
    (r) => `A plant grows ${r.int(2, 6)} cm each week.`,
    (r) => `A pool drains ${r.int(2, 9) * 10} gallons each minute.`,
    (r) => `A savings account gets ${money(r.int(2, 9) * 5)} added each month.`,
    (r) => `A taxi charges ${money(r.int(2, 4))} plus ${money(r.int(2, 3))} for each mile.`,
    (r) => `A phone's battery loses ${r.int(2, 9)} percentage points of charge every hour.`,
  ];
  const EXP_STORIES = [
    (r) => `A town's population grows by ${r.int(2, 9)}% each year.`,
    (r) => `A car loses ${r.int(10, 25)}% of its value each year.`,
    (r) => `The number of views on a video triples every ${r.int(2, 6)} days.`,
    (r) => `A medicine in the body is cut in half every ${r.int(3, 8)} hours.`,
    (r) => `A bank account earns ${r.int(2, 6)}% interest on its balance each year.`,
  ];

  add({ id: "u2.le.story-type", skill: "u2.linexp", level: L.B, type: "mcq", calc: false,
    make(r) {
      const exp = r.chance(0.5), i = r.int(0, 4), text = (exp ? EXP_STORIES : LIN_STORIES)[i](r);
      const Lt = "Linear: it changes by the same amount each step.", Et = "Exponential: it changes by the same factor (percent) each step.";
      const m = mcq(exp ? Et : Lt, [
        { text: exp ? Lt : Et, why: exp ? "A percent of a changing amount is not the same amount each time." : "Adding or subtracting a fixed amount is linear." },
        { text: "Exponential, because the amount gets larger.", why: "Linear functions can get larger too. Ask: same amount, or same factor?" },
        { text: "Linear, because it happens at regular times.", why: "Both kinds can change at regular times. Ask: same amount, or same factor?" },
      ], r);
      return { key: [exp, i, text], ...m,

        hint: "Is the same amount added each step, or is the amount multiplied by the same factor?",
        solution: exp ? "A percent (or a doubling, tripling, halving) multiplies by the same factor each step: **exponential**." : "The same amount is added or subtracted each step: **linear**." };
    } });

  add({ id: "u2.le.select-exp", skill: "u2.linexp", level: L.I, type: "multi", calc: false,
    make(r) {
      const nE = r.int(2, 3);

      const ls = r.shuffle([0, 1, 2, 3, 4]).slice(0, 5 - nE).map((i) => ({ text: LIN_STORIES[i](r), ok: false, why: "The same amount is added or taken away each step, so this is linear." }));
      const m = multi(es.concat(ls), r);
      return { key: m.choices, ...m,
        prompt: "Select **all** situations that an exponential function models.",
        hint: "Exponential means multiplying by the same factor each step. Percents, doubling and halving are factors.",
        solution: "Growing or shrinking by a percent, tripling, or halving multiplies by the same factor: **exponential**. Adding or taking away a fixed amount is linear." };
    } });

  add({ id: "u2.le.graph-type", skill: "u2.linexp", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const exp = r.chance(0.5);
      let pts, key;
      if (exp) { const a = r.int(1, 3), g = r.pick([2, 3]), n = g === 3 ? 3 : 4; pts = Array.from({ length: n + 1 }, (_, x) => [x, a * g ** x]); key = [1, a, g]; }
      else { const b = r.int(1, 6), m = r.int(2, 6); pts = Array.from({ length: 5 }, (_, x) => [x, b + m * x]); key = [0, b, m]; }
      const Lt = "Linear: the y-values go up by the same amount each step.", Et = "Exponential: the y-values are multiplied by the same factor each step.";
      const m = mcq(exp ? Et : Lt, [
        { text: exp ? Lt : Et, why: exp ? "Check the differences: they grow, so it is not linear." : "Check the ratios: they are not the same, so it is not exponential." },
        { text: "Linear, because the points go up from left to right.", why: "Both kinds can go up. Compare the differences and ratios." },
        { text: "Exponential, because every y-value is positive.", why: "Being positive does not decide it. Compare the differences and ratios." },
      ], r);
      const ys = pts.map((p) => p[1]);
      return { key, ...m,
        prompt: "The graph shows points of a function. Which describes the function?",
        graph: { points: pts, window: windowFor(pts) },
        hint: "Read the y-values. Find the differences and the ratios.",
        solution: `y-values: ${ys.join(", ")}. Differences: ${ys.slice(1).map((v, i) => v - ys[i]).join(", ")}. Ratios: ${ys.slice(1).map((v, i) => `$${frac(v, ys[i])}$`).join(", ")}.<br>**${exp ? "Exponential" : "Linear"}**.` };
    } });

  add({ id: "u2.le.overtake", skill: "u2.linexp", level: L.H, type: "numeric", calc: true,
    make(r) {
      for (;;) {
        const a = r.int(5, 20) * 10, m = r.int(2, 10) * 10, c = r.pick([1, 2, 3, 5]);

          answer: x,
          hint: "Make a table: day, Plan A $= " + a + " + " + m + "d$, Plan B $= " + c + " \\cdot 2^d$.",
          solution: `Day ${x - 1}: A $= ${a + m * (x - 1)}$, B $= ${c * 2 ** (x - 1)}$ (A is ahead).<br>Day ${x}: A $= ${a + m * x}$, B $= ${c * 2 ** x}$ (B is ahead). Answer: day **${x}**.` };
      }
    } });

  add({ id: "u2.le.factor-gap", skill: "u2.linexp", level: L.H, type: "mcq", calc: false,
    make(r) {
      const a = r.int(1, 5), g = r.pick([2, 3]), s = 2;
      const y = [0, 1, 2, 3].map((k) => a * g ** (s * k));
      const m = mcq(String(g), [
        { text: String(g * g), why: "That is the factor for 2 steps of x, not 1." },
        { text: String((y[1] - y[0]) / 2), why: "That divides a difference by 2, which is linear thinking." },
        { text: fmt((g * g) / 2), why: "Dividing the 2-step factor by 2 does not undo multiplying twice. Take the square root." },
      ], r, [{ text: String(g + 1), why: "Check: multiplying by this twice does not give the 2-step factor." },
        { text: String(2 * g * g), why: "That is more than the factor for 2 steps. Take the square root of the 2-step factor." }]);
      return { key: [a, g], ...m,
        prompt: "The table shows an exponential function. By what factor does $y$ change each time $x$ goes up by **1**?",
        table: { headers: ["$x$", "0", "2", "4", "6"], rows: [["$y$", ...y.map(fmt)]] },
        hint: "From $x = 0$ to $x = 2$ the y-value is multiplied by the factor twice.",
        solution: `From $x = 0$ to $x = 2$: $${y[1]} \\div ${y[0]} = ${g * g}$. That is two steps, so $b^2 = ${g * g}$ and $b = \\mathbf{${g}}$.` };
    } });

  add({ id: "u2.le.eventually", skill: "u2.linexp", level: L.C, type: "mcq", calc: false,
    make(r) {

      choices: ["$C(n)$: the cost of $n$ concert tickets", "$h(t)$: the height of a kite $t$ seconds after launch", "$P(s)$: the total pay for $s$ shifts worked", "$W(m)$: the water in a tub $m$ minutes after the drain is opened", "$N(t)$: the number of people in a store $t$ minutes after it opens"],

<script>/* content/unit-3-features-of-functions/generators.js */
/* Unit 3 Features of Functions: question generators.
   Each generator: { id, skill, level, type, calc, make(r) } where make returns
   { key, prompt, ... } and every answer is computed here, never typed by hand. */
(function (G) {
  const M1 = G.M1;
  const { fmt, tex, signed, mcq, multi, lin, pt, box, findStep, paren } = M1.qlib;

  const L = { B: "basic", I: "intermediate", H: "hard", C: "challenge" };
  const gens = [];
  const add = (g) => gens.push(g);
  const W = box(-7, 7);

  // ── Piecewise-linear graphs with whole-number corners ──
  // Corners alternate up and down, so every piece is one increasing or decreasing run.
  function zigzag(r, { pieces = r.int(3, 4), withZero = false } = {}) {
    for (let tries = 0; tries < 2000; tries++) {
      const pool = [];
      for (let x = -6; x <= 6; x++) pool.push(x);
      let xs = r.shuffle(pool).slice(0, pieces + 1).sort((a, b) => a - b);
      if (withZero && !xs.includes(0)) continue;
      if (xs.some((x, i) => i && x - xs[i - 1] < 2)) continue;
      let up = r.chance(0.5), y = r.int(-4, 4);
      const ys = [y];
      let ok = true;
      for (let i = 1; i < xs.length; i++) {
        const step = r.int(2, 6);
        y = up ? y + step : y - step;
        if (y > 6 || y < -6) { ok = false; break; }
        ys.push(y); up = !up;
      }
      if (!ok) continue;
      // one highest and one lowest corner keeps "maximum at" questions single-answer
      const mx = Math.max(...ys), mn = Math.min(...ys);
      if (ys.filter((v) => v === mx).length > 1 || ys.filter((v) => v === mn).length > 1) continue;
      return makePw(xs, ys);
    }
    throw new Error("zigzag: no graph found");
  }
  function makePw(xs, ys) {
    const f = (x) => {
      for (let i = 0; i < xs.length - 1; i++) if (x >= xs[i] - 1e-9 && x <= xs[i + 1] + 1e-9) return ys[i] + ((ys[i + 1] - ys[i]) * (x - xs[i])) / (xs[i + 1] - xs[i]);
      return NaN;
    };
    const runs = xs.slice(0, -1).map((x, i) => ({ a: x, b: xs[i + 1], up: ys[i + 1] > ys[i] }));
    return { xs, ys, f, runs, pts: xs.map((x, i) => [x, ys[i]]), lo: xs[0], hi: xs[xs.length - 1],
      max: Math.max(...ys), min: Math.min(...ys) };
  }
  const graphOf = (P, extra = {}) => Object.assign({ window: W, paths: [{ pts: P.pts }], closed: [P.pts[0], P.pts[P.pts.length - 1]] }, extra);
  const iv = (a, b, lc = "[", rc = "]") => `${lc}${a}, ${b}${rc}`;

  // ───────────────────────── Key features from graphs and tables ─────────────────────────
  add({ id: "u3.fe.y-intercept", skill: "u3.features", level: L.B, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r, { withZero: true });
      return { key: [P.xs, P.ys], answer: P.f(0), graph: graphOf(P),
        prompt: "The graph of $y = f(x)$ is shown. What is the $y$-intercept of the graph?",
        hint: "The y-intercept is where the graph crosses the y-axis, where $x = 0$.",
        solution: `At $x = 0$ the graph is at $y = ${P.f(0)}$. The $y$-intercept is **${P.f(0)}**.` };
    } });

  add({ id: "u3.fe.max-min", skill: "u3.features", level: L.B, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r), askMax = r.chance(0.5);
      const v = askMax ? P.max : P.min;
      return { key: [P.xs, P.ys, askMax], answer: v, graph: graphOf(P),
        prompt: `The whole graph of $y = f(x)$ is shown. What is the ${askMax ? "maximum" : "minimum"} value of $f$?`,
        hint: `The ${askMax ? "maximum" : "minimum"} value is the ${askMax ? "greatest" : "least"} $y$-value on the graph.`,
        solution: `The ${askMax ? "highest" : "lowest"} point is $${pt(P.pts[P.ys.indexOf(v)])}$. The ${askMax ? "maximum" : "minimum"} value is the $y$-value, **${v}**.` };
    } });

  add({ id: "u3.fe.increasing", skill: "u3.features", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 3 }), askUp = r.chance(0.5);
      const runs = P.runs.filter((x) => x.up === askUp), other = P.runs.filter((x) => x.up !== askUp);
      const R0 = r.pick(runs), O = r.pick(other);
      const yA = P.f(R0.a), yB = P.f(R0.b);
      const m = mcq(`$${iv(R0.a, R0.b, "(", ")")}$`, [
        { text: `$${iv(O.a, O.b, "(", ")")}$`, why: `On that interval the graph goes ${askUp ? "down" : "up"} from left to right.` },
        { text: `$${iv(Math.min(yA, yB), Math.max(yA, yB), "(", ")")}$`, why: "Those are y-values. Intervals of increase and decrease use x-values." },
        { text: `$${iv(P.lo, P.hi, "(", ")")}$`, why: `The graph does not ${askUp ? "rise" : "fall"} over the whole domain.` },
      ], r, [{ text: `$${iv(R0.a - 1, R0.b + 1, "(", ")")}$`, why: "That interval goes past the turning points." }]);
      return { key: [P.xs, P.ys, askUp, R0.a], ...m, graph: graphOf(P),
        prompt: `The graph of $y = f(x)$ is shown. On which interval is $f$ ${askUp ? "increasing" : "decreasing"}?`,
        hint: `Read left to right. Where does the graph go ${askUp ? "up" : "down"}?`,
        solution: `From $x = ${R0.a}$ to $x = ${R0.b}$ the graph goes ${askUp ? "up" : "down"}. $f$ is ${askUp ? "increasing" : "decreasing"} on **$${iv(R0.a, R0.b, "(", ")")}$**.` };
    } });

  add({ id: "u3.fe.table-zero", skill: "u3.features", level: L.I, type: "numeric", calc: false,
    make(r) {
      const m = r.pick([2, 4, -2, -4, 3, -3]), z = r.int(-6, 10) + (Math.abs(m) % 2 === 0 && r.chance(0.4) ? 0.5 : 0);
      const b = -m * z, xs = [0, 1, 2, 3, 4];
      if (xs.includes(z)) return this.make(r);
      return { key: [m, z], answer: z,
        table: { headers: ["$x$", "$f(x)$"], rows: xs.map((x) => [String(x), String(m * x + b)]) },
        prompt: "The table shows values of a linear function $f$. What is the $x$-intercept of the graph of $f$ (the value of $x$ where $f(x) = 0$)?",
        hint: "Find the slope from the table, then work back to where the output is 0.",
        solution: `From the table the output changes by ${m} each time $x$ goes up by 1, so the slope is ${m}, and $f(0) = ${b}$. $f(x) = ${lin(m, b)}$. Set $${lin(m, b)} = 0$: $x = \\mathbf{${tex(z)}}$.` };
    } });

  add({ id: "u3.fe.select-true", skill: "u3.features", level: L.H, type: "multi", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: r.int(3, 4) });
      const iMax = P.ys.indexOf(P.max), iMin = P.ys.indexOf(P.min);
      const R0 = r.pick(P.runs);
      const a = r.int(P.lo, P.hi), b = r.int(P.lo, P.hi);
      const items = [
        { text: `The maximum value is ${P.max}.`, ok: true },
        { text: `The maximum value is ${P.xs[iMax]}.`, ok: P.xs[iMax] === P.max, why: `${P.xs[iMax]} is where the maximum happens. The value is ${P.max}.` },
        { text: `$f$ is ${R0.up ? "increasing" : "decreasing"} on $${iv(R0.a, R0.b, "(", ")")}$.`, ok: true },
        { text: `$f$ is ${R0.up ? "decreasing" : "increasing"} on $${iv(R0.a, R0.b, "(", ")")}$.`, ok: false, why: `The graph goes ${R0.up ? "up" : "down"} there.` },
        { text: `$f(${a}) ${P.f(a) > P.f(b) ? ">" : P.f(a) < P.f(b) ? "<" : "="} f(${b})$`, ok: true },
        { text: `The minimum value happens at $x = ${P.xs[iMin]}$.`, ok: true },
      ];
      // keep 5 items, at least one false
      const keep = r.shuffle(items).slice(0, 5);
      if (!keep.some((x) => !x.ok)) keep[0] = items[3];
      if (keep.every((x) => !x.ok) || new Set(keep.map((x) => x.text)).size < keep.length) return this.make(r);
      const m = multi(keep, r);
      return { key: [P.xs, P.ys, R0.a, a, b, keep.map((x) => x.text)], ...m, graph: graphOf(P),
        prompt: "The whole graph of $y = f(x)$ is shown. Select **all** true statements.",
        hint: "Values are y-values. Where things happen are x-values.",
        solution: `Highest point $${pt(P.pts[iMax])}$, lowest point $${pt(P.pts[iMin])}$. ${P.runs.map((u) => `${u.up ? "Increasing" : "Decreasing"} on $(${u.a}, ${u.b})$`).join("; ")}. $f(${a}) = ${fmt(P.f(a))}$ and $f(${b}) = ${fmt(P.f(b))}$.<br>True: ${m.answer.map((i) => m.choices[i]).join(" · ")}` };
    } });

  add({ id: "u3.fe.story", skill: "u3.features", level: L.H, type: "graph-mcq", calc: false,
    make(r) {
      // distance from home over time: away, rest, back or further
      const pts = [[0, 0]];
      let t = 0, d = 0;
      const kinds = r.shuffle(["away", "rest", "back"]);
      if (kinds[0] === "back" || (kinds[0] === "rest")) kinds.unshift("away");
      for (const k of kinds) {
        const dt = r.int(1, 3);
        t += dt;
        if (k === "away") d += r.int(2, 4) * dt;
        if (k === "back") d = Math.max(1, d - r.int(1, 3) * dt);
        pts.push([t, d]);
      }
      if (t > 10 || d > 14 || pts.some((p, i) => i && p[1] <= 0)) return this.make(r);
      const segs = pts.slice(0, -1).map((p, i) => ({ a: p[0], b: pts[i + 1][0], k: pts[i + 1][1] > p[1] ? 0 : pts[i + 1][1] === p[1] ? 1 : 2 }));
      const S = r.pick(segs);
      const choices = ["She is walking away from home.", "She is stopped.", "She is walking back toward home.", "She is at home."];
      const why = ["The distance from home would go up.", "The distance would stay the same.", "The distance from home would go down.", "Her distance from home is not 0 there."];
      return { key: [pts, S.a], choices, answer: S.k, why: why.map((w, i) => (i === S.k ? "Correct." : w)),
        graph: { window: { xmin: 0, xmax: Math.max(10, t), ymin: 0, ymax: 16, xstep: 1, ystep: 2 }, paths: [{ pts }], closed: [pts[0], pts[pts.length - 1]] },
        prompt: `The graph shows Maya's distance from home, in blocks, $t$ minutes after she leaves. What is happening from $t = ${S.a}$ to $t = ${S.b}$?`,
        hint: "Is the distance going up, staying the same, or going down?",
        solution: `From $t = ${S.a}$ to $t = ${S.b}$ the distance goes from ${fmt(pts.find((p) => p[0] === S.a)[1])} to ${fmt(pts.find((p) => p[0] === S.b)[1])} blocks. **${choices[S.k]}**` };
    } });

  add({ id: "u3.fe.solutions", skill: "u3.features", level: L.C, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 4 });
      const ks = []; for (let k = P.min + 1; k < P.max; k++) if (!P.ys.includes(k)) ks.push(k);
      if (!ks.length) return this.make(r);
      const k = r.pick(ks);
      const n = P.runs.filter((u) => (P.f(u.a) - k) * (P.f(u.b) - k) < 0).length;
      return { key: [P.xs, P.ys, k], answer: n, graph: graphOf(P),
        prompt: `The whole graph of $y = f(x)$ is shown. How many solutions does the equation $f(x) = ${k}$ have?`,
        hint: `Draw the horizontal line $y = ${k}$. Count where it meets the graph.`,
        solution: `The line $y = ${k}$ crosses the graph on ${n === 1 ? "one piece" : `${n} pieces`}: ${P.runs.filter((u) => (P.f(u.a) - k) * (P.f(u.b) - k) < 0).map((u) => `between $x = ${u.a}$ and $x = ${u.b}$`).join(", ")}. **${n}** solution${n === 1 ? "" : "s"}.` };
    } });

  add({ id: "u3.fe.count-above", skill: "u3.features", level: L.C, type: "numeric", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 3 });
      const k = r.int(P.min, P.max - 1);
      const xs = []; for (let x = P.lo; x <= P.hi; x++) if (P.f(x) > k) xs.push(x);
      if (!xs.length) return this.make(r);
      return { key: [P.xs, P.ys, k], answer: xs.length, graph: graphOf(P),
        prompt: `The whole graph of $y = f(x)$ is shown. For how many **whole-number** values of $x$ is $f(x) > ${k}$?`,
        hint: "Check each whole number in the domain. Points exactly on the line do not count.",
        solution: `The whole numbers with $f(x) > ${k}$ are ${xs.join(", ")}. That is **${xs.length}** values.` };
    } });

  // ───────────────────────── Domain, range and interval notation ─────────────────────────
  add({ id: "u3.do.ineq-to-interval", skill: "u3.domain", level: L.B, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-9, 4), b = a + r.int(2, 10), lc = r.pick(["[", "("]), rc = r.pick(["]", ")"]);
      const ineq = `${a} ${lc === "[" ? "\\le" : "<"} x ${rc === "]" ? "\\le" : "<"} ${b}`;
      const flip = (c) => ({ "[": "(", "(": "[", "]": ")", ")": "]" }[c]);
      const m = mcq(`$${iv(a, b, lc, rc)}$`, [
        { text: `$${iv(a, b, flip(lc), rc)}$`, why: `$${lc === "[" ? "\\le" : "<"}$ on the left means ${lc === "[" ? "include" : "leave out"} ${a}: ${lc === "[" ? "square bracket" : "round bracket"}.` },
        { text: `$${iv(a, b, lc, flip(rc))}$`, why: `$${rc === "]" ? "\\le" : "<"}$ on the right means ${rc === "]" ? "include" : "leave out"} ${b}.` },
        { text: `$${iv(a, b, flip(lc), flip(rc))}$`, why: "Square brackets include an endpoint; round brackets leave it out." },
      ], r);
      return { key: [a, b, lc, rc], ...m,
        prompt: `Which interval means the same as $${ineq}$?`,
        hint: "Square bracket: the endpoint is included. Round bracket: it is not.",
        solution: `${lc === "[" ? `${a} is included` : `${a} is not included`} and ${rc === "]" ? `${b} is included` : `${b} is not included`}: **$${iv(a, b, lc, rc)}$**.` };
    } });

  add({ id: "u3.do.graph-domain", skill: "u3.domain", level: L.I, type: "graph-mcq", calc: false,
    make(r) {
      const P = zigzag(r, { pieces: 3 });
      const openL = r.chance(0.5), openR = r.chance(0.5), askDomain = r.chance(0.5);
      const first = P.pts[0], last = P.pts[P.pts.length - 1];
      const g = graphOf(P, { closed: [openL ? null : first, openR ? null : last].filter(Boolean), open: [openL ? first : null, openR ? last : null].filter(Boolean) });
      let right, wrong;
      if (askDomain) {
        right = `$${iv(P.lo, P.hi, openL ? "(" : "[", openR ? ")" : "]")}$`;
        wrong = [{ text: `$${iv(P.min, P.max, "[", "]")}$`, why: "That uses y-values. The domain is the x-values." }]
          .concat([["[", "]"], ["(", ")"], ["[", ")"], ["(", "]"]].map(([p, q]) => ({ text: `$${iv(P.lo, P.hi, p, q)}$`, why: "Open circles are left out (round bracket); filled circles are included (square bracket)." })));
      } else {
        // the range ends come from the highest and lowest points; an open end only matters if the extreme is there
        const iMax = P.ys.indexOf(P.max), iMin = P.ys.indexOf(P.min), n = P.ys.length - 1;
        const maxOpen = (iMax === 0 && openL) || (iMax === n && openR), minOpen = (iMin === 0 && openL) || (iMin === n && openR);
        right = `$${iv(P.min, P.max, minOpen ? "(" : "[", maxOpen ? ")" : "]")}$`;
        wrong = [
          { text: `$${iv(P.lo, P.hi, minOpen ? "(" : "[", maxOpen ? ")" : "]")}$`, why: "That uses x-values. The range is the y-values." },
          { text: `$${iv(P.min, P.max, minOpen ? "[" : "(", maxOpen ? "]" : ")")}$`, why: "Check whether the highest and lowest points are filled or open." },
          { text: `$${iv(first[1], last[1], "[", "]")}$`, why: "The range runs from the lowest to the highest y-value, not from the ends of the graph." },
        ];
      }
      const m = mcq(right, wrong, r, [{ text: `$${iv(P.min - 1, P.max + 1, "[", "]")}$`, why: "Read the lowest and highest y-values exactly." }, { text: `$${iv(P.lo - 1, P.hi + 1, "[", "]")}$`, why: "Read the ends of the graph exactly." }]);
      return { key: [P.xs, P.ys, openL, openR, askDomain], ...m, graph: g,
        prompt: `The whole graph of $y = f(x)$ is shown. A filled circle means the point is included; an open circle means it is not. What is the ${askDomain ? "domain" : "range"} of $f$?`,
        hint: askDomain ? "Domain: the x-values the graph covers, left to right." : "Range: the y-values the graph covers, bottom to top.",
        solution: `${askDomain ? `The graph runs from $x = ${P.lo}$ to $x = ${P.hi}$` : `The lowest y-value is ${P.min} and the highest is ${P.max}`}. The ${askDomain ? "domain" : "range"} is **${right}**.` };
    } });

  add({ id: "u3.do.words", skill: "u3.domain", level: L.I, type: "mcq", calc: false,
    make(r) {
      const a = r.int(-5, 10), b = a + r.int(3, 20);
      const forms = [
        [`at least ${a} and less than ${b}`, "[", ")"], [`greater than ${a} and at most ${b}`, "(", "]"],
        [`between ${a} and ${b}, including both`, "[", "]"], [`more than ${a} but less than ${b}`, "(", ")"],
      ];
      const i = r.int(0, 3), [w, lc, rc] = forms[i];
      const all = [["[", "]"], ["[", ")"], ["(", "]"], ["(", ")"]].map(([p, q]) => `$${iv(a, b, p, q)}$`);
      const right = `$${iv(a, b, lc, rc)}$`;
      const m = mcq(right, all.filter((x) => x !== right).map((t) => ({ text: t, why: "\"At least\" and \"at most\" include the endpoint. \"Greater than\", \"less than\" and \"more than\" leave it out." })), r);
      return { key: [a, b, i], ...m,
        prompt: `The input $x$ can be any number ${w}. Which interval shows the domain?`,
        hint: "\"At least\" includes the number. \"More than\" does not.",
        solution: `**${right}**` };
    } });

  add({ id: "u3.do.context", skill: "u3.domain", level: L.H, type: "mcq", calc: false,
    make(r) {
      const start = r.pick([60, 80, 90, 100]), rate = r.pick([4, 5, 10, 20].filter((x) => start % x === 0)), askD = r.chance(0.5);
      const T = start / rate;
      const right = askD ? `$${iv(0, T)}$` : `$${iv(0, start)}$`;
      const m = mcq(right, [
        { text: askD ? `$${iv(0, start)}$` : `$${iv(0, T)}$`, why: askD ? `${start} is a battery level, an output.` : `${T} is a number of hours, an input.` },
        { text: askD ? `$[0, \\infty)$` : `$[0, \\infty)$`, why: "The model stops when the battery is empty." },
        { text: askD ? `$${iv(0, T, "(", ")")}$` : `$${iv(0, start, "(", ")")}$`, why: "Both ends happen: the start and the moment the battery hits 0%." },
      ], r);
      return { key: [start, rate, askD], ...m,
        prompt: `A phone battery is at ${start}%. It loses ${rate}% each hour until it is empty. $B(t)$ is the battery level $t$ hours from now. What is the ${askD ? "domain" : "range"} of $B$ for this situation?`,
        hint: "When does the battery reach 0%?",
        solution: `$B(t) = ${start} - ${rate}t$ reaches 0 when $t = ${start} \\div ${rate} = ${T}$. Times run from 0 to ${T}; levels run from ${start} down to 0. The ${askD ? "domain" : "range"} is **${right}**.` };
    } });

  add({ id: "u3.do.range-linear", skill: "u3.domain", level: L.C, type: "mcq", calc: false,
    make(r) {
      const m0 = r.pick([2, 3, 4, -2, -3]), b = r.int(-6, 6), a = r.int(-3, 4), openA = r.chance(0.5);
      const fa = m0 * a + b;
      const right = m0 > 0 ? `$${openA ? "(" : "["}${fa}, \\infty)$` : `$(-\\infty, ${fa}${openA ? ")" : "]"}$`;
      const m = mcq(right, [
        { text: m0 > 0 ? `$(-\\infty, ${fa}${openA ? ")" : "]"}$` : `$${openA ? "(" : "["}${fa}, \\infty)$`, why: m0 > 0 ? "The slope is positive, so outputs go up as $x$ goes up." : "The slope is negative, so outputs go down as $x$ goes up." },
        { text: `$${openA ? "(" : "["}${a}, \\infty)$`, why: "That is the domain. The range is the outputs." },
        { text: `$(-\\infty, \\infty)$`, why: "The domain is cut off at one end, so the range is too." },
      ], r, [{ text: m0 > 0 ? `$${openA ? "[" : "("}${fa}, \\infty)$` : `$(-\\infty, ${fa}${openA ? "]" : ")"}$`, why: openA ? `$x = ${a}$ is not in the domain, so ${fa} is not in the range.` : `$x = ${a}$ is in the domain, so ${fa} is in the range.` }]);
      return { key: [m0, b, a, openA], ...m,
        prompt: `$f(x) = ${lin(m0, b)}$ with domain $x ${openA ? ">" : "\\ge"} ${a}$. What is the range of $f$?`,
        hint: `Find $f(${a})$. Then decide whether the outputs go up or down from there.`,

<script>/* app/src/engine.js */
/* Adaptive engine: builds sets, grades them, and moves each skill through its levels.
   Rules are documented in CLAUDE.md and .claude/skills/grade-and-diagnose. */
(function (G) {
  const M1 = G.M1;
  const Q = M1.qlib;

  const CONFIG = (M1.config = Object.assign({
    setSize: 25,
    diagnostic: { basic: 3, intermediate: 7, hard: 8, challenge: 7 }, // 10% / 30% / 60%
    tierWeight: [4, 2, 1],         // basic-focus skills get the most questions
    minSlots: [2, 2, 3],           // per skill, by focus tier
    upShare: 0.3,                  // share of a skill's questions one tier above its focus
    secureAt: 0.8,                 // accuracy that counts toward securing a tier
    secureStreak: 2,               // sets in a row needed to secure a tier
    achieveRun: 3,                 // hard/challenge answers in a row, all correct
    reviewCount: 3,                // spaced-review questions from earlier finished units, scored separately
  }, M1.config || {}));

  const LEVELS = ["basic", "intermediate", "hard", "challenge"];
  const TIER_NAMES = ["Basic", "Intermediate", "Hard"];
  const tierOf = (level) => Math.min(2, LEVELS.indexOf(level));

  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
  }

  function unitInfo(unitId) {
    const u = (M1.curriculum.units || []).find((x) => x.id === unitId);
    if (!u) throw new Error("unknown unit " + unitId);
    return u;
  }

  function instantiate(g, seed) {
    const r = Q.rng((seed * 7919 + hash(g.id)) >>> 0);
    const q0 = g.make(r);
    const q = Object.assign({}, q0, {
      id: g.id + ":" + seed, gen: g.id, seed, skill: g.skill, level: g.level,
      type: q0.type || g.type, calc: q0.calc != null ? q0.calc : g.calc,
      fp: g.id + "|" + JSON.stringify(q0.key),
    });
    delete q.key;
    return q;
  }

  function bankQuestion(item) {
    return Object.assign({}, item, { gen: "bank", fp: "bank|" + item.id });
  }

  function newUnitState(unitId, prev) {
    const u = unitInfo(unitId);
    const skills = {};
    for (const s of u.skills) skills[s.id] = { focus: 0, streak: 0, hardRun: 0, achieved: false, right: 0, total: 0 };
    return { unitId, round: prev ? prev.round + 1 : 1, sets: 0, mastered: false, skills };
  }

  // ───────────── Building a set ─────────────
  function buildSet(unitId, state, seenList, seed) {
    const u = unitInfo(unitId);
    const content = M1.units[unitId] || {};
    const gens = content.generators || [];
    const bank = (content.bank || []).map(bankQuestion);
    const r = Q.rng(seed >>> 0);
    const seen = new Set(seenList || []);
    const diagnostic = state.sets === 0;

    let active = u.skills.map((s) => s.id).filter((id) => !state.skills[id].achieved);
    if (!active.length) active = u.skills.map((s) => s.id); // everything achieved: keep practising hard questions

    // slots: [{skill, level}]
    let slots = [];
    if (diagnostic) {
      // Walk one shuffled skill order across the level ladder so every skill is seen at 2–3 different levels.
      const order = r.shuffle(active);
      let k = 0;
      for (const level of LEVELS) for (let i = 0; i < CONFIG.diagnostic[level]; i++, k++) slots.push({ skill: order[k % order.length], level });
    } else {
      const focus = (id) => (state.skills[id].achieved ? 2 : state.skills[id].focus);
      const weights = active.map((id) => CONFIG.tierWeight[focus(id)]);
      let counts = active.map((id) => CONFIG.minSlots[focus(id)]);
      let used = counts.reduce((a, b) => a + b, 0);
      while (used > CONFIG.setSize) { // too many skills for the minimums: trim the strongest first
        const i = counts.findIndex((c, k) => c > 1 && focus(active[k]) === Math.max(...active.map(focus)));
        counts[i >= 0 ? i : counts.indexOf(Math.max(...counts))]--; used--;
      }
      const totalW = weights.reduce((a, b) => a + b, 0);
      const extra = CONFIG.setSize - used;
      const shares = weights.map((w) => (w / totalW) * extra);
      counts = counts.map((c, i) => c + Math.floor(shares[i]));
      const rema = shares.map((s, i) => [s - Math.floor(s), i]).sort((a, b) => b[0] - a[0]);
      let left = CONFIG.setSize - counts.reduce((a, b) => a + b, 0);
      for (let k = 0; left > 0; k++, left--) counts[rema[k % rema.length][1]]++;
      active.forEach((id, i) => {
        const f = focus(id);
        const up = f < 2 ? Math.round(counts[i] * CONFIG.upShare) : 0;
        for (let k = 0; k < counts[i]; k++) {
          const tier = k < counts[i] - up ? f : f + 1;
          const level = tier === 2 ? (r.chance(0.5) ? "hard" : "challenge") : LEVELS[tier];
          slots.push({ skill: id, level });
        }
      });
    }

    // Fill each slot with a fresh question, keeping the question types mixed.
    const typeCount = {};
    const inSet = new Set();
    const questions = [];
    for (const slot of slots) {
      const q = pickQuestion(slot, gens, bank, r, seen, inSet, typeCount);
      if (!q) continue;
      questions.push(q);
      inSet.add(q.fp);
      typeCount[q.type] = (typeCount[q.type] || 0) + 1;
    }
    // Ramp up: easier tiers first, shuffled within a tier.
    const ordered = [];
    for (const lv of LEVELS) ordered.push(...r.shuffle(questions.filter((q) => q.level === lv)));
    return { id: "s" + Date.now().toString(36) + r.int(100, 999), unitId, round: state.round, setNumber: state.sets + 1,
      diagnostic, createdAt: new Date().toISOString(), questions: ordered };
  }

  // Spaced review: a few questions from units the student already finished, added after the 25.
  // They are marked review and never count toward the unit's score, levels or mastery.
  function reviewQuestions(unitIds, seenList, seed, n = CONFIG.reviewCount) {
    const r = Q.rng(seed >>> 0);
    const seen = new Set(seenList || []);
    const pool = unitIds.filter((id) => ((M1.units[id] || {}).generators || []).length);
    const out = [];
    for (let k = 0; k < n * 4 && out.length < n && pool.length; k++) {
      const uid = pool[(k + r.int(0, pool.length - 1)) % pool.length];
      const gens = M1.units[uid].generators.filter((g) => g.level !== "basic");
      const g = r.pick(gens);
      let q;
      try { q = instantiate(g, r.int(1, 2e9)); } catch (e) { continue; }
      if (seen.has(q.fp) || out.some((x) => x.fp === q.fp || x.gen === q.gen)) continue;
      out.push(Object.assign(q, { review: true, reviewUnit: uid }));
    }
    return out;
  }

  // Written bank items store the right choice first; shuffle choices (and their notes) when one is picked.
  function shuffleChoices(q, r) {
    if (!Array.isArray(q.choices) || q.noShuffle) return q;
    const order = r.shuffle(q.choices.map((_, i) => i));
    const out = Object.assign({}, q, { choices: order.map((i) => q.choices[i]) });
    if (Array.isArray(q.why)) out.why = order.map((i) => q.why[i]);
    out.answer = Array.isArray(q.answer) ? q.answer.map((a) => order.indexOf(a)).sort((x, y) => x - y) : order.indexOf(q.answer);
    return out;
  }

  function pickQuestion(slot, gens, bank, r, seen, inSet, typeCount) {
    const levelsToTry = [slot.level].concat(nearby(slot.level));
    for (const level of levelsToTry) {
      const cands = gens.filter((g) => g.skill === slot.skill && g.level === level);
      const bankC = bank.filter((b) => b.skill === slot.skill && b.level === level && !seen.has(b.fp) && !inSet.has(b.fp));
      // Least-used type first so a set mixes mcq, numeric, graphs and multi-select.
      const ranked = r.shuffle(cands).sort((a, b) => (typeCount[a.type] || 0) - (typeCount[b.type] || 0));
      if (bankC.length && r.chance(0.35)) return shuffleChoices(r.pick(bankC), r);
      for (const g of ranked) {
        for (let tries = 0; tries < 40; tries++) {
          let q;
          try { q = instantiate(g, r.int(1, 2e9)); } catch (e) { continue; }
          if (!seen.has(q.fp) && !inSet.has(q.fp)) return q;
        }
      }
      if (bankC.length) return shuffleChoices(r.pick(bankC), r);
    }
    return null;
  }
  function nearby(level) {
    const i = LEVELS.indexOf(level);
    return [i + 1, i - 1, i + 2, i - 2, i + 3, i - 3].filter((k) => k >= 0 && k < 4).map((k) => LEVELS[k]);
  }

  // ───────────── Grading ─────────────
  function isCorrect(q, resp) {
    if (resp == null || resp === "") return false;

        // No basic question for this skill and under half the intermediate ones right: start at Basic.
        else if (a1 !== null && a1 < CONFIG.secureAt) sk.focus = a0 === null && a1 < 0.5 ? 0 : 1;
        else if (a1 === null) sk.focus = a0 === null ? 0 : 1;
        else sk.focus = 2;
        sk.streak = 0;
        events.push({ kind: "placed", skill: id, text: `${name(id)}: starting at ${TIER_NAMES[sk.focus]}` });
      } else if (!sk.achieved) {
        const a = acc(sk.focus);
        if (a !== null) {

          if (sk.streak >= CONFIG.secureStreak && sk.focus < 2) {
            sk.focus++; sk.streak = 0;
            events.push({ kind: "up", skill: id, text: `${name(id)}: moved up to ${TIER_NAMES[sk.focus]}` });
          } else if (a < 0.5 && sk.focus > 0 && g.tiers[sk.focus][1] >= 2) {
            // Struggling badly at this tier: step back to rebuild the base.
            sk.focus--; sk.streak = 0;

    set.questions.forEach((q, i) => {
      const sk = st.skills[q.skill];
      if (!sk || q.review || tierOf(q.level) < 2) return;

/* Renders question text: $…$ math (KaTeX → MathML, no stylesheet needed), \$ for a dollar sign,
   **bold**, and <br>. Content comes only from our own generators and bank. */
(function (G) {
  const M1 = G.M1;

  function mathToHtml(tex, display) {
    if (G.katex) {
      try {
        return G.katex.renderToString(tex, { output: "mathml", throwOnError: false, displayMode: !!display });
      } catch (e) { /* fall through */ }
    }
    return `<code>${escapeHtml(tex)}</code>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // Text pieces: escape, then allow **bold** and <br>.
  function textToHtml(t) {
    return escapeHtml(t.replace(/\\\$/g, "\u0000"))
      .replace(/&lt;br&gt;/g, "<br>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\u0000/g, "$");
  }

  function render(src) {
    const s = String(src == null ? "" : src);
    let out = "", i = 0, buf = "";
    while (i < s.length) {
      if (s[i] === "\\" && s[i + 1] === "$") { buf += "\\$"; i += 2; continue; }
      if (s[i] === "$") {
        const end = findClose(s, i + 1);
        if (end < 0) { buf += s.slice(i); break; }
        out += textToHtml(buf); buf = "";
        out += mathToHtml(s.slice(i + 1, end), false);
        i = end + 1;
        continue;
      }
      buf += s[i++];
    }
    return out + textToHtml(buf);
  }
  function findClose(s, from) {
    for (let j = from; j < s.length; j++) {
      if (s[j] === "\\") { j++; continue; }
      if (s[j] === "$") return j;
    }
    return -1;
  }

  M1.math = { render, escapeHtml };

/* Student tools: coordinate grid (display, plotting answers, scratch graphing),

        <label>to <input id="sg-xmax" type="number" value="10"></label>
        <label>y from <input id="sg-ymin" type="number" value="-10"></label>
